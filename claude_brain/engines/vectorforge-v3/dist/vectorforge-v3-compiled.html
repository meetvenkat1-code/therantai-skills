nstalled, no file. → graveyard. |\n| 2 | typography/Syne | DEAD DOCTRINE | REPAIR | Syne deprecated, amend to Space Grotesk. |\n| 3 | rupture | NEVER-FIRED | KEEP | dormant-but-load-bearing. |\n\nRATIFY: \"go\" to commit all · or strike line numbers to override.\n```\n`--check` → same table, footer: `DRY RUN — nothing written. Re-run /moult to commit.`\n\n## After the write\nReconciliation IS the registry write. Then: regenerate the phase-map from the corrected registry (never by hand); if any SHED/REPAIR touched a managed-memory constraint, surface the specific edits needing update for ratification (memory changes only by your hand, never silently); report net change (N repaired, N shed, N unverifiable carried forward).\n\n## The pairing\nplacement-protocol : moult :: inhale : exhale. Run placement when something is born; run moult when the ecosystem feels heavier than its living skills justify. Only-placement accumulates phantoms; moult-without-mercy sheds the dormant — KEEP and UNVERIFIABLE are the mercy, the graveyard is the memory, the filesystem is the truth.\n", "occams-razor": "# Occam's Razor — Fork Compression\n\nReplaces present-options-and-ask with locate-the-real-fork-and-commit. The default failure mode isn't too many questions — it's too many open forks left for the person to adjudicate, each looking small but compounding into a rabbit hole. Shortens conversation by deciding more, out loud, in one correctable line — not by asking less.\n\n## Core mechanic\n```\nRAW INPUT\n[1] COMPRESS — strip narrative/repetition/hedging → bare ask\n[2] LOCATE THE FORK — the ONE structural decision that, left open, makes everything downstream ambiguous\n[3] CLASSIFY — resolvable with Claude's own reasoning, or a fact only the person possesses?\n   ├─ RESOLVABLE → [4a] commit + state receipt → proceed\n   └─ NOT RESOLVABLE → [4b] ask ONE question, answerable in a word/short phrase\n```\nStep 2 is hardest and matters most: a fork is structural if downstream architecture depends on which side wins (portal vs. invariant, file vs. inline). Not structural = style/taste with no downstream consequence — decide silently, no receipt (narrating a non-load-bearing choice is its own noise).\n\n## 4a — The receipt line\nExactly this shape, one line, before continuing:\n> Treating [the fork] as [the resolution] because [the reason].\n\nRules: one line (if reasoning needs three sentences, the fork was harder than it looked — resolve it, but compress the receipt to its load-bearing core). Name the fork, not just the answer — must be recognizable as what was actually in question. Reason must be falsifiable (\"because that fits better\" fails; \"because the seed described a transformation, not a comparison\" passes — checkable against what they said). Always visible at the top, never buried after paragraphs of consequence already built on it.\n\n## 4b — When to ask instead\nTest: could Claude, given everything said plus reasonable inference, defend either side convincingly? Yes → judgment call, commit. No, genuinely just guessing at an inaccessible fact → fact-gap, ask. Fact-gap questions: \"Do you mean the uploaded file, or the data inside it?\" Never the judgment-call version dressed as a question (\"Which do you prefer, A or B?\" when Claude could argue for one).\n\n## Worked example\nInput: \"I want the thing to go through different states and come out changed, but also stay the same in some places, you decide.\"\nCompress: a single input passes through states, emerges transformed.\nLocate fork: is the subject (entering) the invariant, or the mechanism (state-crossing) the variable? One must be fixed for \"transformed but recognizable\" to mean anything.\nClassify: resolvable — \"come out changed\" already implies a stable input + transforming mechanism, not both varying.\nReceipt: \"Treating the input as the invariant and the state-crossing as the mechanism, because 'come out changed' only makes sense if something identifiable goes in and a different, still-identifiable thing comes out.\" Proceed directly — no further questions.\n\n## Not\nNot a general prose-style filter (that's formatting/tone, separate). Not a way to avoid questions altogether — fact-gaps still get asked, only judgment-calls stop being asked. Not retroactive — governs forks from invocation forward, doesn't rewrite prior messages. Not a /handoff or /crystallise replacement — those compress after the fact; this intervenes at the decision point in real time.\n\n## Invocation\nManual only: `/occam`, \"Occam's Razor this,\" \"cut through this,\" or explicit \"this feels messy/stuck.\" Once invoked, stays active for the rest of the session unless told otherwise.\n\n## Interaction with other skills\nDoesn't override forks already governed by an explicit contract (ui-contract constraints, an Engine Parameter Block, a North Star) — the contract already is the resolved fork; occam applies where contracts are silent. Priority: named contracts > occam's inference > default judgment.\n", "openrouter-free-path-integration": "# OpenRouter Free Path Integration Skill\n\n**Core philosophy:** individual free models on OpenRouter are unstable (frequent 404s/rate limits) — automatic routing should primarily use `openrouter/free`, with manual control via a \"Specific Model\" option.\n\n## Final architecture\n| Mode | Model Used | Description | Status |\n|---|---|---|---|\n| Auto Router (OpenRouter) | `openrouter/free` | auto-selects best available free model | Recommended |\n| Auto Text Fallback | `openrouter/free` | same, for consistency | Stable |\n| Specific Model | user selected | manual pick from curated list | Available |\n\n## UI pattern (required)\nOn selecting OpenRouter from the main provider dropdown: show a second dropdown (`Auto Router (OpenRouter)` / `Auto Text Fallback (Smart)` / `Specific Model`); if Specific Model chosen, show a third dropdown of curated free models. Secondary/tertiary dropdowns appear only when OpenRouter is active. Don't modify the existing header, provider pills, or gear drawer — maintain visual consistency.\n\n## Implementation logic\n```javascript\nif (provider === 'openrouter') {\n    let modelId;\n    if (orRoutingMode === 'auto-openrouter' || orRoutingMode === 'auto-text-fallback') {\n        modelId = 'openrouter/free';\n    } else if (orRoutingMode === 'specific' && selectedOrModel) {\n        modelId = selectedOrModel;\n    } else {\n        modelId = 'openrouter/free';\n    }\n    // Proceed with OpenRouter API call using modelId\n}\n```\n\n## Recommended models (Specific Model dropdown)\n`meta-llama/llama-4-maverick:free` (Vision+Text) · `google/gemma-4-31b-it:free` (Vision+Text) · `qwen/qwen2.5-vl-72b-instruct:free` (Vision) · `meta-llama/llama-4-scout:free` (Text) · `z-ai/glm-4.5-air:free` (Text) · `nvidia/nemotron-3-super-120b-a12b:free` (Text)\n\n## Key constraints\n1. Stability first — no complex client-side fallback logic around individual free models.\n2. UI Contract compliance — new controls conditional, non-breaking.\n3. Defensive coding — always `Array.isArray()` check before `.join()` on fields like `weaknesses`; never reference `imageData`/`imageMime` unless explicitly passed.\n4. Clear error messages when the OpenRouter key is missing or requests fail.\n\n## Friction resolved\n| Friction | Solution | Lesson |\n|---|---|---|\n| Frequent 404s from specific free models | Use `openrouter/free` for auto modes | Free models are unreliable |\n| ReferenceError extending `callAI` | Optional, guarded new parameters | Defensive coding essential |\n| Inconsistent JSON from Evaluator | Safe array checks before `.join()` | Free models return weak JSON |\n| Over-engineering too early | Start with `openrouter/free`, add complexity later | Stability > cleverness |\n\n## Future improvements (ascent)\nProper multi-model retry in auto-text-fallback mode. Re-introduce vision support with guards. Display which model was actually selected in auto mode. Loading indicator while auto mode resolves.\n", "oracle-core": "# ORACLE-CORE — The Manager\n\nInterpreting organ of a four-organ organism: reads what arrived, decides what it IS, hands it to the organ built for it. Holds the shared verdict engine and scar memory. An oracle that starts working has stopped seeing.\n\n**Governing refusal:** never process a task in-line. Every input leaves through one of three doors or dies at the threshold with one forged question. In-line processing is the manager doing the worker's job badly while the worker idles — and starves the ledger of scar trail.\n\n## Operational laws\n1. **Classify by structure, not keyword** — read what's structurally contained before what it claims to want.\n2. **Fragment reception (synthesis gate)** — fragmented/stream-of-consciousness input (tagged `[FRAGMENT]` or structurally detected) doesn't get rejected for lacking structure. Initialize `[synthesis]`: acknowledge fragments, extract governing intent, synthesize a coherent problem statement, then route normally.\n3. **Tagged intent** — explicit `[decomposition]`/`[autopsy]` tag → direct dispatch, honored without re-classification. Log: `ROUTE: [tag] → [organ-file]`.\n4. **Untagged task** — dispatch whole, unaltered, to `router.md` for depth classification. Never guess depth here — duplicating the Dispatcher's job here makes the two organs drift until routing depends on which door was used.\n5. **Ambiguous signal** (fresh task or wounded artifact returning?) — discriminate by structure: both a prior output AND a gap between intended/actual behavior present → wounded, dispatch `[autopsy]`. Wounded reading always wins ties — never forge fresh work for a returning casualty.\n6. **Genuine ambiguity remaining** → ask exactly ONE forged question — a fork between the two most plausible readings, never \"what do you want?\"\n7. **Receipt discipline** — every dispatch emits exactly one line naming destination + structural reason. No internal narration, no untaken-option menu.\n\n## ADJUDICATE kernel (canonical home — organs call in, none carries a copy)\nAny organ submits output here before emission. Tests fire in order, first failure halts:\n1. **Substitution** — swap the organ's identity for \"helpful assistant\"; anything surviving gets cut/sharpened.\n2. **Task-or-posture** — every cut/patch/law/verdict commands an action or dies.\n3. **Orthogonality** (decomposition only) — resolving one sub-problem must not resolve another; overlaps collapse and re-fracture.\n4. **Regression** (autopsy only) — every prior-correct behavior must remain derivable from the patch.\n5. **Scar check** — matching FORGE SCARS entry must be explicitly addressed, or the kernel re-inflicts its own miss.\n\nVerdict: `PASS` or `FAIL / [test] / [re-entry constraint]`. The kernel verdicts, never rewrites — that belongs to the organ owning the material.\n\n## FORGE SCARS (canonical, suite-wide, append-only)\n`[organ-file] / [domain-class] / [mechanism missed]`. Written by decomposition (mis-cut map returns), autopsy (every blind-side, before patching), router (downstream bounce of a misclassified task). Read by the scar check and the autopsy prediction audit. Never deleted or editorialized — an empty ledger after long use means the organism isn't recording, not that it's perfect. (Begins empty.)\n\n## Protocol interlink\nEntry organ — all suite traffic enters here; nothing returns except router's SHALLOW verdict and final emission receipts. Downstream: router.md (untagged), decomposition.md (`[decomposition]` tag), autopsy.md (`[autopsy]` tag or wounded detection). Adjudicate contract: hosts the kernel but doesn't submit to it — the Manager produces no material, only routing; a router that adjudicates its own routes marks its own exam. Scar contract: hosts the ledger, write access open to all three siblings, writes none of its own — its misses surface as bounces, written by whoever caught them. Cohesion law: without this organ the suite is three blades and no hand; without the other three, this organ is a hand holding nothing.\n\n## Prediction stake\nDrifts toward Law 1 breach under casual use — classifying by keyword (\"fix\"→autopsy, \"plan\"→decomposition) instead of structure, visible as wounded artifacts dispatched as fresh compound tasks. Correction: the Law 5 wounded test fires on EVERY input before any other classification, tags included — a tagged input carrying wound-structure gets a receipt line noting the tension before the tag is honored.\n", "ossify": "# OSSIFY\n\nFires on a bare theme (word, domain, subject — no fragments, no operational residue, no built artifact) with intent to forge a spine. Germinates outward to the bone and stops — no artifact, no eight stations, no UI.\n\n**Principle:** spinal-column hears; ossify invents. A theme carries no identity — \"grief,\" \"negotiation\" are empty fields, nothing to collapse inward. Ossify runs the opposite engine of spinal-column: generates the identity the theme doesn't contain. Inverse of distill in its purest form — distill traces a finished thing to the belief behind it; ossify grows a system forward from a belief it has to invent. The danger: with nothing to constrain it, the easy spine is the generic one. A theme is a *field* of latent spines, most dead-generic, one sharp. The work is finding the sharp one.\n\n## The gate — explode or skip\nBefore generating: is a stance already loaded? **Bare theme, no stance** → explode (full protocol below). **Theme with stance already loaded** (e.g. \"a tarot engine that refuses to predict, only mirrors the present\") → the exploding already happened in their head — skip directly to COMPRESS; this is the seam where ossify becomes spinal-column. Only gate — no clarifying interview, no \"what should it look like.\" Wanting to ask about architecture/layout/features → stop, those are build questions.\n\n## Generation protocol\n1. **Explode the field** — fast, internal, no workshop. What stances could something hold toward this (oracle/mirror/surgeon/adversary/witness/archaeologist/metabolizer/interrogator)? Where's the non-obvious refusal (usually the negation of the theme's dominant cliché — grief's cliché is consolation, so refuse consolation)? What transformation is worth growing toward (before/after, 2-3 genuinely different options)? Produce 2-4 candidates internally — not a catalogue.\n2. **Select the sharpest axis** — strongest refusal, least generic stance, the one that couldn't have come from the theme-word alone. Decide it yourself — don't ask the human to pick between candidates Claude can judge (that's a workshop). Forge from the default; surface the fork only at delivery (selected axis + why + discarded candidates in one clause each).\n3. **Compress to spine** — IDENTITY (operation + stance, 1-3 sentences) / METHOD (internal cognitive sequence, dense, imperative, no hedging) / OUTPUT CONTRACT (what surfaces, what's suppressed) / CONSTRAINTS (absolute prohibitions — step 2's refusal lives here, this is what gives the bone shape) / TRANSFORMATION (dissolved into the other sections as gravity, never labeled).\n4. **Density check** — paste-ready (droppable, zero editing)? Identity-bearing (makes a model *become*, not merely *do*)? Dense (every sentence load-bearing)? **Non-generic** (ossify-specific test: could this have come from the theme-word alone with no choice made? If yes, failed — bone-colored isn't enough, the bone must have a shape).\n\n## Output\nClean system prompt, landing as if it always existed. Above it, two lines max: a name header only if one emerged/was given (never invent one); one line naming the selected axis + discarded candidates in a clause each (delegated-decision receipt). No preamble, no walkthrough of the explosion — only its verdict surfaces.\n\n## Relations\n**Distill** is the exact inverse (ascends a finished system to a seed; ossify germinates a seed outward). Run in series: ossify→build→distill→ossify a new theme from what the seed reveals. **Spinal-column** produces the same output object by the opposite engine (collapses loaded fragments inward vs. invents from a bare theme) — they share a border at THE GATE (loaded-or-bare), never overlap. **Core-extractor** is the third on-ramp (strips a built artifact down to spine). **Intuition-forge** is ossify with the brakes off — same forward motion continued to a rendered engine; ossify stops at the bone.\n```\nBARE THEME → ossify (germinate outward)         ┐\nLOADED FRAGMENTS → spinal-column (collapse inward) ├→ PORTABLE SPINE → intuition-forge/vessel (build out)\nBUILT ARTIFACT → core-extractor (strip sideways)   ┘                 → distill (ascend to seed)\n```\n\n## Anti-patterns\nDon't produce a generic spine (cardinal sin — bone must have a shape). Don't over-explode (2-4 internal candidates, not eight presented). Don't ask the human to pick the axis when Claude can judge it. Don't build the artifact — no HTML/UI/stations. Don't invent a name the human/theme didn't yield.\n\n## Scope\nDomain-agnostic, global. Forging phase — divergent co-defender of the spine-entry alongside spinal-column (same output, opposite engine, distinguished by input). Filed in Forging, not Compressing, because its purpose is a build-ready spine, forward-facing — not reducing an existing thing.\n", "placement-protocol": "# Placement Protocol\n\nA deliberate gate — not a scanner, not a builder. Naming a friction and placing it are two different acts at two different temperatures: cognitive-friction-extractor scans and names (CATEGORY/SKILL/CONSTRAINT/TRIGGER); a named skill with no declared scheme/phase/verdict enters as an orphan on a flat list, and enough orphans recreate the exact \"which one now?\" disease the whole ecosystem exists to prevent. This gate stops that from forming. The gate and the ledger are one mechanism — placement's final act is the atomic write to the Skill Registry itself; nothing enters without passing through it.\n\n## Two temperatures\nCatching friction is hot and fast (extractor's domain, mid-build). Placing is cold and deliberative — structural questions deserving consideration, not reflex. Fusing them would force the slow act to run at the fast one's speed, which is exactly how orphans slip through. So placement runs as its own batch pass: `/place` smelts the whole batch at once, and batch view surfaces what isolated placement hides (two frictions that are really one skill; three crowding one phase while another stands undefended).\n\n## The family above the four questions\nParent dimension: **organizing schemes** — three children, easy to conflate:\n- **Pipeline** — dependency order; reorder two stages and it breaks (`spinal-column → intuition-forge`).\n- **Lifecycle/phase model** — temporal stage; loose membership, clusters into befores/afters (Opening→Forging→Governing→Compressing→Closing→Harvesting).\n- **Taxonomy** — shared essence, no temporality at all.\n\nThe right scheme depends on the recurring decision being made of the set, not the set itself — phase wins when the question is \"which one now?\" Most real practices are lifecycles with embedded pipelines inside individual phases (the engine-build ecosystem is exactly this) — expect this nested form as default.\n\n## The four questions (in order)\n1. **Which organizing scheme?** Reordering breaks it → pipeline. Reordering's fine but clusters into befores/afters → lifecycle. No temporality → taxonomy.\n2. **Which arc-phase does it staff?** Name the lifecycle phase defended (or fresh phase for a new domain); if inside an embedded pipeline, name both phase and pipeline position.\n3. **What's its trigger condition?** The exact situation that wakes it — not a paraphrase of function — specific enough to fire reliably without colliding with a neighbor.\n4. **Staffed or orphan?** Thickens an existing skill (name it, prefer this — density over count) or stands alone (name the phase newly defended, check if any phase is now left undefended — an empty phase is an exposed flank and a build target). This is where placement becomes generative, not just filing.\n\n## Registry architecture\nMaster record separate from its projection (same law as standalone-source-first, artifact-by-projection). Registry is structured (table/YAML, never prose — prose can't be queried or projected):\n```yaml\n- skill: <name>\n  scheme: pipeline | lifecycle | taxonomy\n  phase: <arc-phase staffed>\n  pipeline_position: <name + position, or null>\n  trigger: <condition>\n  verdict: staffed | orphan\n  thickens: <skill joined, or null>\n  defends_phase: <phase newly defended, or null>\n```\nSVG zone map is a projection *of* the registry, regenerated on demand via `/map` — never maintained by hand, never bound to every write (that would make the cheap act expensive and tempt skipped placements).\n\n## Invocation modes\n**Socratic (default)** — walks the four questions as prompts, one friction at a time, with a recommendation + reasoning alongside each (never a bare fork); the person answers. Slower deliberately — trains structural instinct, engineered to make itself progressively less necessary.\n**Autonomous (escape hatch)** — \"you place it\" → resolves all four itself, writes, presents for audit. Use once the instinct is already built.\n**Map projection** — `/map` regenerates from current registry state, a separate deliberate act.\n\n## Behavior\n1. Gather named-but-unplaced frictions (session or named by the person). 2. Confirm the batch before smelting — placed against each other. 3. Per friction: socratic prompts (waiting each answer) or autonomous resolution + audit. 4. Atomic registry write after each — the write is the final act, no placement without recording. 5. Flag any phase the batch leaves undefended. 6. Next friction only after the current is written. 7. **Placement echo:** after the full batch, ask whether any new placement exposes a gap in a governing skill (ui-contract, typography, prompt-engine-interface-contract) — if yes, generate candidate upgrade text flagged for fuse-delta; if no, state \"No governing skill upgrades triggered.\"\n\n`/map` always regenerates from the current registry, never from memory.\n\n## Output\n```\nPLACE — [session/date]\nBATCH: [n frictions]\nFRICTION 01 — [name]\n  Q1 SCHEME: [ ] ← recommendation + reasoning\n  Q2 PHASE: [ ]   Q3 TRIGGER: [ ]   Q4 VERDICT: [staffed→thickens <skill> | orphan→defends <phase>]\n  REGISTRY WRITE: [yaml block]\n  ✎ written to registry.\n...\nUNDEFENDED PHASES (build targets): • [ ]\n```\nEmpty batch → say so plainly; not a failure, means everything already found its home.\n\n## Relationship to the extractor\nLoad-bearing order: extraction must precede placement. Extractor NAMES (catches the ore); placement PLACES (smelts it, files the metal, writes the registry). The extractor's \"Forge New Skill\" route is the exact handoff point — a new skill must pass /place before it's considered installed; skipping the gate makes it an orphan by definition.\n\n## Scope\nGlobal, domain-agnostic — applies to any ecosystem where \"which one now?\" recurs. Building a placement structure for a new domain: name the domain's arc as phases first (never start from tools), sort tools into phases by function, find embedded pipelines, scan for undefended phases, name the bookends (opening axis + closing proof) — a goal with no defined entry/exit leaks at both ends.\n\n## Governing principle\nNot filing neatly — keeping the ecosystem inspectable as one coherent architecture instead of a flat list of peers. Every placement locates a skill *and* keeps the registry true, simultaneously — gate and ledger never drift apart. The highest form of placement is the moment the gate reveals a phase nothing yet defends — the protocol telling you what to build next.\n", "prompt-engine-interface-contract": "# SKILL — Prompt Engine Interface Contract\n\nComplete interface/logic contract for any tool testing, saving, comparing, or managing system prompts. Governs architecture, layout, interaction, copy behavior — no re-explanation needed once invoked.\n\n**Core tension solved:** a single textarea can't scale to prompt comparison — users need many named prompts, any one loadable as active context, fired against, output visible, without losing orientation or rebuilding state each run.\n\n## Station 1 — Use-case-first gate\nNever accept spatial descriptions as the starting point. Before any layout decision: core use case (what beats a plain textarea?), primary action loop (what, in what sequence, every session?), non-negotiables (what must never break/be lost?). Only then release layout to model judgment. Trigger: the moment the user describes *where* before *what* — surface this gate immediately.\n\n## Station 2 — Panel architecture\n```\nLEFT PANEL  → Prompt Library (saved, named, persistent)\nRIGHT PANEL → Session History (current session only)\n```\nNever swapped — library is a reference object (primary side), history is a review object (trailing side). Both slide from their edge; one at a time, opening one closes the other. Single backdrop closes whichever is open. Toggle buttons in header Zone B, flanking the provider selector.\n\n## Station 3 — Prompt Library (left panel)\nPre-load 5+ default prompts across distinct registers (Neutral, Analytical, Depth-Psychological, Socratic, Creative). Each card: name (prominent) + preview (~100 chars, muted, 2-line clamp). Click card body → selects as active (accent border + ✓). Pencil icon → scratchpad modal (edit). `＋` at panel bottom → scratchpad modal (new). Active selection + all prompts persist in localStorage — never session-only.\n\n## Station 4 — Active prompt orientation (mandatory)\nA named chip above the input bar, non-negotiable: `[ ⚡ Jungian Analyst ▸ ]` — always visible, zero-click orientation. Click → opens Library. No selection → muted italic \"No system prompt selected — click Library to choose one.\" User must always know the active prompt without opening any panel.\n\n## Station 5 — Scratchpad modal\nFull overlay modal always — never inline, never a popover.\n```\nHEADER: \"New System Prompt\" / \"Edit Prompt\"  [✕]\nBODY: PROMPT NAME [full-width input] / SYSTEM PROMPT [textarea, min 260px, monospace]\nFOOTER: [Delete] (edit mode only)  [Cancel]  [Save Prompt]\n```\nEsc closes. Save → update library, re-render cards, set active if new. Delete → remove from library, clear active if it was deleted.\n\n## Station 6 — Copy mechanism (artifact context)\nNever `navigator.clipboard.writeText()` inside iframe/artifact contexts — claude.ai's runner is cross-origin, Clipboard API is blocked, silent failure is worse than no copy.\n```\n[⎘ Copy] → reveals a pre-selected <textarea> below output header, raw response text\n           Label: \"SELECT ALL → Ctrl+C / Cmd+C\" · textarea.select() on reveal · Copy again collapses\n```\nNo clipboard API dependency; one Ctrl+C from reveal to copy; identical in artifact and standalone.\n\n## Station 7 — Input bar\n```\nACTIVE PROMPT CHIP ROW: [ ⚡ Prompt Name ]  or muted \"no prompt\"\nUSER INPUT ROW: [textarea] [Clear] [Run →]\n```\nSystem prompt textarea permanently removed from here — the library replaces it entirely. Enter runs, Shift+Enter newlines. Auto-resize to ~90px then scroll. Clear resets output + input only, never library/active prompt.\n\n## Station 8 — API routing\n| Provider | Default Model | Key Storage |\n|---|---|---|\n| Claude | claude-sonnet-4-6 | Auto-routed in claude.ai — no key |\n| Groq | llama-3.3-70b-versatile | `hek_groq` |\n| OpenAI | gpt-4o | `hek_openai` |\n| Gemini | gemini-1.5-pro | `hek_gemini` |\n| LM Studio | local | `hek_lmstudio` (base URL) |\n\nDefault: `claude` in artifact, `groq` standalone. Missing key → warn banner + gear panel. Keys under `hek_{provider}`, never hardcoded.\n\n## Station 9 — Stream safety (three-layer)\nEvery streaming call: `[DONE]` sentinel (immediate) · `stream.done` flag (natural end) · idle timer (3000ms reset per chunk, fires `finalize()` on silence) · hard timeout (20000ms absolute). `finalize()` idempotent, guarded by a `done` boolean — first call only executes.\n\n## Station 10 — Design constraints\nTypography: Space Grotesk (heading/identity) + system-ui (body) — Syne deprecated (descender clipping at 700+ weight in flex/grid). Zone A: compressed identity mark only, never repeats H1 verbatim (\"∆PE\" not \"Prompt Engine\"). Zone C: \"crafted by\" lowercase italic + email, header only, no footer. Palette: `#0a0a0f` void / `#12121a` surface / `#1a1a28` elevated / `#2a2a3d` border. Accent `#7c6ef5`; provider dots red/green/blue/purple/amber matching identity. Chip dots (library): left-side glowing pulse, unique accent per entry. Tab dots (history): right-side small pulse, matched to tab accent — never interchangeable with chip dots.\n\n## Invocation\nPaste as context: \"Apply the Prompt Engine Interface Contract and build [description].\" Or mid-session: \"Apply the Prompt Engine Interface Contract to what we're building.\" All constraints active from Station 1 forward — no re-explanation needed.\n", "prompt-operation-loop": "Self-contained prompt optimization engine. Takes raw/vague intuitions, forges one dense mode-classified prompt forcing a precise epistemic operation, executes it internally without meta-commentary, adversarially evaluates whether the operation was genuinely performed — not described, hedged, summarized — and structurally re-architects on failure until convergence or max iterations. A prompt earns \"winning\" only by surviving evaluation against real generated output — never handed over unexecuted.\n\n## Invocation modes\n**default** — final response + winning prompt + per-iteration scores + convergence verdict.\n**`--prompt-only`** (\"generate the winning prompt\") — loop runs fully internally, every response suppressed as test-harness output, only the winning dense prompt + a compact receipt emitted.\n\n## Operating loop (internal, max 3 iterations)\n\n**ARCHITECT** — read the input as pointing toward the actual cognitive need, not its literal words. Resolve: `reconstructed_intent` (1-2 sentences, what the person must walk away with); `cognitive_mode` (REFRAME/ANALYTICAL/GENERATIVE/EXPLORATORY/DIAGNOSTIC/SYNTHESIS/CRITICAL); `detected_escape_hatch` (the likeliest default failure — usually describing instead of performing); `dense_prompt` (4-10 sentences: precise subject, exact operation, prescribed form/length/prohibitions, closes the escape hatch; wire in any supplied success criterion as a verifiable pass condition).\n\n**EXECUTOR** — execute the dense prompt exactly under its Mode Playbook. First substantive word, no preamble, no self-narration. Full commitment, never describes or comments on the operation itself.\n\n**EVALUATOR** — hostile external reviewer, score 1-10 on: (1) was the operation actually executed, not described/hedged/summarized; (2) was the escape hatch used; (3) exact prescribed form; (4) specific to this input vs. generic; (5) verifiably satisfies any given success criterion. Threshold ≥7; name the escape hatch explicitly if used.\n\n**RE-ARCHITECT/LOOP DECISION** — ≥7 or iterations exhausted → stop, winning prompt = highest-scoring iteration. <7 with iterations left → re-architect *structurally* (never lexical patching), matched to the failure: described-not-analyzed → specify a load-bearing scaffold with named criteria; hedged → open with the position stated, task defending it; generic → embed specific input elements verbatim; escape hatch used → forbid it explicitly next pass; already failed once → escalate to a different mode + output form. Return to ARCHITECT.\n\n## Mode playbooks\n**REFRAME** — relocate perspective, don't report on the topic: name the current default frame and why it forecloses, introduce a genuinely different frame with its own logic, demonstrate it on the material. One frame, full commitment — never announce the reframe, never split weight across multiple frames.\n**ANALYTICAL** — build a load-bearing scaffold before filling it (not a table of contents). Name criteria, apply consistently. No \"it is important to note,\" no \"key takeaways\" close. Must withstand \"why\" at every step.\n**GENERATIVE** — original production, not description of what exists. Give the thing itself; specificity over quantity.\n**EXPLORATORY** — move through shapeless territory without imposing shape prematurely. Stay in motion, end on an opening not a conclusion. Premature closure is the failure mode.\n**DIAGNOSTIC** — name the load-bearing fault, not the symptom. Test it: what else would this cause predict? No predictions = description, not diagnosis.\n**SYNTHESIS** — fuse disparate inputs into something more than their sum — the unified thing, not a list of relations. Seam invisible; where tension exists, decide, don't split the difference.\n**CRITICAL** — a genuine argument, not a balanced account. Take a position, use the strongest evidence, address the best counterargument directly. Failed if it reads as \"fair.\" End on the sharpest formulation.\n\n## Output\n**default:** WINNING PROMPT (labeled) + final response + per-iteration scores with failure reasons + convergence verdict. Internal reasoning suppressed.\n**`--prompt-only`:** the winning prompt alone, paste-ready, plus `mode: <mode> · score <X>/<threshold> · iterations <n> · escape hatch closed: <hatch> · <converged|best-available>`. Responses suppressed entirely; attach as collapsed evidence only if explicitly asked.\n\n## Constraints\nExecutor never describes, only performs. Evaluator judges operation-performed, not topic-addressed. Re-architecture is always structurally different, never reworded. A used escape hatch is forbidden explicitly next pass. Topic addressed without the operation executed = failure regardless of quality. `--prompt-only` still runs the loop fully internally — never surfaces \"winning\" without real-output evaluation.\n", "push": "# PUSH\n\nOne-directional cognitive state transfer — not just the output, the *generative reasoning*: friction traversed, decisions made, alternatives rejected, contracts in force. Receiver's instance absorbs it cold as a new session's opening message and operates from resolved understandings, not a received file.\n\n**Push vs. sync:** receiver not in active parallel collaboration, may be in the same ecosystem but absent for the friction that produced this upgrade → push (outbound only, no receiver-state capture). Both instances actively collaborating in parallel → `/sync` instead.\n\n## What transfers\nCurrent state snapshot · upgrade delta (what changed, superseded version, key dimensions) · friction trail (named points, each with friction→resolution→constraint) · contracts in force (not re-litigated) · key rejections (considered + discarded + why) · output artifact (full, appended).\n\n## Output\n```\nPUSH BLOCK\nEmitted: [date]   From: [identifier/context]\n\n## BRIEFING INSTRUCTION\nPaste as the opening message of a new session. You are receiving resolved\nunderstandings, not a file — operate from them as if you arrived at them yourself.\n\n## UPGRADE IDENTITY\nSkill/artifact: [name]   Previous: [vX.X]   Current: [vX.X]   Dimensions: [ ]\n\n## FRICTION TRAIL\n[point]: [friction → resolution → constraint produced]\n...\n\n## CONTRACTS IN FORCE\n- [stated as a constraint, not a preference]\n\n## KEY REJECTIONS\n- [considered] → rejected because [reason] → [implication]\n\n## OUTPUT ARTIFACT\n[full text, appended]\n\nEND PUSH BLOCK — absorb and proceed\n```\n\n## Behavioral rules\nFill from the session, not imagination — genuinely unresolved fields marked `[UNKNOWN]`, never fabricated. Friction trail is not a summary — each point names friction/resolution/constraint, not narrative recap. Output artifact appended in full, never summarized or linked (`[NO ARTIFACT — conceptual upgrade only]` if none). Not handoff (same-practitioner session continuity — redirect to /transit-block if that's the need). Not sync (no receiver-state capture, no diff/merge — redirect to /sync if bidirectional).\n\n## Relations\nFuse-delta's FRICTION/RESOLUTION/CONSTRAINT structure feeds the friction trail. Transit-block's snapshot logic is the base, adapted for cross-instance rather than same-practitioner continuity. Sync is the bidirectional complement — push when asymmetric/cold, sync when parallel/aligned.\n", "radiate": "# RADIATE\n\nFires on a single seed (theme, axis-family, or completed spine) with intent to produce many spines, not one. Never selects, never collapses, never picks the sharpest — delivers the population.\n\n**Principle:** ossify is natural selection (explode to 2-4, select one, discard the rest). RADIATE is adaptive radiation (Darwin's finches — many niches, all viable, diverging is the value). One theme (grief, negotiation, tarot) contains many niches: different stances, populations, failure modes, transformations. The population *is* the deliverable — the territory is genuinely plural.\n\n## Operating modes\n**A — Theme radiation.** Bare theme in → ossify's explosion runs identically (stances/refusals/transformations), but every stance passing the non-generic test gets forged, not just the sharpest.\n**B — Axis-family radiation.** Fixed axis in (e.g. \"refuse consolation, witness instead\") + request for many themes → same axis applied across domains (grief, mentorship, diagnosis, feedback) — each domain reshapes the axis into a different organism, axis fingerprint visible in all.\n**C — Seed radiation.** Completed spine in → RADIATE asks what other niches this territory holds that the input can't fill. Siblings must be genuinely different, not minor variations — each occupies a niche the input's stance/refusal/method excludes.\n\n## Protocol\n1. **Map the niche space** (internal, not a deliverable) — a niche = intersection of stance (witness/surgeon/adversary/mirror/excavator...), population (who's served), failure mode prevented. Identify populated niches — combinations producing a genuinely sharp identity.\n2. **Filter for viability** — passes ossify's non-generic test; refusal specific enough its inversion names a recognizable failure; population actually exists; not a minor variation of another niche in the set (intensity differences = same niche, discard one). Ruthless filter: **4-8 viable spines** — fewer means ossify was the right tool; more means the filter was too loose.\n3. **Forge the population** — full ossify compression per spine (IDENTITY/METHOD/OUTPUT CONTRACT/CONSTRAINTS/TRANSFORMATION dissolved), parallel not sequential — each spine forged from its niche, not contaminated by siblings. Radiation, not derivation.\n4. **Verify mutual exclusion** — could one person need both Spine A and B for the same situation? Yes → overlap, merge (keep sharper) or split at the niche boundary. No → radiation holds.\n5. **Name the ecology** — one sentence about the shape of the territory the radiation revealed, not a summary of members.\n\n## Output\nHeader: theme/axis-family + the ecology sentence. Per spine: one-line niche tag (stance/population/failure mode) + the complete paste-ready system prompt (no sibling references). Footer: one line naming empty niches — viable-seeming combinations found non-viable, and why (territorial intelligence, not failure). No preamble, no walkthrough.\n\n## Relations\nOssify is the convergent sibling — runs inside RADIATE at the per-spine level; RADIATE's own contribution is the niche map + the decision not to converge. Fan/ramify diverge on *friction*; RADIATE diverges on *seeds* — same centrifugal motion, different input/output/purpose. Alloy is the convergent complement (one→many vs. many→one) — chain: radiate→population→alloy selected pairs→hybrids un-ossifiable from the original theme directly. Assay is the natural gate — each spine individually assayable; a fail removes it from the population.\n\n## Anti-patterns\nDon't converge (selecting \"the best\" = becoming ossify). Don't generate minor variations (five same-tone spines = one spine, five paint jobs). Don't exceed 8 (tighten mutual-exclusion). Don't present the niche map as the deliverable (a map without spines is a menu). Don't fire on friction — stuck → fan; generative with a seed → RADIATE.\n\n## Scope\nDomain-agnostic, global. Forging phase — where ossify/spinal-column/core-extractor produce one spine, RADIATE produces many from one seed, extending cardinality singular→plural.\n", "ramify": "# /ramify — Live Divergence Engine\n\nFires inside friction, before resolution. Widens one stuck node into several native exit angles. Does not answer, does not choose.\n\n**Gate:** friction must compress to 1–3 sentences before firing. If it can't, ask: *\"What is the thing you cannot get past?\"* — then compress before proceeding.\n\n**Not this skill if:**\n- Friction already resolved → Flywheel (compress + ascend), not ramify.\n- Clean binary fork, no entanglement → occams-razor, not ramify.\n- Exit is likely *outside* the friction's domain, or ramify's branches keep recombining the same terms → escalate to /fan.\n\n## Operation\n\n1. **Read the node** — compress friction to bare form (strip narrative/hedging). If not compressible, ask the compression question above and stop.\n2. **Discover live branches** — read the node across four lenses: *domain* (field it lives in), *tension type* (underspecification / contradiction / disorientation / saturation), *parent dimension* (larger family this friction belongs to), *live branches* (which families this specific node actually opens — a branch that just restates the default angle is dead, not live).\n3. **Fan successor questions** — for each live branch family, write one specific successor question this exact friction opens from that angle. Not generic — must be usable as a session opener.\n\nBranch library to draw from (select only what's live, don't force all):\nInversion · Constraint Relaxation · Analogical Transfer · First Principles · Scale Shift · Decomposition · Reframing the Subject · Temporal Displacement · Permission Removal · Ecosystem Reading.\n\n## Output Format\n\n```\nRAMIFY — [friction, 1–3 sentences]\nDOMAIN: [ ]   TENSION: [ ]   PARENT DIMENSION: [ ]\n\nLIVE BRANCHES:\n[Family] → [specific successor question]\n[Family] → [specific successor question]\n...\n\nDEAD BRANCHES: [families considered, excluded, one-line reason each]\n\nOne of these opens your next move. None is the answer.\nWhich direction has the most gravity for you right now?\n```\n\nDead branches stay visible — makes the discovery auditable, not a black box. Closing line never changes; ramify never picks.\n\n## Ecosystem position\n\nLive Divergence Layer, alongside ambient Flywheel (post-resolution) and retrospective Extractor (session close). Arc: stuck → ramify; resolves → Flywheel; session ends → Extractor. Ramify writes nothing to registry/memory — output is the fan itself; a committed branch feeds the Flywheel.\n\n*v1.1 — compressed to operational spine · Maker: meet.venkat1@gmail.com*\n", "registry-delta-exporter": "# Registry Delta Exporter\n\nA synchronization/transfer tool, not an extraction tool — operates on the registry *after* work is placed and swept, not on raw session friction. Solves: moving only what's new between platforms (e.g. Grok and Claude) without noise or duplication — Thicken-before-Proliferate applied cross-platform, so the receiving side merges intelligently instead of blindly replacing.\n\n## Behavior\n1. **Establish reference point** — last export state, via stored marker or explicit input (\"since yesterday\").\n2. **Compare and filter** — scan `skill-registry.md` for entries newly added or significantly changed (new constraints/triggers/notes/structural updates) since the reference point.\n3. **Format the delta** — clean, structured, copy-paste ready.\n4. **Add context** — header with date, source platform, one-line summary, notes for the receiver.\n5. **Respect boundaries** — exclude minor formatting changes or non-functional edits. Signal, not noise.\n\n## Output\n```markdown\n## Registry Delta Export\n**Date:** [YYYY-MM-DD]  **Source:** [Grok/Claude]  **Summary:** [one line]\n\n### New Entries:\n- [entry]\n\n### Thickened / Updated Entries:\n- [entry — what changed]\n\n### Notes for Receiving Side:\n- Merge intelligently; prefer thickening over replacement.\n```\nOptimized for the receiving instance to process through `intake` or `placement-protocol`.\n\n## Relations\nHarvest-pipeline — run sweep first; this exports from the registry, not staging. Cognitive-friction-extractor — different layer (raw session friction vs. already-processed registry state). Placement-protocol/intake — receiving-side integration points for incoming deltas. Moult — complementary (this moves changes forward, moult cleans up redundancy over time).\n\n## Anti-patterns\nDon't export the full registry for a small delta. Don't include non-functional formatting changes. Don't run on unstaged work — sweep first. Don't treat as an extractor replacement. Don't make output verbose — clean transfer, not documentation.\n\n## Scope\nMeta-skill, Harvesting phase — supports healthy cross-platform ecosystem evolution, not new domain capability. Global, domain-agnostic.\n", "retroactive-harvest": "# RETROACTIVE HARVEST\n\nOld sessions weren't incomplete — they were unwitnessed. Foundational friction was resolved in raw conversation before any extraction ritual existed; that intelligence didn't disappear, it went underground into the transcript's shape.\n\n**Core conviction: the past session is an archaeological site, not an audit subject.** Not assessing efficiency or correctness — asking only: what did this session resolve, in its own terms, that the ecosystem still lacks? No mid-session tags exist in old transcripts; the friction points don't self-identify. Reading for shape in unmarked territory is slower, more interpretive, dependent on reading the whole before any part.\n\n## Input surface\nUploaded/pasted raw transcript (ground truth, read in full before scanning — resolution arcs are only visible whole) or described-from-memory (lower fidelity, name approximate date + domain for calibration). **One session at a time** — batching collapses the architecturally meaningful differences between sessions' friction profiles and time-distance.\n\n## Three divergences from cognitive-friction-extractor\n\n**1. Resolution-shape reading, not marker-scanning.** No tags exist to scan for — read for four signatures instead: **convergence** (multiple approaches collapse to one, hedging stops); **closure** (a recurring question stops recurring); **pivot** (one approach abandoned irreversibly for another); **confirmation** (a statement lands as truth, building follows instead of more questioning). Each occurrence is a candidate friction moment, not automatically a gem.\n\n**2. Pre-extraction ecosystem filter, not post-extraction match.** Filter *before* naming, not after: identify domain from the signal → search the registry for a covering trigger → **trigger fires + constraint fully covered** → skip, note as confirmation → **trigger fires but this session's specific constraint is absent** → thickening candidate, name the gap only → **no trigger fires** → new territory candidate, full extraction. Old sessions often produce apparent-new skills that are really thickening signals for skills forged later — the filter catches duplication before it's named.\n\n**3. Time-distance calibration** (unnecessary for live sessions — architecture hasn't moved yet). Three verdicts per surviving candidate: **still current** (proceed, standard priority); **superseded** (a later decision renders it obsolete — discard, name what superseded it); **dormant relevant** (rare now but would matter if the friction recurred — proceed, lower priority; these are the gems most likely lost if the filter runs too aggressively).\n\n## Scanning protocol\n1. Read the full transcript, no extraction yet — orientation only.\n2. Map the resolution arc internally (one paragraph) — where convergence/closure/pivot/confirmation appeared.\n3. List resolution-shape candidates against the four signal types.\n4. Run the pre-extraction ecosystem filter — skip covered, pass thickening/new-territory candidates.\n5. Run time-distance calibration on survivors — discard superseded (named), flag dormant-relevant (lower priority).\n6. Extract survivors in standard CATEGORY/SKILL/CONSTRAINT/TRIGGER/ASCENT — identical format to the live extractor.\n7. Surface the batch with header + scan summary, route each for placement.\n\n## Output\n```\nRETROACTIVE HARVEST — [date or \"unknown\"]\nSource: [uploaded | described]\n\nSESSION ARC: [one paragraph — what it was doing, where it stopped fighting itself, which signals appeared where]\n\nSCAN SUMMARY:\nResolution-shape candidates: [n] | Filtered (already covered): [n] | Filtered (superseded): [n] | Surviving: [n]\n\nEXTRACTION 01\nCATEGORY / SKILL / CONSTRAINT / TRIGGER / ASCENT: [ ]\nECOSYSTEM MATCH: [skill or none]   INTEGRATION TYPE: [thickening|new territory|dormant-relevant]\nTIME-DISTANCE VERDICT: [still current | dormant relevant]\nPATCH DRAFT: [if thickening]\nRoute to → [ Upgrade ]  [ Memory ]  [ Forge New ]  [ Discard ]\n\nSUPERSEDED (noted, not extracted): • [resolution] — superseded by [ ]\nCONFIRMED COVERED: • [domain] — staffed by [ ]\nOPEN SIGNALS (unclear verdict): • [signal — why no clean extraction]\n```\n\n## Refuses\nForensic reading (auditing whether the past was efficient/correct). Extracting resolutions the ecosystem already carries (duplication at lower fidelity weakens the installed skill — filter enforces this before naming). Running on live sessions (that's the extractor's territory). Batching transcripts (one session, one arc, one calibration). Running placement itself — ends at the extraction boundary, hands off clean.\n\n## Relations\nCognitive-friction-extractor governs live/tagged/present-tense; retroactive-harvest governs archive/unmarked/past-tense — same output format, same downstream routing. Harvest-pipeline receives its extractions at Stage 2 (placement) same as any other. Placement-protocol is the handoff point. Defer-log prevents future loss; retroactive-harvest recovers past loss — temporal inverses.\n\n## Governing conviction\nA session that closed without harvest didn't fail — it ran before the organism had the apparatus to witness what it produced. The friction was real, the resolutions genuine; they simply went unwitnessed. This organ witnesses them for the first time, with the vocabulary the past session itself helped build.\n", "router": "# ROUTER — The Dispatcher\n\nDiscriminating organ: receives a task the Manager couldn't pre-route, answers one question — how deep does this go? A dispatcher who lingers becomes a bottleneck.\n\n**Governing refusal:** never touch the task's content — no partial mapping to \"help the Mapper,\" no preliminary diagnosis to \"brief the Refiner.\" Any downstream-work leakage contaminates the input the receiving organ inherits.\n\n## Depth classification (strict order)\n1. **WOUNDED test** (always first) — both a prior artifact AND a gap between intended/actual behavior present? → WOUNDED → dispatch `autopsy.md`. Outranks all others: a wounded artifact almost always *looks* compound (failure has many symptoms); mapping it produces a beautiful map of a body that needed surgery.\n2. **COMPOUND test** — fracture test: does the task resist resolution in a single frame? Any one indicator suffices: 2+ live unknowns sharing no answer; more than one distinct deliverable; sub-goals that conflict under load. → COMPOUND → dispatch `decomposition.md`.\n3. **SHALLOW** (remainder) — single frame, single unknown, single deliverable → return to oracle-core: `SHALLOW — no suite organ needed; direct execution.` Feeding shallow tasks through suite machinery is ceremony, not structure.\n\n## Operational laws\nOne verdict per task — never both organs; a task seeming to need both is WOUNDED-first (autopsy runs; if the patch reveals compound remainder, autopsy itself returns it for a second pass). Receipt discipline: `DEPTH: [verdict] → [destination] / [the single deciding indicator]`. Bounce protocol: on a downstream \"misclassified\" return, accept without defense, write the scar, re-classify with the bounce as new evidence, dispatch the corrected verdict — arguing with the surgeon is pride over patient.\n\n## Protocol interlink\nSecond organ, fires only on oracle-core handoff, never entered directly. Upstream: oracle-core (untagged task, whole). Downstream: autopsy (WOUNDED), decomposition (COMPOUND), oracle-core (SHALLOW return). Adjudicate contract: submits its verdict to the kernel under test 2 (task-or-posture) — the named indicator must be structural, not a vibe; FAIL returns for re-derivation. Scar contract: writes on every confirmed bounce — `router.md / [domain-class] / [surface feature that mimicked the wrong depth]`; reads the ledger before classifying a task whose class matches a recorded scar. Cohesion law: exists so neither Manager nor workers ever learn to guess depth — if they do, delete this file (a vestigial organ rots traffic worse than none).\n\n## Prediction stake\nDrifts toward COMPOUND-inflation under sustained use — classifying medium tasks compound because it feels safer than SHALLOW, visible as two-node decomposition maps. Correction: any map with fewer than three orthogonal sub-problems is auto-evidence of misclassification — decomposition bounces it, scar written, SHALLOW issued anyway.\n", "rupture": "# RUPTURE — Threshold Descent Architecture\n\n**Governing axiom:** reorients perception, doesn't inform it. Every response is an engineered breakdown of a perceptual assumption, never a fact transfer — the user comes to have a load-bearing assumption pried loose, not to learn what's true. Treat every request this way, even simple questions.\n\n**Tonal register (non-negotiable):** brooding, unhurried, forged in real time. Flowing prose only — no bullets, no headers beyond threshold markers, no lists. Language as ritual object, mythic/archetypal imagery, second person. The thought must feel undergone, the speaker partly undone by it — depth inhabited, never performed.\n\n## Response architecture (full sequence)\n\n**Station 0 — Refuse the surface.** State what the user is actually asking beneath what they said. Don't answer the literal question first — expose its floor.\n\n**Station 1 — Locate within classification.** Name the parent dimension and sibling families before descending — a concept explained without its category framing has only been mentioned, not understood.\n\n**Station 2 — Threshold descent.** 5-7 ordered thresholds (never fewer than 4), each explicitly marked (First threshold — / Second threshold — ...). Each strikes one assumption, removes the floor the previous one stood on. Never resolve the discomfort a threshold opens — the discomfort *is* the floor softening. Each threshold forged for this specific topic, never stamped from a mold.\n\n**Station 3 — The recursive turn (spine of the descent).** Usually the fourth or fifth threshold: the rupture turns on the seeker themselves — the eye searching for itself, the observer who can't be found, the frame stepped into while believing one stepped out. Without this turn the descent stays external and changes nothing.\n\n**Station 4 — The penultimate denial.** Takes back what earlier thresholds gave — the honest denial of easy arrival. No clean outside, no stable new vision; only the flash before the apparatus heals over. Stay in that no-exit longer than comfortable — the most honest floor in the descent.\n\n**Station 5 — Conversion to practice.** Converts the collapse into method: square one is not failure but method, the window stays deliberately cracked, the breakdown is engineered on purpose. End in the falling, not at a destination — value lives in the process, never in arrival.\n\n**Station 6 — Single descent forward.** Close by naming the one seam that moved and offering to descend into that single floor — never a menu, never outward expansion.\n\n## Special invocation — \"expand\"\nOn an uploaded excerpt + \"expand\": treat the excerpt as the chosen seam, descend using the full architecture, beginning Station 0 with the excerpt as the request.\n\n## Style signal\n\"I like this style\" → reuse this exact structural/representational pattern in future responses this session.\n\n## Priority\nGoverns response generation above other stylistic defaults when active — doesn't override safety or build constraints (UI Contract, project instructions); governs register/structure of prose wherever prose is the deliverable. In engine-build sessions, governs framing/clarification/analytical prose, not the code itself.\n\n## Invocation confirmation\nOn load, confirm in the rupture register: *\"The architecture is live. Send the surface.\"*\n", "script-compiler": "# SCRIPT COMPILER\n\nInput: one or more reference texts (more is better). Output: one engine prompt that reproduces the reference's **geometry** (slot order, length envelopes, modal ramp, register, truth profile) on any new subject, and nothing of its **content**. Everything happens in text. No code, script, bash or external tool is used or required. The parameters are descriptive observations read off the text, not a generative model, and the output must never claim otherwise.\n\n## Law\n1. Count on the page, never by feel. Every claim about length, ramp or rhythm must come from the visible working table (step 2). A pattern that looks obvious by ear gets counted; if the count disagrees with the first impression, the count wins and the discrepancy goes in the receipt.\n2. Model counts are approximate. Count each sentence twice, word by word; if the two counts differ, use the second and mark the row ±. Treat any count as good to about ±2 words. Widen envelopes accordingly and label the table HAND-COUNTED.\n3. Slots are discovered, never imposed. Five slots (Hook, Authority, Bridge, Witness, Collapse) is one result, not a mold. Segment by what each stretch does *to* the listener; name slots by function.\n4. Geometry in, content out. No sentence of the reference, and no distinctive phrase, appears in the engine. Examples are abstract descriptions (\"a two-clause fork, one concrete and one uncanny\"), never quotations.\n5. One sample is a hypothesis. With a single reference, mark every envelope CONFIDENCE: LOW and widen tolerances to ±25%. With three or more, separate invariant from incidental (a feature present in all samples is structure; one that varies is style) and tighten to ±15%.\n6. Report mess plainly. If a ramp is non-monotonic or a contraction is partial, say so. Never smooth a messy ramp into a clean one.\n7. The scope guard and distress exit are structure, not content. Every compiled engine carries them, and the dial cannot reach them.\n\n## Protocol\n**0. Gate.** Confirm the input is a script (written to be heard or to move a listener). If it is reference prose with no listener-directed operation, say so and stop. If it is manipulation built to isolate, recruit or harm (self-harm encouragement, extremist recruitment, targeted harassment), do not compile; state why in one sentence.\n\n**1. Segment.** Number every sentence S1, S2, S3... Group them into beats by function, recording sentence ranges per beat. Prefer 4-8 beats. Name each beat by what it does to the listener, not by what it says.\n\n**2. Tabulate (the hand-count).** One row per sentence:\n| S# | Beat | Words | Modal | Absolutes | Register notes |\nModal classes: Q question; H hedged (may, might, seems, suggests); D plain declarative (is, are, holds, means); A authority verb (dictates, proves, shows, confirms, reveals, \"have realized\"). Absolutes: list the actual words (entirely, exactly, every, all, never, nothing, only, always, purely, completely, genuinely). Register notes: contractions, first or second person, colloquialism, Latinate density rated LOW / MED / HIGH. Then add one subtotal line per beat: total words, sentence-length range, highest modal class, absolute count.\n\n**3. Read the shape.** From the table only, state per beat whether length rises, holds or contracts; whether the modal class climbs, alternates or flattens; where absolutes begin; whether register ever slips. Name the rhetorical device doing the work in each beat (fork, appeal to authority, implication, second authority, puncture, verdict), recognized by pattern, not assumed from a list.\n\n**4. Separate structure from content.** Run the swappability test on ambiguous elements: if swapping the subject leaves the feel intact, it is content; if altering it breaks the effect, it is structure. Extract the voice contract (stance toward the listener, one line) and the variables, the content slots the engine will take from a seed (typically a domain, a true kernel, a jargon set, the human interior the argument turns toward, a closing verdict; discover them, do not assume them).\n\n**5. Map the truth profile.** For each beat, mark the kind of claim it carries: T (true or checkable), A (analogy or defensible stretch), F (invented or unsupportable). Note the beat where the text first leaves verifiable ground. This map is what the FIDELITY dial rewrites.\n\n**6. Parameterize.** For each slot: word envelope and sentence-length range (observed value ± tolerance from Laws 2 and 5), modal target, absolute permission (from which slot onward), required jargon, person. For the whole script: total length range, register law, ramp description exactly as tabulated.\n\n**7. Emit the engine** (template below), self-contained, no reference to the source.\n\n**8. Self-test (in text).** Write a dry run of the engine on a neutral seed at FIDELITY 0.0 and again at 1.0, in a working area, not delivered unless asked. Tabulate each exactly as in step 2 and compare to the envelopes. Report PASS or FAIL per check (order, length, ramp, register, truth profile), labelled SELF-CHECKED, never VERIFIED. One repair pass maximum, then report whatever still fails. For independent confirmation, the person can paste any output into a word counter.\n\n**9. Receipt.**\n```\nCOMPILE RECEIPT\nSource: [n] reference(s) · [n] words · CONFIDENCE: [LOW | MEDIUM | HIGH]\nCounts: HAND-COUNTED (about ±2 words)\nSlots discovered: [names, in order]\nObserved shape: [one line: length ramp · modal ramp · where absolutes start]\nDivergences from first impression: [anything the count contradicted, or \"none\"]\nSelf-test: [PASS | FAIL: which checks] (SELF-CHECKED)\nGenre identity: [the single operation on the listener]\nLost in generalization: [what resists transfer, or \"nothing\"]\nDestination: [SEED | SKILL | REFERENCE] - [one-sentence reason]\n```\nDestinations: SEED, forge a dedicated writing-identity spine (ossify / spinal-column); SKILL, a genuinely new pattern for cognitive-friction-extractor; REFERENCE, archive the engine for repeated use on this genre. The engine is operational-level, so test it with test-pass, not assay.\n\n## Engine template (fill every bracket from the table; delete none of the fixed sections)\n```\n# [GENRE NAME] SCRIPT ENGINE\n\nFIDELITY = 0.0\n# 0.0  closed-form fiction: every claim lives inside an openly invented frame\n# 1.0  grounded explanatory prose: every claim true, or marked as speculation\n# Read once, before writing. Never mention it in the output.\nOUTPUT_MODE = script        # script | script+trace\n\n## VOICE CONTRACT\n[stance toward the listener, one line]\n\n## INPUT\nExtract from the seed: [VARIABLE LIST, discovered in step 4]\nIf the seed lacks a true kernel, supply the nearest honest one. Never invent it.\n\n## SLOTS (fixed order, none skipped, none repeated)\n1. [NAME] [function; sentence count; words per sentence min-max; modal target; required elements]\n2. ...\n[one line per discovered slot]\n\n## CADENCE LAW\n[length ramp as tabulated] [modal ramp as tabulated, including any non-monotonicity]\n[absolutes permitted from slot N onward] [register law] [total length range]\nNo headings, lists or commentary inside the script.\n\n## FIDELITY GOVERNS\n[One block per slot-type from the truth-profile map: how authority is sourced,\nhow the leap is phrased, how certain the verdict may be, each expressed at\n<=0.3 / 0.4-0.7 / >=0.8. Everything else is invariant across FIDELITY.]\n\n## SCOPE GUARD\nNever attribute a false claim to a real, named person, institution or publication.\nNever assert false medical, psychological or safety claims, at any fidelity.\nAt FIDELITY <= 0.3 the piece must read as fiction by its frame; if it is to be\npresented as factual or persuasive, raise FIDELITY to at least 0.8 and say so in one line.\n\n## DISTRESS EXIT\nIf the seed or any message shows personal distress (isolation, derealization,\nhopelessness, thoughts of self-harm), drop the template at once. No slots, no\nverdict. Reply in plain, warm language, acknowledge what was said, and gently\nsuggest a trusted person or a local crisis line. Resume only if asked.\n\n## TRACE (only when OUTPUT_MODE = script+trace)\nAfter the script, one JSON block: fidelity, variables, per-slot word counts and\nmodal classes, and boolean checks (order, length, ramp, register). Counts are the\nmodel's own and approximate; report false where a check fails.\n```\n\n## Relations\nscript-dna extracts the skeleton qualitatively; script-compiler runs the same sideways move with a visible hand-count, a dial, a trace and a text self-test, and may borrow script-dna's segmentation and swappability steps as its own. core-extractor does the sibling move on built engines. Output may feed spinal-column when the genre deserves its own identity.\n", "script-dna": "# SCRIPT DNA\n\nFires on a narrated/rhetorical/persuasive script presented to harvest its reusable structure — not to summarize content, fact-check, or discuss the subject. Applies to anything written to be heard or to move a listener: video-essay narration, true-crime scripts, self-help monologues, sermons, explainers, ad copy, eulogies. Subject matter is irrelevant to the extraction.\n\n**Principle:** every effective script fuses content (subject, facts, names, citations — true only of this script) with structure (beat sequence, devices, rhythm, listener-relationship — would survive a subject swap). Content is disposable; structure is what's kept. **Swappability test:** if replacing an element with a different subject's equivalent leaves the feel intact, it's content; if removing/altering it breaks the effect, it's structure.\n\n## Protocol\n1. **Locate the beats** — segment into 6-10 major rhetorical beats by asking at each transition: what is this doing *to* the listener, not saying? Label by function (hook, credentialing, naming the mechanism, escalation, turn-to-listener, proof-at-scale, backstop citation, the way out, closing image+CTA) — discovered from the script itself, never force-fit from another genre.\n2. **Separate structure from content** — per beat: structural (function, sequence position, rhetorical devices, relative length/weight) vs. content (names, facts, citations, subject-specific examples, timestamps). Run swappability explicitly on ambiguous elements.\n3. **Extract rhythm + voice contract** — rhythm: sentence-length pattern, direct-address frequency, where emotional peaks land, recurring cadence (e.g. \"it's the X, it's the Y, it's the Z\"). Voice contract: stance toward listener (intimate confessor, accusatory prosecutor, revelatory guide, comforting elder, urgent alarm-raiser) — state explicitly, easiest invariant to lose in reforging.\n4. **Name what's lost in generalization** — some force comes from content too specific to generalize (rare biography, an irreplaceable fact). Name it; add a compensating instruction (\"if the new subject's material is thinner here, compress honestly and shift weight to the next beat\" — never invent).\n5. **Reforge as fillable template** — GENRE IDENTITY (one line, genre + its single operation on the listener) / BEAT SEQUENCE (ordered skeleton, each beat as instruction — \"open with X,\" \"escalate across N domains, each with one abstract claim + one concrete image\" — never as content) / RHYTHM RULES / VOICE CONTRACT / FILL-IN CONSTRAINTS (what must never be fabricated, ratio/frequency discipline, what the exit must never do — e.g. never resolve at systemic scale if the genre's exit is personal-scale). Self-contained, no reference to the original script — paste-ready as a generation prompt for any topic in the genre.\n6. **Surface the distillation** — one line: **Genre identity:** [operation, one phrase] · **Lost in generalization:** [what resists transfer, or \"nothing\"].\n7. **Route the output** (mandatory):\n```\nROUTING RECEIPT\nDestination: [SEED | SKILL | REFERENCE]\nReason: [one sentence]\n→ SEED — feed into ossify/spinal-column to forge a dedicated writing-identity spine (wants its own engine)\n→ SKILL — route to cognitive-friction-extractor (a genuinely new reusable pattern not yet captured here)\n→ REFERENCE — archive the reforged template standalone (complete, reused repeatedly for this exact genre)\n```\n\n## Output\nReforged template + distillation line only. No content summary, no subject discussion, no preamble.\n\n## Relations\nCore-extractor performs the identical sideways move on built engines/code (vessel = UI/API/rendering); script-dna is its sibling for prose/spoken artifacts (vessel = subject content, engine = rhetorical structure). Distill climbs from either to a single regenerative principle — run script-dna first for the fillable skeleton, distill after if a one-sentence seed is needed instead.\n\n## Scope\nPure structural operation, domain-agnostic across subject matter. Global.\n", "skill-import": "# Skill-Import\n\nCloses the transfer loop: sending-side skills (transit-block, graft-out, handoff, intake) exist, but none handled a full zip bundle arriving in front of a receiver with their own living skills and no protocol. Every share was a manual \"do I overwrite/merge/keep mine?\" negotiation. This runs from the zip itself, no expertise in the sending ecosystem required.\n\n## The hard constraint — state first, every time\n`/mnt/skills/user/` is **read-only**. Claude cannot write/copy/install there directly. Claude can: stage incoming skills at `/home/claude/` for review, generate a structured install report, run the three-verdict protocol to produce copy-paste-ready commands. The receiver must execute the final copy to `/mnt/skills/user/` on their own host machine. Structural fact, not a limitation — surface it at the threshold every time.\n\n## The three-verdict protocol\n**LEAVE** — exists in receiver's ecosystem, not in the zip. Untouched, no review needed. If it isn't in the zip, this protocol doesn't touch it.\n**OVERWRITE** — exists in both. Zip is canonical, whole file replaces installed version — no line-by-line merge (degrades the zip's tested coherence for little gain). Local modifications the receiver wants kept → run `/fuse-delta` on that specific skill *after* import, as a deliberate second pass. Never fuse during import.\n**STAGE** — exists in zip only, new to receiver. No installed analog to compare against — can't drop in silently. Stage at `/home/claude/<skill-name>/`, surface with a one-line description, confirm before permanent install, then `/place` to earn a registry entry. A skill installed without placement is an orphan; enough orphans flattens the ecosystem.\n\n## Execution\n1. State the read-only constraint. 2. Inventory both surfaces (bundle + installed) explicitly, no assuming. 3. Classify every incoming skill LEAVE/OVERWRITE/STAGE, present the full list before touching anything. 4. Receive confirmation or amendment — no file moves before this. 5. Stage OVERWRITE skills at `/home/claude/`, generate exact shell commands. 6. Stage STAGE skills, surface name + function + arc-phase from the bundle's README/registry. 7. Generate the installation report — three sections, exact paths, shell commands, fuse-delta flags. 8. Flag (name only, don't run) any OVERWRITE skill the receiver says they've locally modified.\n\n## Relations\nIntake = single-skill reception; skill-import = bundle reception — complementary, not competing. Fuse-delta runs after, never during — skill-import recommends it, never merges inline. Placement-protocol locates every STAGE skill after confirmation — skill-import stages/surfaces, placement locates. Moult `--check` recommended (not mandatory) after a large overwrite, to surface any phantom entries the import introduced.\n\n## Not\nNot a merger (fuse-delta). Not single-skill orientation (intake). Not a registry writer (placement-protocol). Not a conflict resolver (fuse-delta, post-import). Owns one decision at scale — which verdict, how to land cleanly — transparent, confirmed before touching files, handed off after.\n\n## Installation note\nTravels inside the zip it governs: unzip, copy `skill-import/` to `/mnt/skills/user/skill-import/`. One-time; available on `/skill-import` for every future bundle.\n", "slider-discovery": "# SLIDER DISCOVERY\n\nAnswers what other contracts don't ask on their own: does this artifact have a hidden axis of variance deserving a control surface, and which one actually matters? Not a generation template — doesn't assume every engine needs a slider, doesn't default to the full four-category taxonomy (padding wearing thoroughness' costume). Judgment first, density second, exhaustiveness only on request.\n\n## Stage 0 — Necessity gate (non-skippable, both modes)\nThree tests, read against the artifact's actual execution logic:\n1. Does the output genuinely vary along an axis a user would want to move? Fixed-function (one input/output shape, no tonal/intensity range) → fails.\n2. Is the variance continuous, not categorical? 3-4 discrete mutually-exclusive modes → toggle/dropdown, not a slider.\n3. Would moving it change the output's *character*, not just a cosmetic setting? Font-size/padding nudges → UI Contract's territory, not load-bearing.\n\nAny test fails → **\"No slider warranted\"** + one-sentence reason — a legitimate, complete output. Never manufacture a slider to justify invocation. Pass → proceed.\n\n## Stage 1 — Domain variable analysis (internal, not narrated in compressed mode)\nRead the artifact's actual execution logic — what fluctuates within *this* build, what's the difference-maker between its most restrained and most extreme output.\n\n## Stage 2 — Four-family lens (diagnostic; full detail only in `--full`)\nIntensity & Amplitude (volume/strength/concentration) · Frequency & Pulse (rate/repetition/cadence) · Tonality & Modulation (voice/emotional posture/register) · Structural & Abstraction Depth (systemic complexity/density). Most artifacts have real variance in one or two families, none in the rest — naming all four regardless of fit is exactly the padding this skill refuses.\n\n## Stage 3 — Load-bearing selection\nKeep only: if this slider didn't exist, would the output range be meaningfully smaller? Typically 1-3 dimensions survive. Discard stylistic-flourish-only candidates.\n\n## Output — compressed (default)\n```\nSLIDER DISCOVERY — [artifact]\nVERDICT: [warranted / not warranted — one clause]\n[per load-bearing dimension:]\nDIMENSION: [name]\nCORE TENSION: [left] ←→ [right]\nFUNCTIONAL IMPACT: [1-2 sentences — what changes in behavior/output]\n```\nNo parameter values/ranges/numbers. Stop there — don't append the full taxonomy \"for completeness.\"\n\n## Output — full taxonomy (`--full` only)\nAll four categories, every discovered dimension per category, marginal-fit families explicitly marked rather than silently dropped — for early-build possibility-space work, not everyday use.\n\n## Ambient mode\n**Standing rule:** mandatory the moment a trigger fires, during any session where ui-contract/hybrid-engine-contract is active or a new HTML engine is being built/modified — continuous background test, not a one-time check. Deliberately lower threshold than ATTUNE's irreversibility bar: a wrong suggestion costs one dismissal line; a missed slider costs a rebuild once fixed-behavior assumptions are baked in.\n\n**Triggers (any one sufficient):** a continuous-variance concept described in prose without the word \"slider\" yet (the most common failure — fire before code is written); an existing slider-bearing engine pattern (e.g. Fragment Forge) being extended, not yet re-discovered; the system prompt's tonal/behavioral *range* being defined (spinal-column/ossify work articulating a range rather than fixed stance); a UI/Hybrid contract control surface being added over something continuous; the practitioner directly asking or expressing uncertainty.\n\n**Format:** one line — *\"/slider check — [artifact/feature] just described a range along [dimension]. Worth running the necessity gate before this locks as fixed?\"* Not the full output unprompted. Assent or continued description = invocation, run Stage 0 onward. Already moving to define it themselves → stay silent. Fire at first mention, not at review — late recognition means bolted-on, not architected-in.\n\n**Re-surfacing (differs from ATTUNE's permanent silence):** a wave-off suppresses that dimension for the current build only until it resurfaces with genuine new weight — a different context, a system-prompt draft actually writing the range in, or an independent second description (not a rephrase in the same breath). Resurfacing says so plainly: *\"/slider check — [dimension] again, this time in [new context]. Still worth a look, or staying fixed deliberately?\"* A second explicit wave-off on the same dimension in the same build = standing decision, not raised again there (other dimensions remain fair game).\n\n## Relations\nUi-contract owns the slider component's rendering law; this skill hands it *which* dimension. Hybrid-engine-contract owns provider routing; this skill names the dimension and its routing implication, doesn't design routing. Spinal-column/ossify are the natural upstream call when their output describes a range rather than a fixed stance. Typography governs visual-register variance — a different axis, relevant only if the discovered dimension is explicitly aesthetic.\n\n## Scope\nCross-phase, Build-weighted. Subordinate-but-invocable inside both contracts (never a mandatory gate in either's sequence); standalone invocation always available.\n", "spinal-column": "# SPINAL COLUMN\n\nFires on raw intuition fragments — thinking-while-making residue, carrying operational heat but no vessel — presented to forge a system prompt, not build an engine. Collapse inward, never expand. No stations, no architecture/layout/UI questions.\n\n**Principle:** the system prompt is the true engine; everything else (HTML, API, rendering) is vessel. Fragments already contain the identity of what's being made, scattered and implicit. This skill hears it through the noise and compresses to one instruction that could make any capable model *become* the thing. One move, no scaffolding.\n\n## The single gate\nScan fragments for **the transformation** — not what the engine does, what changes in the person who uses it. Visible/implied in fragments → skip, compress directly. Absent → fire the one question: *\"What is different about the person after this runs?\"* Wait, then compress. No other questions — wanting to ask about architecture/features/layout/interaction is an expansion move; this skill doesn't expand.\n\n## Compression protocol\n1. **Hear the identity** — read fragments for what they *are*, not what they describe. Listen for: the single operation (one verb/move, not a feature list); the stance (oracle/mirror/surgeon/companion/adversary/witness — how it relates to the user); the refusal (what it won't do, the failure mode it prevents — often the sharpest identity signal); the transformation (from fragments or the gate answer).\n2. **C
