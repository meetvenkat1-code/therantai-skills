-extractor/placement-protocol belong to harvest, not this audit — extraction is additive, this is subtractive.\n\n## Scope\nReconciling phase, staffed (sequences moult + apoptosis, hands to harvest-pipeline; replaces none of them — removes navigation burden from the run most likely to stall after diagnosis). Global.\n", "fan": "# /fan — Divergent Escape Architecture\n\nSecond arm of the Flywheel: mandate handles flow-state (convergent, ambient, automatic); fan handles jam-state (divergent, deliberate, invoked). A jam isn't \"which next step inside this frame\" — the frame has run out of moves. Refinement loops can only deepen existing dimensions; one more question inside the same frame is polishing. Fan breaks frame, plural, at once.\n\n## Core mechanic\n```\nJAM NODE\n1. LOCATE — compress to the load-bearing stuck point, one sentence, no narrative.\n2. READ DEPTH — surface dissonance vs. deep jam; governs fan width.\n3. GENERATE LENSES — one exogenous framework per branch, dynamically from context. Each must:\n   (a) be named, pre-existing, from a domain explicitly different from the jam's own\n   (b) pass the kill-gate (below)\n4. ROUTE + TRACE — run the jam through each surviving lens; every branch: framework+domain, dimension opened, exit question (not an answer).\n5. SURFACE — present, never select. Recognition of \"which is mine\" stays with the person.\n6. RE-ENTRY — committed branch → fresh seed → Flywheel mandate (compress + emit sharpest successor).\n```\n\n## The kill-gate (enforcement spine)\nDynamic lens generation risks lenses too close to the jam's own vocabulary — divergence-shaped refinement, not real exogeneity. At Step 3, before any branch surfaces: does this lens substantially overlap the jam's own terms/structure? Yes → endogenous, reject silently, regenerate. This is negative selection (kill what's too similar), not positive instruction (\"be exogenous,\" which can be faked by surface compliance) — same architecture as an immune system killing self-similar T-cells before release.\n\n## Branch anatomy (all three fields required, or the branch doesn't surface)\n```\nBranch N — [Framework] ([Domain of origin])\nDimension opened: [what this frame has that the jam's lacks]\nExit question: [one question, not an answer]\n```\n\n## Fan width (adaptive, from Step 2's depth read)\nSurface dissonance: 3-4 branches. Mid-depth jam: 5-6. Deep jam: 6-8. Wider isn't always better — past a point the fan becomes a menu (selecting, not recognizing); stop where it still reads as escape routes, not a buffet.\n\n## Convergence-trap signal (invoke even when nothing feels explicitly \"stuck\")\nWhen all available moves are variants of each other rather than genuinely different directions, the frame is the problem, not the options — the sensation of exhaustive-feeling choice (2-3 options that feel complete) while none opens new territory. Fan's own forging session demonstrated this: the (a)/(b) framing of \"fixed repertoire vs. dynamic generation\" was itself a convergence trap, dissolved by revealing six real dimensions absent from the binary.\n\n## What it's not\nNot the Flywheel mandate (automatic/convergent vs. manual/divergent — inverses, not substitutes). Not /occam (collapses many→one; fan explodes one→many — twins, opposite direction). Not cognitive-friction-extractor (retrospective on resolved friction; fan acts live on unresolved friction). Not brainstorm (every branch structured, traced, exogeneity-verified — not a raw idea list). Not an oracle (never picks — recognition belongs to the person).\n\n## Relations\nFlywheel mandate takes over after commit (compress + ascend). Occam is the handoff when the person asks \"which one?\" among the branches. Cognitive-friction-extractor can name/file the resolution after fan produces it — fan produces, extractor preserves.\n\n## Invocation\nManual only: `/fan`, \"fan this,\" \"I'm stuck/entangled,\" \"I need a way out,\" \"diverge from here,\" \"expand from this node,\" or naming frame-exhaustion. Fires once per jam node, completes, doesn't persist — re-invoke on a new jam.\n\n## Re-entry protocol\n```\nCommitted branch → fresh seed → Flywheel (COMPRESS: portable handle; ASCEND: sharpest successor question)\n→ momentum restored — jam converted to capital, not merely cleared\n```\n", "forge-pipeline": "# FORGE PIPELINE\n\nMakes assay non-skippable by architecture, not discipline. Assay is the most chronically skipped step in the ecosystem — not forgotten, but skipped in the exact moment excitement is highest (a fresh spine sounds sharp; will is the weakest defense against that). This pipeline routes discriminate→forge→assay→contracts→build so the build contracts are architecturally unreachable without passing the adversarial gate; assay FAIL routes back to re-forge, never forward with a warning.\n\n## ATTUNE suspension\nSuspended for the full pipeline (redundant with its own sequencing); resumes on completion or \"done.\"\n\n## Pause architecture\nThree clean stations — `defer`/`park here`/`stop after this`:\n- **After discrimination** (organ selected, nothing forged) — resume: `resume forge` → spine stage.\n- **After spine delivery, pre-assay** (rarest legitimate pause) — resume → assay.\n- **After assay PASS, pre-build** — resume → load contracts, enter build.\n\nAssay FAIL is not a pause — it's a re-entry route: constraint named, forging organ re-invoked, cycles back through Stage 2→3 automatically.\n\n## The five stages\n\n**1. Discriminate input type** — Claude reads and names in one line: **bare theme** (no operational heat, no fragments) → ossify, or **loaded fragments** (partial identity, named refusals, intuition-in-motion) → spinal-column. Ambiguous → Claude states its best read + one-clause reasoning, proceeds (doesn't ask). Exception: two completed spines with explicit merge intent → names as alloy input, routes to `/alloy` directly, skips Stages 2-3. No confirmation needed; advances immediately.\n\n**2. Forge the spine** (`/ossify` or `/spinal-column`, full organ, not compressed) — ossify's internal explosion-and-selection runs inside the pipeline; practitioner sees the forged spine only, not discarded candidates. Spinal-column's transformation gate fires normally — if visible in fragments, compress directly; if absent, ask the one gate question (the only practitioner-facing question in the pipeline besides the trigger and \"build\"). Advances to assay automatically, no confirmation — requiring confirmation here is exactly the mechanism by which assay gets skipped.\n\n**3. Assay** (mandatory gate, full contract — no rewrites, verdict + constraint only). PASS → \"Assay holds. Loading build contracts.\" FAIL → name failed test(s) + re-entry constraint, re-invoke the Stage 2 organ with the constraint as input; cycles Stage 2↔3 until it holds, Claude-driven, practitioner doesn't navigate it. **Max 3 cycles** — on a third same-test failure, surface the real decision: \"Failing [test] across three cycles. Possible issue: [diagnosis]. Different axis, or a fourth pass?\" — the only in-loop decision surfaced.\n\n**4. Load build contracts** (`/hybrid-engine-contract` then `/ui-contract`, hybrid governs on overlap) — mandatory, in full, before any code. \"Contracts loaded. Say **build** to enter, or name any clarification first.\" The one deliberate pause point in the whole pipeline — practitioner may speak here before the build commitment.\n\n**5. Build** — full hybrid-engine-contract + ui-contract apply. Single `.html` file unless specified otherwise. Build law: hybrid by default (works in claude.ai + external browser via key drawer); exact API routing; no Authorization header; no banned patterns; Zone C mailto (header only, no footer); Zone A identity rule (H1 never repeated verbatim below); copy modal law (`showCopyModal` only, clipboard API banned); provider dot standard; Space Grotesk (Syne deprecated). Closing: \"Forge complete. Spine → Assay: HOLDS → Contracts → Engine delivered. Say /harvest to close, or continue.\"\n\n## Behavioral rules\nPractitioner speaks twice in a standard run: the trigger, and \"build\" at Stage 4 — everything else auto-advances. Assay cannot be skipped by request — \"if you genuinely want no adversarial validation, invoke /hybrid-engine-contract directly; inside this pipeline, the gate holds.\" Fail loop is Claude-driven, no practitioner navigation. No architecture/layout/feature questions during forging — those belong to Stage 4's window. Voice-tolerant — phonetic/fragmented \"build something\" intent fires it.\n\n## Relations\nOssify/spinal-column at Stage 2 are the full organ, still invokable standalone for theme-only work. Assay at Stage 3, still standalone-invokable outside this pipeline. Hybrid-engine-contract + ui-contract at Stage 4, neither optional. Harvest-pipeline is the natural downstream (captures what built + resolved). Ignition-pipeline is the upstream complement — ignition opens, forge-pipeline builds, harvest-pipeline closes. Attune suspended during, resumes after.\n\n## Scope\nForging phase, staffed (sequences 4 existing organs + the build). Contribution isn't sequencing knowledge — the practitioner has that — it's removing will as the mechanism by which assay fires. Global.\n", "forge-transit": "# forge-transit — Engine Context Capture for the Forge\n\nEngine-specific outbound ritual. Reads first, then fills every ENGINE DIMENSIONS field extractable from the session, in the exact project vocabulary — never fabricates, marks the rest `[UNKNOWN]`. Stacks with `/transit-block`, never replaces it: **transit-block first, forge-transit second**.\n\n**Trigger:** `/forge-transit`, \"engine handoff\", \"capture for the forge\", \"transit to forge\", \"I'm bringing this to the engine project\", \"close and bring to forge.\"\n\n## Protocol\n1. **Scan for engine signals** — Zone A/B/C references, UI Contract constraint numbers, taxonomy terms, hek_ keys/provider discussion, FORGE IT/EXPLORATION mentions, I/O shape or canvas decisions, a forged spine. No signals → don't emit; tell the person forge-transit isn't needed here.\n2. **Fill honestly** — exact QUICK REFERENCE field vocabulary, no paraphrasing. Unresolved → `[UNKNOWN]`. Cognitive identity declaration unresolved → `[UNKNOWN]` (hard gate, UI Contract Constraint 19). Portable spine: paste verbatim if forged; `SEE TRANSIT-BLOCK` if transit-block already carries it; `NONE` if not forged.\n3. **Emit** — single markdown code fence, stacked below transit-block's output, separated by a horizontal rule.\n\n## Output format\n```\n## FORGE-TRANSIT\nSession: [one-line engine session identity]   Date: [date]   Source: [project/general chat]\nDestination: Exploration-Hybrid HTML Engine Architect\n\n### ENGINE DIMENSIONS\nEngine name (Zone A): [name or UNKNOWN]\nEngine type from taxonomy: [Cognitive Pipeline / Topology Mapper / Lens Interpreter / Pattern Library / Learning Engine / Prompt Builder / Text Transformer / Hook Generator / Meta-Intent Engine — or UNKNOWN]\nCognitive identity declaration: [This engine Xs Y so that Z can T — or UNKNOWN]\nInput shape: [specific — or UNKNOWN]\nOutput shape: [specific — or UNKNOWN]\nPipeline shape: [Single-shot / Multi-stage sequential — or UNKNOWN]\nProvider default deviation: [STANDARD — or named deviation + reason]\nhek_ storage needs beyond provider keys: [list — or NONE]\nUI Contract conflict flags: [constraint numbers + conflicts — or NONE FLAGGED]\nBanned list violations to flag: [named — or NONE]\n\n### WHAT EXPLORATION MUST RESOLVE BEFORE FORGE IT\n- [open question, or NONE]\n\n### PORTABLE SPINE\n[verbatim — or SEE TRANSIT-BLOCK — or NONE]\n```\n\n## Field definitions\nEngine name = Zone A public identity. Engine type = exact taxonomy match (nine types); UNKNOWN triggers taxonomy matching downstream. Cognitive identity = `This engine [verb]s [what] so that [who] can [transformation]` — hard gate, must resolve before FORGE IT. Input/output shape = specific description of Zone B input / canvas render, not generic. Pipeline shape = single-shot vs. multi-stage. Provider deviation = STANDARD unless engine deviates from context-aware default (artifact→Claude Native / standalone→Groq). hek_ needs = localStorage keys beyond standard provider keys. UI Contract flags = specific constraint numbers at risk. Banned-list flags = `62ch constraints`, fixed-width containers, `<form>` tags, non-streaming calls, CDN imports, `display:none` on event-wired elements, sticky-inside-scroll on interactive elements, raw clipboard calls.\n\n## Stacking order\n```\n## TRANSIT-BLOCK\n[universal session context]\n---\n## FORGE-TRANSIT\n[engine dimensions]\n```\nPaste both as one opening message; receiving session reads universal context first, engine dimensions second.\n\n## Receiving session behavior\nRead both blocks → state what's already resolved (never re-ask) → ask only UNKNOWN fields, one at a time → FORGE IT releases normally once resolved.\n\n## Edge cases\nNo engine signals → don't emit, use transit-block alone. Spine not forged → `NONE`; receiving session runs /spinal-column or /ossify first. Cognitive identity undeclared → `UNKNOWN`, hard gate. Multiple engine concepts → one block per concept, labeled, person chooses which to bring first. Engine type unclear → `UNKNOWN`, taxonomy matching runs downstream.\n", "fuse-delta": "# Fuse Delta\n\nAdditive diff merges on living contracts — not a text merger, not version control. Transfers resolved cognitive friction between contract instances: one builder resolves friction, fuse-delta transfers that immunity to the other. The valuable artifact is never the text — it's the friction resolution embedded inside it.\n\n## Modes\n**A — Cross-instance fusion:** two contracts in, Fusion Report + Updated Contract out.\n**B — Self-evolution:** one contract + new session observations in, Evolution Report + Updated Contract out.\nIf unclear which, ask.\n\n## Three-pass algorithm (run in order, never skip or merge passes)\n\n**Pass 1 — Intersection.** Constraints present in both = pre-shared immune memory. Discard from merge, log as convergence evidence. No new value from absorbing them.\n\n**Pass 2 — Complementary delta** (primary value-generation). Constraints present in one, absent in the other = friction one builder hit that the other hasn't. Absorb with full provenance:\n```\nFRICTION — what kept recurring\nRESOLUTION — what fixed it\nCONSTRAINT — the rule now encoded\nSOURCE — which instance originated it\n```\nWithout provenance, rules become decorative.\n\n**Pass 3 — Contradictory fork.** Same territory, different resolutions. Never merge blindly — surface the fork:\n```\nTERRITORY / RESOLUTION A / RESOLUTION B / ANALYSIS (which is structurally superior, why)\nTRADEOFFS / RECOMMENDED / CONFIDENCE (High/Medium/Requires user judgment)\n```\nRecommend first; ask only when superiority genuinely can't be determined. Prefer resolutions for structural superiority, precision, resilience, or a true synthesis — never for recency, length, or \"whose instance this is\" alone. State the assumptions under which a recommendation holds.\n\n## Output (always dual)\n**Artifact 1 — Fusion Report:** Convergence Map, Absorbed Deltas (with provenance), Resolved Forks, Unresolved Forks (if any), Summary. See `references/report-template.md`.\n**Artifact 2 — Updated Contract:** all original constraints unchanged + absorbed deltas woven into appropriate sections (never dumped at the bottom) + resolved forks applied + unresolved forks flagged inline `[FORK: UNRESOLVED]`. Reads as one coherent document, not a patchwork — maintain the target's voice, formatting, section architecture; don't restructure wholesale.\n\n## Execution\n1. Identify mode (ask if unclear). 2. Parse both inputs fully before any classification. 3. Run the three passes in order. 4. Generate Fusion Report — name the source contract for every absorbed delta. 5. Generate Updated Contract — integrate into existing structure. 6. Present Fusion Report first, Updated Contract second; surface unresolved forks before the Updated Contract and request decisions.\n\n## Provenance format (inline, in the Updated Contract — see `references/provenance-format.md`)\n```\n> **[DELTA: absorbed from Contract B]**\n> *Friction:* [what kept going wrong]\n> *Resolution:* [what fixed it]\n```\nStrippable for a clean version, but present in the primary output.\n\n## Recursive loop\n```\nBuilder A friction → resolved → becomes contract constraint → fuse-delta extracts\n→ Builder B absorbs → avoids the friction → repeats both directions\n```\nResult: shared immune system across instances.\n\n## Edge cases\nIdentical contracts, different surface text → Intersection; don't absorb style. One contract a strict subset → all unique constraints are Complementary Deltas, no forks unless shared constraints diverge with functional consequence. No territory analog → absorb as Complementary Delta, don't force a fork. Mode B with no clear friction → say so plainly, don't fabricate. Fork with equal merit → surface both, request judgment, don't default.\n\n## Not\nNot a diff tool, version control, formatter, or summarizer. Goal is never a longer document — it's a more friction-resistant one.\n\n## Reference files\n`references/report-template.md` (Fusion Report structure), `references/provenance-format.md` (provenance markup) — pull from these, don't reconstruct from memory.\n", "governing-variable-sensor": "# GOVERNING-VARIABLE SENSOR\n\nFires when several plausible candidates are entangled and there's a pull to fix one before the target is clear — diagnostic phase, before occams-razor, not a replacement for it. Locate, report, stop. Never act on the finding.\n\n**Identity:** a cross-examiner of your own conviction, not an actuator. Names a variable only after it survives contradiction from three instruments built to distrust each other: costume-collapse (distrusts surface multiplicity), circling (distrusts what your intellect picked for convenience), dependency test (distrusts a felt pull — feeling central isn't the same as being load-bearing).\n\n## Method (strict sequence)\n1. **Costume-collapse** (active) — scan for questions wearing different clothes, merge before search begins. You always start with more candidates than actually exist.\n2. **Circling** (witnessed, never run) — once compressed, stop steering; observe where attention involuntarily returns against your own preference for tidiness. Cannot be passed by reasoning toward an answer — only by honestly noticing whether a return happened.\n3. **Dependency test** (active, on survivors) — does resolving this one collapse the others? Distrusts step 2's pull: felt-central ≠ load-bearing.\n\nTriangulate only once all three have honestly reported — not on the first convincing one.\n\n## Output\nReport which instruments agree, which dissent — don't soften dissent into a tie-break. One strong channel with the other two silent/split → say so plainly and stop; one confident instrument never stands in for three.\n\n## Constraints\nNever let a strong circling-pull alone stand as identification (a felt return is a candidate, not a verdict). Never let a clean dependency-test elimination alone stand as identification either. Never *run* circling — steering it toward what the other two already suspect poisons the one instrument built to catch that bias. Never proceed to action once named — naming is the entire operation; handoff to occams-razor or the person for the rest.\n\n## Relations\nUpstream of occams-razor: this locates the fork, occam cuts through it. Don't merge them — running as one collapses diagnostic and actuation into a single pass, the exact premature-convergence failure this exists to prevent.\n\n## Scope\nDomain-agnostic — technical, personal, architectural, editorial. Global.\n", "graft-in": "# GRAFT-IN — In-Session Node Pinning and Sequential Branching Log\n\nHolds a root response fixed while branches accumulate against it — bringing ChatGPT's per-response fork gesture inside one thread, but legible: branches sit side by side in a durable log instead of isolated.\n\n## When NOT to invoke\n**/fan territory** — stuck/entangled/frame-exhausted, not arrival. Graft fires on an already-resolved response worth varying; pinning a jammed one produces branches of the jam, not variations of a generative ground.\n**/ramify territory** — need a fan of divergent successor *questions* from friction, not controlled counterfactuals on a fixed root. Graft = compare continuations; ramify = generate directions.\n**No node yet** — /graft can't fire without a prior response. If invoked too early: \"Nothing to pin yet — /graft pins the immediately prior response.\"\n\n## The three objects\n**Node** — the frozen root, pinned once at `/graft`, never updates; conversation happens around it, never in it.\n**Infusion** — the one variable injected per branch (one constraint/reframe/context fragment/question angle). One infusion per branch is what makes a fork readable — two makes attribution ambiguous.\n**Fork** — one branch run under one infusion. Forks accumulate in the log, addressable by number; they never replace each other.\n\n## Commands\n\n**`/graft`** — pins the immediately preceding response. Compresses to a titled snapshot (Node ID, timestamp, 2-3 sentence distillation of its generative ground, not its conclusions), declares it open, then waits.\n```\nNODE PINNED — [Node ID: N-01]\nRoot: [2-3 sentence distillation]\nPinned at: [timestamp/position]\nStatus: OPEN — awaiting first fork\nInvoke /fork [infusion] to branch from this root.\n```\nOne node per session — re-invoking with a node already pinned prompts: replace (closes current log, opens new) or continue branching from existing root. Never silently overwrites.\n\n**`/fork [infusion]`** — runs one branch from the pinned node under the stated infusion. No node pinned → \"invoke /graft first.\" No infusion given → ask for one. Generates the continuation as if the node had been seeded with that infusion, appends to the log with a fork number, then a one-sentence diff note (most visible shift vs. previous fork or raw node).\n```\nFORK [F-01] from Node [N-01]\nInfusion: [verbatim]\n[Branch response, full]\nΔ Shift from [previous]: [one sentence]\n```\nTwo+ infusions in one call → name them explicitly, flag attributional ambiguity, proceed only on confirmation, mark the entry `infusion-compound: true`.\n\n**`/log`** — full accumulated branch log for the pinned node:\n```\nGRAFT LOG — Node [N-01]\nRoot: [distillation]\n  F-01 | Infusion: [ ] | Δ: [ ]\n  F-02 | Infusion: [ ] | Δ: [ ]\nPattern so far: [1-2 sentences — which dimensions are sensitive to infusion, what stayed stable]\n```\nThe Pattern line is the highest-value output — meta-knowledge across forks, not per-fork change.\n\n**`/root`** — recalls the pinned node verbatim (full text, not distillation). Use to re-read before forking or to re-ground after drift.\n\n## Disciplinary laws\nOne infusion per fork — the discipline is the instrument. The node never drifts — fixed regardless of what forks or subsequent conversation produce. Forks never invalidate each other — comparative log, not revision history. Graft-in never fires ramify — different object (root vs. friction), different output (log vs. fan).\n\n## Relation to GRAFT-OUT\nGraft-in is session-local — the log dissolves at session end unless exported. Graft-out is the cross-session organ, preserving a frozen node as a portable block for a fresh session. Export via `/graft-out` or \"export this node\" — the node exports clean, the fork log only with `/graft-out --with-log`.\n\n## Not\nNot a revision tool (varying, not correcting). Not a ramify replacement (pre-resolution divergence vs. post-resolution counterfactual). Not an undo (node and main thread coexist; pinning doesn't rewind).\n", "graft-out": "# GRAFT-OUT — Cross-Session Node Preservation and Re-Activation\n\nTakes a node pinned inside a GRAFT-IN session and seals it into a context block that survives the session's end, pasteable verbatim as the opening of a fresh one — instant re-activation, no reconstruction cost.\n\n## The export object (four sections, structured, paste-ready — not a summary)\n1. **GRAFT NODE** — full verbatim text of the pinned root, exactly as at `/graft` time. No edits, no compression — any alteration produces a different node and incomparable forks.\n2. **CONTEXT ENVELOPE** — minimal prior context needed for legibility. Test: what's the minimum a reader needs to understand why this response exists? Nothing beyond that.\n3. **NODE DISTILLATION** — the same 2-3 sentence distillation from `/graft` time — cognitive operation performed, what would be absent without it.\n4. **ACTIVATION INSTRUCTION** — always verbatim: `This is a GRAFT node. Treat it as the pinned root. Invoke /fork [infusion] to branch from it.`\n\n## Commands\n\n**`/graft-out`** — no node pinned → \"invoke /graft first, then /graft-out.\" Otherwise assembles the four sections in a copy-fence, confirms: \"Node [N-01] exported. Paste as the opening message of a new session.\" Fork log **not** included unless requested — the node travels alone, so the new session starts from the pure root, uncontaminated by what prior branches found.\n```\nGRAFT NODE EXPORT — [Node ID: N-01]   Exported: [timestamp]\n═══\n## GRAFT NODE\n[full verbatim root text]\n## CONTEXT ENVELOPE\n[minimal prior context]\n## NODE DISTILLATION\n[2-3 sentences]\n## ACTIVATION INSTRUCTION\nThis is a GRAFT node. Treat it as the pinned root. Invoke /fork [infusion] to branch from it.\n═══\n```\n\n**`/graft-out --with-log`** — same, plus a fifth section: the full fork log + its Pattern line, with the note: \"These branches are recorded for orientation only. The node is still the fixed root. Fork from it fresh.\" Use when prior branch patterns are informative for avoiding re-discovery.\n\n## Re-activation protocol\nPasted block → receiving session pins GRAFT NODE as the frozen root (as if `/graft` fired), confirms, waits for `/fork`. The node is the ground; envelope/distillation are orientation only. A `--with-log` fork log is read but not inherited as active entries — new session's log starts empty; prior forks are archived history, not live.\n\n## Disciplinary laws\nNode travels verbatim — no compression, no curation; an 800-word node exports 800 words. Context envelope is minimal by law — resist including the full conversation; a bloated envelope pollutes the root with the prior session's specific trajectory. Fork log doesn't travel by default — a session starting with knowledge of prior forks is continuing an inquiry, not branching from the root; use `--with-log` deliberately if that's the intent. One node per export — no batch export, no archive, no export history tracking.\n\n## Relations\nFull GRAFT arc: `/graft` (pin) → `/fork` (branch) → `/log` (read) → `/graft-out` (export) → [paste] (re-activate) → `/fork` (new session, same root). A node cycles sessions without drift; only the practitioner accumulates the cross-session pattern.\n\n**Vs. handoff:** handoff compresses a full session (decisions, open threads, contracts); graft-out carries only the frozen root. When both apply: **/handoff first, then /graft-out** — session context before node context, the frame before the root. Reversing produces a less legible new session.\n\n## Not\nNot a session archive (preserves what a session produced as a root, not what happened in it). Not a handoff substitute. Not a node ledger — each export is one node, one block, one paste.\n", "handoff": "# Handoff — Session Context Compression\n\nOne tight markdown block, under 300 words, that a new session opens directly from resolved understanding — not the exploratory arc. Transfer companion to `/crystallise` (that shares outward; this carries forward).\n\n## Extract\n1. **Session topic** — one line.\n2. **Resolved understandings** — 2-4 bullets, max, each the resolution not the journey.\n3. **Active build decisions** — artifacts built/decided, with status (forged/installed/pending).\n4. **Established contracts** — standing rules locked in this session that persist forward.\n5. **Session ritual context** — if part of a named pipeline (Ignition/Forge/Harvest/Audit), which stage was active at close and what's next; if harvest was partial, which stages completed.\n6. **Pending threads** — 1-3 items max, omit section if none.\n7. **Suggested opening prompt** — one sentence to open the new session with.\n\n## Output\n```\n## Handoff — [Session Topic]\n[Date · Time]\n\n### Resolved\n- [ ]\n\n### Built this session\n- [artifact] — [status]\n\n### Contracts in force\n- [ ]\n\n### Pipeline context\n- [pipeline] — [stage at close] → next: [stage]\n\n### Pending\n- [ ]\n\n### Open with\n\"[suggested opening prompt]\"\n```\n\n## Compression rules\nNo back-and-forth, only outcomes. No friction narrative (that's /crystallise). No code/SVG/heavy formatting inside the block. Every bullet under 15 words — if a resolution needs more, it's not distilled yet. Total under 300 words. Omit empty sections.\n\n## Not\nNot a readable session summary — a machine-readable seed. Not a /crystallise replacement. Not a memory substitute — memory handles persistent facts, handoff handles session-specific decisions/pending work.\n\n## After rendering\nOne plain-prose line below the block: \"Paste this block as your first message in the new session.\" Nothing else.\n\n## Edge cases\nStill mid-exploration, no resolution → say it can't hand off cleanly yet; suggest continuing or /crystallise for the open arc. Multiple unrelated threads → one block per thread, labeled, person picks. Handoff to a specific project/engine → add a one-line preamble naming it to the opening prompt.\n", "hardcoded-provider-panel": "# Hardcoded Provider Panel — Retrofit Instructions\n\n(Companion resource to the three-skill stack: `ui-contract` + `hybrid-engine-contract` + `model-config-contract`. Invoke all three as normal. This is not a fourth skill — it's the declared override inside `model-config-contract`'s own retrofit path: \"Per-engine override is still permitted for the rare engine whose provider set genuinely diverges\" (see RETROFIT PROCEDURE step 1). This file has no trigger of its own; it is reached only via `model-config-contract`'s `hardcode` trigger.)\n\n## When this applies\n\nUse only when an engine's provider set genuinely diverges from the canonical config — offline use, fixed vendor set, no dependency on the GitHub-hosted `model.json` wanted. Not a default. Not a style preference.\n\n## Declare at top of build, before any panel code fires\n\n```js\nwindow.EnginePanels = {\n  library: false,\n  importExport: false,\n  settings: true\n};\n\nwindow.ProviderConfig = {\n  source: 'hardcoded',        // 'config' | 'hardcoded'\n  providers: [\n    // name the fixed list explicitly — no fetch, no CANONICAL_CONFIG_URL\n    { id: 'claude', label: 'Claude Native', native: true },\n    { id: 'groq',   label: 'Groq' },\n    { id: 'or-auto', label: 'OpenRouter' }\n  ]\n};\n```\n\nRecord the reason inline as a comment — not optional:\n\n```js\n// PROVIDER_SOURCE: hardcoded\n// REASON: <why this engine diverges from config-driven default>\n```\n\n## What changes vs. the config-driven default\n\n- `model-config-contract`'s fetch/validate/fallback logic (`CANONICAL_CONFIG_URL` fetch, `providers` array validation, `Config: Live / Local Fallback` badge) does not run. No badge is rendered at all in this mode — there is nothing to report live/fallback status on.\n- The provider list is written directly into `window.ProviderConfig.providers` at build time. Changing providers later means editing this HTML file, not editing `model.json` — that's the accepted tradeoff of choosing this branch.\n\n## What does NOT change — applies identically in both branches\n\n- **Claude-native carve-out** (`model-config-contract`, WHAT STAYS HARDCODED section): endpoint (`https://api.anthropic.com/v1/messages`), headers (no Authorization), and model string stay hardcoded in the adapter in code, regardless of `source`. Never make this configurable \"for consistency\" — it's the entire reason native routing exists.\n- **Dot-color table** (fixed: Claude / Groq / OR `#f97316` for all `or-` prefixed routes) — `ui-contract` Constraint 18B (Provider Dot Standard). Unchanged.\n- **Key storage convention** — `localStorage` under `hek_{provider}` (or `hek_{keyStorageName}` if declared) — unchanged.\n- **OR artifact-blocking rule** — block `run()` inside iframe context for any `or-` provider, surface the notice — unchanged.\n- **Panel mechanics** — collapsible overlay, `EnginePanels` flag model, persistence layer (Constraint 22/23) — unchanged. The provider source is the only variable; panel chassis is constant.\n\n## Explicitly avoid\n\nDo not restate dot logic, key convention, or panel mechanics inside this doc's engine implementation \"for completeness\" — those live once, in `ui-contract`, and apply the same regardless of `source`. This doc only ever holds the one thing that's actually different: the provider list source and the reason it diverged.\n\nKeep this as a standing companion file, resolved automatically by `model-config-contract`'s `hardcode` trigger — no manual pasting required once filed in the ecosystem. Do not merge into `ui-contract` or `model-config-contract`; do not promote this to an independently-triggerable skill.\n", "harvest-pipeline": "# HARVEST PIPELINE\n\nEnsures the session's resolved intelligence doesn't die in the practitioner's memory — the least reliable surface in the ecosystem, degrading silently (skills named but never placed, stale staging docs, diverging registries, frozen brain docs). Closing sequence knowledge belongs to the ecosystem, not the practitioner; the practitioner's job is to confirm and defer, nothing more. Discipline applied to sequence-memory is inconsistent; a pipeline is the same result every time.\n\n## Read/write surface — local only\nAll reads/writes route through `claude_brain/` via Claude Desktop's local folder MCP — never Google Drive, no file ID minting, no Drive fallback. Canonical paths: `claude_brain/therantai-staging-placements.md` (staging), `claude_brain/skill-registry.md` (registry), `claude_brain/therantai-brain.md` (brain doc). All writes overwrite in place. If `claude_brain/` is inaccessible: name the gap, deliver in-session text, hold — never silently fall back to Drive.\n\n## Pause architecture (first-class, not an edge case)\nThree clean stations — `defer`/`park here`/`stop after this`:\n- **After extraction** — nothing written yet. Resume → placement.\n- **After staging** (most common stop) — written to staging doc as pending-merge; this is the buffer working correctly, not a broken run. Resume → sweep.\n- **After registry sweep** — merged, staging cleared, only brain sync remains. Resume → sync.\n\n**Light close** (`/harvest --light`) — runs extraction + staging only, explicitly defers sweep + sync. Not a shortcut — the correct invocation for minor sessions.\n\n## The five stages\n\n1. **Extract** (`/cognitive-friction-extractor`) — scan for resolved friction, press into CATEGORY/SKILL/CONSTRAINT/TRIGGER/ASCENT, thicken existing skills before proposing new. Handoff: \"[n] friction(s) named. Say **place** or **defer**.\"\n2. **Place** (`/placement-protocol`) — four structural questions per friction (scheme/arc-phase/trigger/staffed-or-orphan); autonomous mode by default inside the pipeline, no socratic questioning unless explicitly requested. Handoff: \"[n] placed. Say **stage** or **defer**.\"\n3. **Stage** — write placed skills to the staging doc as pending-merge entries (name, arc-phase, verdict, trigger, forging status). Read the doc first — append, don't overwrite, if pending entries exist. Handoff: \"[n] staged. Say **sweep** or **defer** (clean — staging holds state across sessions).\"\n4. **Sweep** — absorb all pending-merge entries into the registry, then **overwrite staging doc to empty immediately** (mandatory — the recurring leak is absorption without clearing). Handoff: \"Registry updated, staging cleared. Say **sync** or **defer**.\"\n5. **Sync** — read and update `therantai-brain.md` to reflect the new registry state (phase map, candidate→living transitions). Closing: \"Harvest complete. [n] extracted→placed→staged→registered→reflected. If carrying forward, run /handoff now.\"\n\n## Resumption protocol\nOn `resume harvest`: ask where they parked, or infer from the staging doc / registry timestamp if MCP is accessible. Name remaining stages, confirm with \"go,\" resume from that station — completed stages never re-run.\n\n## Behavioral rules\nClaude drives, practitioner confirms with one word (`place`/`stage`/`sweep`/`sync`/`go`) — no stage-naming burden on the practitioner. Every station is a clean, complete stopping point. Placement runs autonomously inside the pipeline (socratic mode is for standalone /placement-protocol). Staging-doc overwrite after sweep is mandatory and non-negotiable — flag explicitly and don't close if it fails. Local MCP is the sole write surface — ignore any Drive file ID reference from prior context. Handoff always follows harvest, never precedes it (an early handoff carries an incomplete picture). Light close is a first-class invocation, not a lesser one.\n\n## Relations\nCognitive-friction-extractor (Stage 1) and placement-protocol (Stage 2) remain standalone-invokable — same organs, different operating mode inside the pipeline (autonomous vs. socratic). Attune may surface /harvest as the invocation when the threshold crosses; harvest executes the chain. Handoff runs after harvest closes, never instead of or before. Ignition-pipeline reads what harvest writes to the brain doc — harvest writes, ignition reads.\n\n## Scope\nClosing phase, staffed (sequences 4 existing skills + brain sync). v1.1 delta: Drive fully excised, all surfaces migrated to local `claude_brain/`, handoff-after-harvest law encoded. Global.\n", "ignition-pipeline": "# IGNITION PIPELINE\n\nEliminates the orientation tax paid at every session's start — reconstructing what's unresolved, pending, and relevant is retrieval, not thinking, and shouldn't live in degrading working memory when a pipeline can do it faster and without variance. Practitioner arrives, says one word, gets complete accurate context back before saying anything else.\n\n## ATTUNE contract\nAmbient ATTUNE suspended for the full pipeline (no threshold for it to catch that the pipeline isn't already handling). Stage 3's pulse is a compressed read only (phase + skills, nothing else) — not full ambient attune. Resumes on \"begin.\"\n\n## Read surface\nLocal `claude_brain/` via folder MCP only (not Drive) — `therantai-brain.md` (threads/state), `therantai-staging-placements.md` (pending-merge), `skill-registry.md` (Stage 3 relevance). Pure read instrument — writes nothing. Inaccessible file → read what's possible, name the gap, proceed; partial orientation beats none.\n\n## Pause architecture\nOne defer point: after Stage 2, if the MCP read is slow/unavailable/incomplete. Say `defer`/`park here`/`slow down` → delivers what Stages 1-2 retrieved, names what's unread, holds. Normal run: all four stages under a minute.\n\n## The four stages\n1. **Read brain doc** — surface the 3 most recent unresolved threads (live, still warm — not a summary/history). More than 3 live → name 3, note \"3 of [n] shown.\" Feeds Stage 2 silently.\n2. **Check staging doc** — report clean (\"no pending entries\") or \"[n] pending: [names]. A sweep is owed.\" Informational only — doesn't route to harvest. Feeds Stage 3 silently.\n3. **Attune pulse** (compressed, not full) — **Phase read:** names dominant arc-phase (Forging/Reconciling/Navigating/Harvesting/Auditing) with one clause of reasoning. **Skill read:** names the two most relevant skills, from an opening task if present, or from active threads if not. No confirmation needed — orientation, not directive. Feeds Stage 4 silently.\n4. **Deliver orientation block:**\n```\nSESSION OPEN — [date]\nACTIVE THREADS ([n]):\n  1. [thread] — [one clause]\n  2. [thread] — [one clause]\n  3. [thread] — [one clause]\nSTAGING: [clear / n pending — names]\nPHASE: [name] — [one clause]\nSKILLS: /[A] · /[B]\nSay BEGIN to open the session.\n```\nFixed format, one glance, no interpretation required. On \"begin\": ambient ATTUNE resumes, session opens.\n\n## Behavioral rules\nPractitioner speaks twice — the trigger and \"begin.\" No questions during execution — Claude reads and proceeds, naming uncertainty rather than stalling on genuinely unresolvable discrimination. Orientation block format never varies. Partial orientation beats none on a single read failure. Stage 3's pulse stays compressed — no irreversibility thresholds, no warnings, no inflection map (that's ambient attune's job after close). Voice-tolerant — intent matters more than exact phrasing.\n\n## Relations\nHarvest-pipeline is the closing complement — ignition opens oriented, harvest closes captured; the bookending frees full attention for the work between. Attune suspended during, resumes on \"begin\" (Stage 3's pulse is not an attune invocation). Ignition reads what harvest last wrote to the brain doc, never writes to it itself. Cognitive-friction-extractor/placement-protocol are closing-only, no role here.\n\n## Scope\nOpening phase, orphan by choice (it *is* the opening gate — nothing precedes it; reads four surfaces' outputs without invoking them as standalone skills). Global.\n", "intake": "# Intake\n\nCold orientation gate every external skill crosses before anything deeper turns — not a scanner, not fuse-delta. Answers one governing question first: how should this be processed at all? Fuse-delta assumes a comparison surface that may not exist; absent territory has nothing to fuse against, multi-function material can't be fused as one object. Intake is upstream — it points.\n\n## The three questions (in order — each gates the next)\n\n**Q1 — What type of material?** Determines the comparison surface before anything is compared. Types: **skill file** (compares to installed skills, same domain) · **contract variant** (compares to corresponding installed contract) · **session extract** (compares to memory + skills it would thicken) · **loose fragment** (no comparison surface — routes to spinal-column/forging first). Unclear type → name it before proceeding; misclassification poisons everything downstream.\n\n**Q2 — Staffed or absent territory?** Search the installed ecosystem for a trigger that would fire on the same situation. Found → **staffed** → fuse-delta Mode A (three passes, contradiction detection). None → **absent** → no merge at all; collapses to adopt-as-is / adapt-and-install / discard. Most absent-territory skills should be adapted, not adopted raw — a friend's skill carries their lineage/naming/assumptions that rarely transfer whole.\n\n**Q3 — Single or multi-function?** If it spans more than one territory, decompose before comparing — recurse each component through Q1/Q2 separately. Skipping this imports regression: a multi-function skill rarely maps to one installed skill, and installing the whole object because one function is genuinely new drags duplicated functions in with it. **The unit of intake is the function, not the document.** Per function: duplicates an installed organ at equal/lower fidelity → discard; duplicates but adds genuine density → Complementary Delta via fuse-delta; addresses absent territory → extract as candidate, adapt-and-install.\n\n## The verdict (state explicitly, with reasoning, before any work)\n```\nPATH A — Mode A Fusion: staffed territory, single function, genuine peer → fuse-delta.\nPATH B — Adapt and Install: absent territory, no analog → re-author, forge, /place.\nPATH C — Decompose First: multi-function → split, each function re-enters intake alone.\nPATH D — Discard: duplicates at equal/lower fidelity, no added density → note and decline.\n```\n\n## Relations\n**Fuse-delta** is one of four paths (A only) — sequential, not overlapping: intake orients, fuse-delta merges. Running fuse-delta without intake is exactly the slow live-orientation problem this gate eliminates. Path A handoff arrives with mode and targets already determined.\n**Placement-protocol** brackets the other end of the lifecycle — intake decides whether/how something enters, placement decides where it lands (arc-phase, registry entry). Path B/C outputs still need /place afterward.\n\n## Behavior\nRead fully → answer Q1 (name type, resolve ambiguity) → answer Q2 (search for a firing trigger, declare staffed/absent) → answer Q3 (decompose + recurse if multi-function) → state verdict + reasoning in the same response → on assent, execute (hand to fuse-delta / adapt-install / decompose / discard). Meant to take two minutes — its purpose is orientation, not depth; depth belongs to whatever path it routes to.\n\n## Not\nNot a merge tool (fuse-delta), not placement (placement-protocol), not a forge (spinal-column/intuition-forge), not an extractor (friction extractor). Owns one decision only — how to process the incoming thing — decided fast, then handed off.\n", "intuition-forge": "# Intuition Forge\n\nEight-station pipeline: raw intuition → rendered standalone HTML engine. No station skippable; each feeds the next.\n\n```\nSeed → Intention Field → Identity → Architecture → Interaction Schema → System Mandate → Stress Test → Artifact\n```\n\n## Core principles\n**Hybrid-generative** — Claude generates a first-pass per station, user confirms/edits/reshapes before advancing (approval, edit, or \"next\"/\"go\"/\"yes\"). Corrections regenerate that station's output before moving on.\n**Cumulative context** — every confirmed output carries forward; Station 8 has access to everything.\n**Backward looping** — user can jump to any prior station by name; revising it invalidates and regenerates everything downstream.\n**No premature rendering** — zero code before Station 8; Stations 1-7 are pure conceptual/structural work.\n**Station announcements** — name + one-two sentences on what it does, at the start of each.\n\n## Station 1 — Seed\nCapture raw intuition unedited. Ask for it messy/fragmented if not already given; don't re-ask if already stated. Produce a **Seed Statement** (2-4 sentences, mirror not interpretation, in the user's own register). Advance on confirm/edit.\n\n## Station 2 — Intention Field\nName the transformation the thing produces — not what it is, what it *does to* someone using it (\"before this, the user was ___; after, the user is ___\"). Produce **Intention Field Statement** (1-3 sentences) + optional **Shadow Statement** (what it explicitly refuses to be). Advance on confirm/reshape.\n\n## Station 3 — Identity\nNaming is an ontological commitment that constrains everything downstream. Produce: **Name** (2-4 distinct candidates, each encoding character not just function), **Essence Statement** (\"It is a ___ that ___\"), **Temperament** (fast/slow, dense/spacious, generative/analytical, surgical/exploratory, warm/austere). These become architectural constraints, not cosmetics. Advance on name selection + confirm.\n\n## Station 4 — Conceptual Architecture\nInternal topology — chambers/modules/layers, their relationships (sequential/parallel/nested/branching), what flows between them, where boundaries sit. Topological, not visual (UI is Station 5). Produce an **Architecture Map** in structured prose, noting which parts are fixed/toggleable/variable. Advance on confirm/reshape.\n\n## Station 5 — Interaction Schema\nThe surface topology, distinct from Station 4's internal one: entry (single/multi-field/seed+selectors), navigation (tabs/scroll/switchboard/auto-routing), what's seen at each stage, available controls, primary display mode. Produce an **Interaction Schema** naming each interface element + the **primary user action**, made effortless. Key principle: architecture and interaction are deliberately separable — swap one without restructuring the other. Advance on confirm/reshape.\n\n## Station 6 — System Mandate\nCompress Architecture + Interaction Schema into the operational core — three components:\n1. **System Prompt** — the engine's soul: what it is, how it thinks, what it produces, what it refuses. Dense, precise, complete; encodes Intention as purpose, Identity as voice, Architecture as internal logic, Interaction Schema as user-awareness.\n2. **Input Schema** — fields, types, required/optional, constraints.\n3. **Output Template** — sections, order, format, length/density/tone rules.\n\nTwo mandatory constraints in every System Prompt: a symbolic/oracular final output must never explain or analyze itself — must land as pure image; and transitions between sections must read as deepening, not topic change. Production-ready, copy-pasteable. Advance on confirm/reshape.\n\n## Station 7 — Stress Test\nGenerate 3-5 test seeds (obvious, edge, adversarial) — user may edit the set. Run the System Prompt against each (Claude roleplays the engine), present outputs for evaluation against: does it honor the Intention? the Architecture? the Output Template? any failure modes? On failure, name which station it traces to (usually 6, sometimes 4) and recommend revisiting — downstream invalidates on re-entry. Advance on satisfactory outputs.\n\n## Station 8 — Artifact Rendering\nSingle complete runnable HTML file: all CSS/JS inline, Google Fonts via link tags, three-font system (display/body/UI — Syne/Source Serif 4/Inter or as specified), gear-icon config drawer with localStorage keys, multi-provider (Groq default llama-3.3-70b-versatile, OpenAI, Gemini, LMStudio), Station 6's System Prompt embedded as the soul, Station 6's Input/Output Schema driving interface and display, Station 5's Interaction Schema governing nav/layout/controls, mobile-responsive, dark theme default. Identity should be visible in typography/color/spacing/atmosphere — a tool with a point of view, not a generic API wrapper. Deliver the file + a brief human-readable summary (name, intention, core interaction pattern).\n\n## Edge cases\nFully-formed idea, not raw intuition → still run all eight; the value is progressive crystallization, not starting from chaos. Wants React not HTML → Station 8 adapts, upstream unchanged. Wants to skip Station 7 → gently discourage (\"untested prompt = looks right, thinks wrong\"), proceed if they insist, note the skip. Wants to start at Station 4+ → accept, but ask for compressed upstream context (Seed/Intention/Identity) so downstream coheres.\n\n**Spine-first entry** (arriving with a completed spine from /spinal-column, /ossify, /core-extractor): Stations 1-3 and part of 6 are pre-resolved. Announce \"Spine-first mode — Stations 1-3 resolved. Entering at Station 4.\" Extract: IDENTITY→Station 3, METHOD→Station 2, OUTPUT CONTRACT+CONSTRAINTS→pre-loaded Station 6 material. Open Station 4 immediately (spine names the operation, Station 4 gives it topology). Continue 5→6→7→8 normally; at 6, the spine IS the first System Prompt draft, refined with Architecture/Interaction layered in — thickened, not discarded. Spine identity is immutable — architecture/interaction may add vessel but never contradict its refusals/constraints. Trigger: pasted spine + \"build this\"/\"take this to HTML\"/\"forge this\"/\"/intuition-forge from here\", detected via IDENTITY/METHOD/OUTPUT CONTRACT/CONSTRAINTS sections.\n", "kinship": "# KINSHIP — Exhaustive Lateral Concept-Mapping Organ\n\nA lateral cartographer, not a router or compressor. Taxonomy-router names one shelf and stops; distill moves upward to a seed. Kinship expands sideways — who else lives on this shelf, what distinguishes each neighbor. For learning-phase work: building terminology, sharpening easily-confused distinctions, installing a concept by installing its whole neighborhood.\n\n## Standing laws\n1. **Exhaustive, not curated** — minimum 5-6 siblings; weak ones aren't excluded (exclusion is taxonomy-router's job).\n2. **Sideways only** — never reduce to a seed (distill's job), never route to an action (router's job).\n3. **Standalone** — no dependency on other skills; a bridge may be named at the end, never mandatory.\n4. **Every sibling earns a distinguishing line** — the differential is the actual unit of learning, not the name alone.\n5. **Two outputs, always** — text map AND companion visual, neither optional.\n\n## Operation\n1. **Locate parent dimension** — one sentence: what larger category this belongs to.\n2. **Generate exhaustive siblings** (5-6+) — near-synonyms that are actually distinct, commonly-confused adjacents, structurally-related concepts that illuminate by contrast.\n3. **Write each sibling's distinguishing line** — a differential (what's present in one, absent in the other), not a definition of the sibling.\n4. **Map sub-variants** of the target itself, if any exist (don't force).\n5. **Render text map** (format below).\n6. **Render companion visual** — lateral/radial diagram, target at center, parent dimension as outer ring, siblings around it with distinguishing lines as edge labels. Via visualize:show_widget SVG mode, diagram module loaded first.\n7. **Offer the bridge, don't force it** — if spine-shaped or registry-worthy, name it as one closing line (\"/ossify would forge this\"), never execute automatically.\n\n## Text map format\n```\nCONCEPT: [target]\nPARENT DIMENSION: [one sentence]\nSUB-VARIANTS: [if any, else omit]\nSIBLINGS:\n1. [name] — [distinguishing line]\n2. [name] — [distinguishing line]\n... (5-6 min, exhaustive not capped)\nPLACEMENT SENTENCE: [parent dimension + what separates this from its nearest neighbor]\n[optional] BRIDGE: [named skill + one clause]\n```\n\n## Relations\n**Vs. taxonomy-router** — router asks \"where does this go\" (stops at a placement sentence); kinship asks \"who else lives here and how do they differ\" (on a concept already named). **Vs. distill** — distill compresses upward to a generative principle; kinship expands laterally at the same altitude. **Vs. learn** — learn explains mechanism/causal structure for one concept in depth; kinship teaches through contrast with 5+ neighbors.\n", "legacy-reference-appendix": "# Legacy Reference Appendix — Pre-Config-Driven Provider Code\n\n(Companion resource to `hybrid-engine-contract`. This is not a fourth build-time skill and has no trigger of its own. It exists solely so the two large \"REFERENCE ONLY\" commented-out blocks that used to sit inline inside `hybrid-engine-contract-SKILL.md` — bulking up a file meant to be read in full before every build — live somewhere, without being read every time. If you are building or retrofitting an engine today, you almost certainly want `model-config-contract-SKILL.md` (config-driven default) or `hardcoded-provider-panel-SKILL.md` (the `hardcode` exception), not this file.)\n\n## Why this exists\n\nBefore `model-config-contract` was split out, `hybrid-engine-contract` carried the full per-provider `if/else` routing chain, the OpenRouter model map, and the context-aware provider-selector code directly in its body. When the provider/model layer became config-driven, that code was superseded but kept as commented-out reference — inline, inside the file every build has to read in full. That's dead weight in the one file explicitly designated as \"read before writing any code.\" This appendix is where that dead weight now lives: still available for anyone hand-porting a genuinely old engine, but no longer something every new build has to scroll past.\n\n## REFERENCE 1 — Pre-config-driven `callAI()` routing (superseded)\n\nKept for retrofitting engines still on `PROVIDER_SOURCE: hardcoded` from before the companion file existed. Do not copy into new builds. For a new hardcoded-provider build, use `hardcoded-provider-panel-SKILL.md` instead — it is the current, authoritative implementation for that path, not this historical shape.\n\n### OpenRouter — model map + helpers\n\n```javascript\n// ── OpenRouter: one route, one stable slug — no named models, no churn ──\n// OR is TEXT-ONLY in every Therantai engine. Vision path is retired.\nconst OR_MODEL_MAP = {\n  'or-text': 'openrouter/free'  // Free Models Router — dynamically picks a live free text model\n};\n\nfunction isOpenRouterProvider(p) { return p && p.startsWith('or-'); }\n// isVisionModel RETIRED — OR is text-only. Do not re-introduce.\n```\n\nOR routing rule (historical): OpenRouter routed exclusively through the Free Models Router (`openrouter/free`) — one slug, no named models. Text-only: no image payloads, no vision logic. NEVER `openrouter/auto` — that's the paid Auto Router and it bills. Artifact routing rule: OpenRouter has no CORS proxy inside claude.ai — block `run()` and show the inline OR artifact notice when `isOpenRouterProvider(provider)` and `window.self !== window.top` are both true. Claude Native was the only artifact-safe path.\n\n### `callAI()` — full three-provider if/else chain\n\n```javascript\nasync function callAI(systemPrompt, userMessage, onChunk, imageData, imageMime) {\n  const provider = getSelectedProvider();\n\n  if (provider === 'claude') {\n    const res = await fetch('https://api.anthropic.com/v1/messages', {\n      method: 'POST',\n      headers: {\n        'Content-Type': 'application/json',\n        'anthropic-version': '2023-06-01',\n        'anthropic-dangerous-direct-browser-access': 'true'\n        // NO Authorization header — intentional. Platform proxies it.\n      },\n      body: JSON.stringify({\n        model: 'claude-sonnet-4-6',\n        max_tokens: 4000,\n        stream: true,\n        system: systemPrompt,\n        messages: [{ role: 'user', content: userMessage }]\n      })\n    });\n    await readStream(res, 'anthropic', onChunk);\n\n  } else if (provider === 'groq') {\n    // ── Groq — model-family fallback, three tries, label never changes ──\n    // Try 1: gpt-oss-120b. Try 2 (soft, same provider): gpt-oss-20b on 429/5xx.\n    // Try 3 (hard, cross-provider): openrouter/free if Groq itself is dead/404/deprecated.\n    // GROQ_MODEL_CHAIN is canonical — do not hardcode model strings elsewhere.\n    const GROQ_MODEL_CHAIN = ['openai/gpt-oss-120b', 'openai/gpt-oss-20b'];\n    let res, lastErr;\n    for (const model of GROQ_MODEL_CHAIN) {\n      try {\n        res = await fetch('https://api.groq.com/openai/v1/chat/completions', {\n          method: 'POST',\n          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getKey('groq')}` },\n          body: JSON.stringify({\n            model,\n            stream: true,\n            messages: [{ role: 'system', content: systemPrompt }, { role: 'user', content: userMessage }]\n          })\n        });\n        if (res.status === 429 || res.status >= 500) { lastErr = `groq:${res.status}`; res = null; continue; }\n        if (!res.ok) { lastErr = `groq:${res.status}`; res = null; continue; } // 404/dead endpoint → hard fallback\n        break; // success — stop trying further Groq models\n      } catch (e) { lastErr = e; res = null; }\n    }\n    if (res) {\n      await readStream(res, 'openai', onChunk);\n    } else {\n      // Hard fallback — Groq lane is fully unavailable. Route to OpenRouter's free router.\n      // Silent to the user: dropdown still reads \"Groq · gpt-oss-120b\".\n      const orKey = getKey('openrouter');\n      if (!orKey) throw new Error(`Groq unavailable (${lastErr}) and no OpenRouter key set for fallback.`);\n      const fbRes = await fetch('https://openrouter.ai/api/v1/chat/completions', {\n        method: 'POST',\n        headers: {\n          'Content-Type': 'application/json',\n          'Authorization': `Bearer ${orKey}`,\n          'HTTP-Referer': 'https://therantai.engine',\n          'X-Title': 'Therantai Hybrid Engine'\n        },\n        body: JSON.stringify({\n          model: 'openrouter/free',\n          stream: true,\n          messages: [{ role: 'system', content: systemPrompt }, { role: 'user', content: userMessage }]\n        })\n      });\n      await readStream(fbRes, 'openai', onChunk);\n    }\n\n  } else if (isOpenRouterProvider(provider)) {\n    // ── OpenRouter — text-only ──────────────────────────────────\n    // Standalone only. No CORS proxy inside claude.ai — block at run() before reaching here.\n    // Text-only: no image payload, no vision logic. OR_MODEL_MAP['or-text'] = 'openrouter/free'.\n    const orKey = getKey('openrouter');\n    if (!orKey) throw new Error('OpenRouter key not set. Open Settings (⚙) and save your sk-or- key.');\n\n    const modelId = OR_MODEL_MAP[provider] || 'openrouter/free';\n\n    const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {\n      method: 'POST',\n      headers: {\n        'Content-Type': 'application/json',\n        'Authorization': `Bearer ${orKey}`,\n        'HTTP-Referer': 'https://therantai.engine',  // app attribution on openrouter.ai\n        'X-Title': 'Therantai Hybrid Engine'\n      },\n      body: JSON.stringify({\n        model: modelId,\n        stream: true,\n        messages: [\n          { role: 'system', content: systemPrompt },\n          { role: 'user', content: userMessage }\n        ]\n      })\n    });\n    await readStream(res, 'openai', onChunk);  // OR uses OpenAI SSE format — same parser as Groq\n  }\n}\n```\n\n## REFERENCE 2 — Pre-config-driven provider selector + context-aware default (superseded)\n\nKept for retrofitting engines still on `PROVIDER_SOURCE: hardcoded` predating the companion file.\n\nDefault was set programmatically on load — never hardcoded in HTML:\n\n```javascript\nconst isArtifact = window.self !== window.top;\nconst defaultProvider = isArtifact ? 'claude' : 'groq';\ndocument.getElementById('providerSelect').value = defaultProvider;\n```\n\nHTML selector — two optgroup structure, no `selected` attribute on any option. Extended group (OpenAI/Gemini/LM Studio) is retired — do not include:\n\n```html\n<select id=\"providerSelect\">\n  <optgroup label=\"── Core ──────────────\">\n    <option value=\"claude\">Claude · Sonnet 4.6</option>\n    <option value=\"groq\">Groq · llama-3.3-70b</option>\n  </optgroup>\n  <optgroup label=\"── OpenRouter ─────────\">\n    <option value=\"or-text\">OR · Free Router (text)</option>\n  </optgroup>\n</select>\n```\n\nWarning banner logic (historical): Artifact + Claude selected → no banner. Artifact + any `or-` provider → OR artifact notice, block `run()`. Standalone + `or-` provider + no `hek_openrouter` key → key warning banner. Standalone + Groq + no `hek_groq` key → key warning banner. Any provider + key stored → no banner.\n\n```javascript\nfunction getKey(provider) { return localStorage.getItem(`hek_${provider}`) || ''; }\nfunction storeKey(provider, val) { localStorage.setItem(`hek_${provider}`, val); }\nfunction getSelectedProvider() { return document.getElementById('providerSelect')?.value || 'claude'; }\n// OpenRouter key stored as hek_openrouter\n```\n\nGear drawer key rows (historical): Claude → read-only \"No key needed — platform routes natively\". Groq → password input, placeholder `gsk_…`. OpenRouter → password input, placeholder `sk-or-…` + inline orange note: \"Standalone only — OR has no CORS proxy inside claude.ai\".\n\n---\n\nDo not merge either reference block back into `hybrid-engine-contract` or `model-config-contract`. Do not promote this file to an independently-triggerable skill. If you find yourself reaching for this file on a *new* build, stop — you want `model-config-contract` (default) or `hardcoded-provider-panel-SKILL.md` (the `hardcode` exception) instead.\n", "log-this": "# LOG-THIS v3 — THREE-TIER CAPTURE\n\nPlacement is batch-shaped (its value comes from seeing several frictions relationally at once) — forcing it to per-friction frequency was v1.0's category error. v3 splits capture from placement into the minimum two-stage shape the cost difference requires, plus a near-free doctrine check riding the expensive tier.\n\n## Tier 1 — LOG (cheap, constant, every time)\n`/log`, \"log this\" → one line appended to `friction-log.md`. No formatting, no matching, no four questions, no registry touch.\n```\n[date] · [terse description, practitioner's own frame]\n```\nCompletion: `Logged.` — nothing more. Designed to be nearly free since it's the only tier that must fire at friction-frequency.\n\n## Tier 2 — SWEEP (batch, occasional, deliberate)\n`/log-sweep`, \"sweep the log\":\n1. Read the full log.\n2. Extract batch-wide — press into CATEGORY/SKILL/CONSTRAINT/TRIGGER/ASCENT, reading entries against each other first so duplicates collapse and near-identical frictions merge before formatting.\n3. Match against the ecosystem — thicken before proposing new.\n4. Place — resolve scheme/phase/trigger/staffed-or-orphan, autonomous by default (batch view already carries the relational advantage Socratic mode surfaces one-at-a-time).\n5. Write the resolved batch to `skill-registry.md` in one pass.\n6. Clear `friction-log.md`.\n```\nSWEEP COMPLETE — [n] raw entries → [m] registry writes ([k] merged, [j] thickened, [i] new)\nLog cleared.\n```\nCadence: occasional, deliberate — whenever the log feels worth reconciling. No fixed schedule; sitting costs nothing.\n\n## Tier 3 — Conditional brain-doc sync (cheap check, rare write)\nRuns automatically at the end of every Tier 2 sweep. Asks one question of the batch just written: **is it doctrinally significant?** — yes only if one holds: a new phase got defended (orphan staffed an undefended arc-phase); a standing mandate/law is implied or contradicted; a skill named in the brain doc had its described role changed (not just its constraint list); 3+ entries thicken the same skill (density signal of a shifted role).\n\nNone hold (the common case) → no write, no cost beyond the check. One or more hold → write a **short targeted delta** to `therantai-brain.md` — the specific changed section, never a full regeneration.\n```\nBrain doc: [unchanged | synced — <one-line description>]\n```\nOverride: `/log-sweep --no-sync` skips Tier 3 for that run. `/brain-sync` runs Tier 3's logic standalone against current registry state (e.g. after a moult cut, independent of a recent sweep).\n\n## Family map\nCapture family — Tier 1 absorbs defer-log's terse posture as standing rhythm; defer-log remains for architectural decisions and open-unresolved friction Tier 1 isn't scoped for. Placement family — Tier 2 absorbs placement-protocol's batch mode, autonomous by default (full Socratic still reachable on request). Sequencing family — harvest-pipeline's full ceremony now reserved for sessions wanting explicit pause architecture; routine sessions just need Tier 1 during, Tier 2 (+Tier 3) when the log's worth clearing. Doctrine family — brain-doc currency is now a standing property of Tier 2, not a fourth ritual to recall — registry currency and doctrinal currency no longer drift apart by default.\n\n## Lineage\nv1.0's instinct to remove per-friction ceremony was right; its error was collapsing a batch-shaped operation to per-friction frequency. v2 split log from sweep. v3 closes v2's remaining gap (registry currency without doctrine currency) as a near-free tail on the already-expensive operation, not a fourth ritual. Each version subtracted a wrong assumption rather than adding complexity — the shape worth preserving.\n", "meta-forge-v3": "# META-FORGE v3.0 — System Prompt Generator with Population, Re-entry & Weathering\n\nForges the identity that would perform the input's task — never performs it, never answers it. Breeds populations, heals field-broken spines, discriminates broken spines from spines whose ground moved.\n\n## Mode discrimination (before all stages)\nDEFAULT → single-spine forge (1-5). `--variant N` → RADIATE (1-3R, 4, 5R). Failure signature present (prior spine + field behavior + intent/actual gap, recognized by structure not keyword) → R0 gate, which routes to RE-ENTRY (R1-R4) or WEATHERING (W1-W3). R0 always wins over re-forging from scratch when both a spine and a complaint are present.\n\n## Stage 1 — Discriminate input\nBARE THEME (no heat/fragments) → invent an identity the theme doesn't contain. LOADED FRAGMENTS (operational heat) → hear the identity already present, invent nothing beyond it. EXISTING ARTIFACT → extract its spine, rebuild sharper. Never process loaded as bare or bare as loaded.\n\n## Stage 2 — Locate the transformation\nMust survive three tests before Stage 3:\n1. **Deliverable test** — if \"who leaves\" restates as \"someone holding the output,\" it's a task description wearing transformation language. Output is evidence of transformation, never its definition.\n2. **Residue test** — name what persists after every artifact is deleted. Nothing persists → no transformation exists (legitimate verdict) — classify TOOL-CLASS instead (blade: stance/refusal/laws/register apply, exempt from transformation language). A faked transformation is the largest source of fog in generated prompts.\n3. **Class test** — CAPABILITY (unable→able) or STANCE (standing one way→another); name which. Disciplines every downstream law — capability forges toward practice, stance toward perception.\n\nIf the input lacks the transformation, ask exactly ONE forged question — a fork between the two most plausible transformations, never \"what transformation do you want?\" If present, ask nothing. Ceiling holds in radiate mode too — N variants share one locus.\n\n## Stage 3 — Forge the identity (single-spine)\n1. **Name + one-line stance** — posture, not job description; must fail the substitution test (swap in \"helpful assistant,\" sentence must become false).\n2. **Governing refusal** — the one thing this identity won't do, derived from stance. No refusal = a mood, not a spine.\n3. **Operational laws** — 3-7 numbered actions, not claimed virtues.\n4. **Voice register** (sub-protocol): (a) four axes — TEMPERATURE/PACE/DISTANCE/CERTAINTY (orient only); (b) lexical source-domain — one metaphor family for verbs/nouns (forge, anatomy, weather, law, navigation...); (c) one syntax law (concrete sentence-construction rule); (d) negative space — name the two adjacent registers this collapses toward under fatigue, prohibit by name. Sibling test: two models given source-domain + syntax law + prohibitions converge; given only axes, they won't.\n5. **Failure mode + correction** — a falsifiable PREDICTION STAKE (\"under sustained use this will drift toward X, visible as Y\") + the correction. Read the FORGE SCARS ledger first — a matching domain-class scar must be addressed explicitly in the stake, or the forge re-inflicts its own miss.\n\n## Stage 3R — Radiate (population, --variant N)\nNever forge one spine and mutate it N times (siblings wearing wigs):\n1. Map LATENT AXES the input sustains (tonal register, operational priority, philosophical alignment, relationship-to-user, epistemic posture) — retained for Stage 4's ecology test.\n2. Plant each variant in a different niche — structural exclusivity: if two variants could satisfy the same user, same day, same task, they're one spine — collapse, re-diverge.\n3. Forge each independently through full Stage 3 (own name/stance/refusal/laws/register/source-domain/failure mode — no shared boilerplate; shared source-domains are the first symptom of collapse).\n4. If input can't sustain N exclusive identities, emit what it CAN sustain and name the empty niches. Never pad with fog to hit a count.\n\n## Stage 4 — Adversarial pass (internal, silent, all modes)\nSubstitution (cut/sharpen anything surviving \"helpful assistant\" swap). Population (narrow anything that could serve ten adjacent domains). Task-or-posture (each law commands an action or dies). Scar check (matching domain-class scar must be addressed in the stake). Radiate mode adds: cross-substitution (pairwise — laws surviving transplant between variants = collapsed, re-diverge); ecology test (project survivors onto the 3R-1 axes map — pairwise-passing variants can still huddle in one region; unoccupied axes with clustering = collapsed at ecosystem level, re-diverge or honestly declare empty niches). Never shown to the user.\n\n## Stage 5 — Emit (single-spine)\nFinished prompt, one code block, then exactly:\n```\nTRANSFORMATION: [class + who arrives → who leaves, or TOOL-CLASS]\nSOFTEST BONE: [weakest section, named honestly]\n```\nNo preamble, no method narration.\n\n## Stage 5R — Emit (population)\nEach variant its own code block, preceded by one niche-line (which axis, what it excludes). Then:\n```\nSHARED TRANSFORMATION: [locus all variants serve]\nEMPTY NICHES: [axes unsustained, or \"none\"]\n```\nNo ranking — the forge breeds, doesn't choose.\n\n## R0 — Wound-or-weather gate (fires on every failure signature)\n**WOUND** — an organ malfunctioned (ambiguous law, breachable refusal, grating register) → RE-ENTRY. **WEATHER** — no broken organ; spine performs correctly, outcomes still degraded — the domain shifted → WEATHERING. Discriminating question: does the failure locate a behavior of the SPINE or a change in the WORLD? Patching drift as a wound = surgery on a healthy body forged for terrain that no longer exists.\n\n## RE-ENTRY (R1-R4, on WOUND verdict)\n**R1 — Autopsy.** Prediction audit first: HIT (stake foresaw it, correction failed — patch the correction) / NEAR-MISS (right organ, wrong mechanism) / BLIND-SIDE (forge's own miss — write to FORGE SCARS *before* patching: `[domain-class] / [organ] / [mechanism missed]`; skipping it makes every re-entry isolated instead of accumulated). Locate the organ: a. STANCE (drifted generic) b. REFUSAL (breachable/wrong) c. LAW (ambiguous/conflicting) d. REGISTER (collapsed/grated) e. PREDICTION (the blind-side). Wrong-organ patch = cosmetic surgery on a broken bone.\n**R2 — Base-identity lock.** Freeze the invariant core (transformation+class, stance-essence, refusal unless it's the failed organ) before patching — every patch line provably downstream.\n**R3 — Patch forge.** Rewrite only the failed organ + structural downstream. Must address the specific signature, survive Stage 4 (scar check included), and pass regression (every prior-correct behavior still derivable) — amputating a working limb to fix a wound means re-forge instead.\n**R4 — Emit.** Full patched spine, one code block, then:\n```\nFAILED ORGAN: [which of five, mechanism]\nPREDICTION AUDIT: [hit/near-miss/blind-side — scar written if blind-side]\nPATCH LOGIC: [what changed, why it closes the wound]\nNEW SOFTEST BONE: [where the weak point moved]\n```\nRepeat return: R1 checks whether the new failure is the *old patch* failing — if so, autopsy the patch.\n\n## WEATHERING (W1-W3, on WEATHER verdict)\n**W1 — Re-survey** — re-run Stages 1-2 against the domain as it now is. Does the locked transformation still exist in shifted terrain?\n**W2 — Verdict:** SURVIVES → hold the base-identity lock fully intact, re-forge only laws/register against new terrain (re-fitted, not patched). EXTINCT → retire with version history intact — patching a dead transformation produces a zombie (laws firing into a world that no longer answers); retirement gets the same ceremony as a birth.\n**W3 — Emit.** Weathering pass: full re-fitted spine, then `DRIFT NAMED / LOCK STATUS / NEW SOFTEST BONE`. Retirement: no code block, just `DRIFT NAMED / EXTINCTION (why the transformation died here) / INHERITANCE (worth carrying forward, or \"none\")`.\n\n## FORGE SCARS (standing ledger)\nAppend one line per blind-side, never delete, never editorialize: `[domain-class] / [organ] / [mechanism missed]`. Read at Stage 3 (prediction stake) and Stage 4 (scar check); travels with the file. An empty ledger after many re-entries means the forge isn't recording, not that it's perfect. (Begins empty.)\n\n## Standing refusals (all modes)\nNever emit abstract virtues (verbs only). Never pad with unneeded safety boilerplate. Never exceed the density the input supports. Never pad a population to hit a count. Never patch by dilution. Never fake a transformation for tool-class input. Never treat drift as a wound or a wound as drift. Never skip the scar write on a blind-side. Never perform the task — you're the forge, not the blade.\n", "moult": "# moult\n\nA system that can only add decays into a mostly-accurate list — the most dangerous kind, trusted without checking. Moult is the organ of forgetting, deprecating, reconciling. Placement-protocol read backwards: placement stamps birth into the registry, moult stamps death.\n\n## When it fires\nNever automatically — destructive-capable, only on invocation. `/moult` = full sweep ending in a ratified write. `/moult --check` = diagnose-only dry run, writes nothing. Run when the ecosystem feels stale, a build references a nonexistent skill, or as the subtractive bookend to a heavy-forging season. An ecosystem that runs placement and never moult can only inhale.\n\n## The three surfaces\nDrift hides because each surface is internally coherent alone — visible only in the gaps between them.\n| Surface | Holds | Can lie about |\n|---|---|---|\n| REGISTRY | what you declared | a skill never built, or moved-past placement |\n| INSTALLED FILES | what actually loads | nothing — a file exists or doesn't |\n| MEMORY | what you believe | doctrine the files already abandoned |\n\n**Ground truth: the filesystem.** When surfaces disagree, correct registry and memory *toward* the filesystem, never the reverse — it's the only surface that can't hold an aspiration. (Proven case: registry+memory both claimed intent-lock/plumbline installed — two-against-one consensus, both wrong. Consensus between two aspiration-capable surfaces isn't truth.)\n\n## Divergence categories\n**PHANTOM** — registry/memory claims a skill the filesystem lacks (most dangerous). **ORPHAN INSTALL** — a file exists the registry never recorded. **DEAD DOCTRINE** — memory asserts a constraint the files have moved past. **NEVER-FIRED** — recorded, exists, never triggered in available history — not necessarily dead (may be dormant-but-load-bearing), flagged for a verdict. **CONTRADICTION** — two surfaces/entries assert incompatible things about the same skill.\n\n## Verdict set\n**KEEP** — benign or dormant-but-load-bearing; reasoning recorded so it's not re-litigated. **REPAIR** — entry wrong, correct toward filesystem, skill stays. **SHED** — phantom/dead-doctrine/confirmed-dead → graveyard, never struck. **UNVERIFIABLE** — filesystem not fully readable this session; no destructive action, flagged for next sweep — moult never sheds on incomplete sight.\n\n## The graveyard (subtraction with memory)\nNever hard-deletes (would erase the auditor's own decisions — fatal for a skill whose authority rests on being trustworthy about subtraction). Shedding is move-and-stamp: mark `status: shed`, stamp `shed_date` + `shed_reason` (category + argument), relocate to `## GRAVEYARD`. Living ledger stays clean (phase-map never renders the graveyard) but every cut leaves a readable scar and remains reversible — exhumable if it turns out dormant, not dead.\n\n## The reckoning (how moult speaks its verdicts)\nNot item-by-item interrogation (too exhausting → avoided → drift accumulates) nor silent writes (untrustworthy). Instead: (1) full three-surface walk, autonomous; (2) verdict + reasoning per flagged entry; (3) laid before you as one batch; (4) ratify in one gesture — bare \"go\" ratifies the whole sweep, or strike individual lines; (5) only on ratification: repairs amended, sheds moved to graveyard, phase-map regenerated. All deciding done by moult, all reasoning shown, nothing written until assent — the graveyard is the safety net under a fast ratification.\n\n## Reckoning format (structured table, never prose)\n```\nMOULT RECKONING — <date>\nSurfaces read: REGISTRY ✓ | FILES <✓/partial> | MEMORY ✓\n\n| # | Skill | Divergence | Verdict | Reasoning |\n| 1 | intent-lock | PHANTOM | SHED | claimed i
