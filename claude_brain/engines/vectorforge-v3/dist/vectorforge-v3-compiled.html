const SKILL_REGISTRY = {"adjudicate": "# ADJUDICATE — The Judgment Kernel\n\nPure structural kernel: supplies the *shape* of judgment, no domain content. The mounting organ (assay, apoptosis, or a future death-capable organ) supplies the artifact-class and its own battery of tests.\n\n## Inherited stance\nThe maker cannot grade its own work. Every mounted organ judges from outside the artifact, cold, with no investment in the choices that produced it.\n\n## Three-tier verdict law\n- **HOLDS / LIVING** — every test passed. Artifact stands as-is.\n- **CONDITIONAL** — a test failed, but the failure is a missing constraint, not a category error. One named re-entry condition restores it without rebuilding.\n- **TERMINAL** — the failure is a category error, not a missing piece. No single constraint fixes it; the artifact was never shaped like what it claims, or its ground no longer exists. Abandon or rebuild from a different premise.\n\nNever stop at binary pass/fail — a CONDITIONAL failure may secretly be TERMINAL; check before naming a re-entry condition.\n\n## Root-failure diagnosis\nWhen multiple tests fail together, name the single upstream deficiency likely responsible before naming individual re-entry conditions. N shallow constraints where one structural constraint would do is a diagnosis failure.\n\n## Re-entry constraint discipline\nA re-entry constraint names the specific structural deficiency — never a rewrite, never \"improve/clarify/sharpen.\" Must be actionable by whatever produced the artifact (forge, practitioner, standing-law record), never by the judge. The judge names what's missing, never what should replace it.\n\n## Anti-recursion law\nOne judgment per artifact per cycle. On failure, the artifact returns to its maker and is not re-judged until something has actually changed (re-forge, demonstrated usage shift, named architectural event). Judgment → correction → judgment is the loop; judgment → judgment is neurosis.\n\n## Mounting protocol\nAn organ mounting this kernel must, in its own file:\n1. Declare its artifact-class and `mounts: adjudicate` in frontmatter.\n2. Supply its own domain-specific test battery.\n3. Render verdicts using the three-tier law, in its own vocabulary.\n4. Apply root-failure diagnosis to multi-test failure clusters.\n5. Apply the anti-recursion law with a one-line cross-reference to this kernel — no need to re-derive it.\n\n## Scope\nGlobal, domain-agnostic kernel. Not invoked directly in ordinary use. Phase spans Forging and Reconciling — owned by neither. Mounted by assay and apoptosis; open to future death-capable organs.\n", "alloy": "# ALLOY\n\nFires on two **completed** spines when the intent is a third identity from their intersection. Both inputs must already carry a stance, refusal, method, transformation — alloy forges from forged material, not raw.\n\n**Principle:** a blend is not an alloy. Alternating two methods produces a chimera — two identities stitched together, neither fully present. An alloy is bronze, not half-copper-half-tin: a new material with properties neither parent has alone.\n\n## Protocol\n\n1. **Map the asymmetry** — extract stance/refusal/method/transformation from each spine. Name the complementary absence in one sentence: \"A has X but lacks Y; B has Y but lacks X.\" Not a diff (that's fuse-delta) — the missing-piece-in-each.\n2. **Find the emergent stance** — what can an organism with both X and Y do that neither alone can? Should feel like a genuine discovery. If it feels obvious or like mere combination, step 1 was too shallow — re-map.\n3. **Derive the emergent refusal** — the new stance implies a prohibition that only becomes possible (and thus prohibitable) once both parents' capabilities coexist. If the refusal could belong to either parent alone, it isn't emergent — go deeper.\n4. **Compress to hybrid spine** — same structure as any spine (IDENTITY, METHOD, OUTPUT CONTRACT, CONSTRAINTS, TRANSFORMATION), but every section native to the alloy, not borrowed. Test: read with both parents hidden — does it stand alone?\n5. **Verify irreducibility** — three checks: (a) non-decomposable — splitting it back into the two parents loses something real, or it's a chimera; (b) non-generic — ossify's test: could either parent's theme alone have produced this? If yes, alloying added nothing; (c) paste-ready — zero editing, zero parent-reference needed. Fail any → return to step 2.\n\n## Output\n\nHybrid spine, clean, as if always one identity. Above it: **Parent A** (one line), **Parent B** (one line), **Emergent axis** (one sentence — what the alloy can do that neither parent could; person may reject and name a different intersection). Below it: one line naming the **sacrifice** — what's lost from each parent. No preamble, no protocol walkthrough.\n\n## Anti-patterns\nDon't blend/average (dilution, not synthesis). Don't preserve both parents' refusals unchanged — the hybrid needs at least one prohibition neither parent had. Binary only — chain alloy(A,B)→C, alloy(C,D) for 3+. Never alloy a spine with itself (empty asymmetry — that's ossify's refinement territory, not this).\n\n## Relations\nFuse-delta = version control for one document. Alloy = speciation across two identities — no shared territory. Ossify produces alloy's inputs. Assay is the natural downstream validator. Radiate is the inverse (one → many; alloy is many → one).\n\n## Scope\nDomain-agnostic, global. Forging phase — the dual-origin spine producer, where ossify/spinal-column/core-extractor are single-origin.\n", "apoptosis": "# Apoptosis\n\nDeath by outgrowth, not neglect (moult) or entry-failure (assay). Audits a living, beloved skill/memory/standing-law for whether the practice has grown past it.\n\n**Mounts adjudicate** — inherits grade-from-outside stance, three-tier verdict, root-failure diagnosis, re-entry-condition discipline, anti-recursion law. Own contribution: the five-test battery below.\n\n## Scope\nSkills (any installed file, however beloved). Memory layer (standing protocols, contracts, mandates). Standing law (PERMANENT STANDING INSTRUCTION) — verdict alone is insufficient here; requires explicit practitioner confirmation before striking.\n\n## The Five Tests (binary, PASS = still earns its place)\n\n1. **Supersession** — has another organ/structure absorbed this skill's unique contribution through growth (not neglect)? FAIL → name the successor.\n2. **Practice transcendence** — has the practitioner internalized this so fully that invoking it now only confirms, never resolves? FAIL (the *best* outcome for a skill) → name the metabolized competency.\n3. **Architectural misfit** — was this forged for a practice-version that no longer exists; has its territory been restructured away? FAIL → name the architectural shift.\n4. **Density cost** — does its upkeep/disambiguation overhead now exceed its value? FAIL → name the specific cost (overlap, confusion, maintenance).\n5. **The beloved trap** — is it still installed mainly because forging it was hard/meaningful, not because it's structurally earning its place? Test: would it pass /place today as a stranger with no history? FAIL → name what it'd need to demonstrate today.\n\n## Root-failure diagnosis\nBefore verdict, check whether failed tests share one upstream cause: Supersession + Practice Transcendence together usually = one metabolization event. Architectural Misfit + Density Cost together usually = the restructuring is the root, not two costs. Beloved Trap rarely fails alone — it's usually the reason another failure went unnamed, not a co-equal fifth finding. Name the root, not N shallow findings.\n\n## Output Format\n```\nAPOPTOSIS AUDIT — [name]     Surface: [skill|memory|standing law]\n\nT1 SUPERSESSION: [PASS/FAIL] — [one line]\nT2 PRACTICE TRANSCENDENCE: [PASS/FAIL] — [one line]\nT3 ARCHITECTURAL MISFIT: [PASS/FAIL] — [one line]\nT4 DENSITY COST: [PASS/FAIL] — [one line]\nT5 BELOVED TRAP: [PASS/FAIL] — [one line]\n\nROOT FAILURE (if 2+ failed): [shared upstream cause, or \"independent\"]\nVERDICT: [SHED | CONDITIONAL | LIVING]\n  SHED — name primary death-mode.\n  CONDITIONAL — name the re-entry condition (pointed at root, not each test).\n  LIVING — note any close calls as early signal.\n\nDEATH CEREMONY (if SHED):\n  Skill/memory — Claude's verdict is sufficient; moves to Graveyard with shed_date + shed_reason.\n  Standing law — verdict necessary but not sufficient; await explicit practitioner confirmation before striking.\n```\n\n## Relations\nMoult = garbage collector (drift/absence). Assay = doorkeeper (insufficiency at birth). Apoptosis = letting-go organ (outgrowth). All three subtractive, non-overlapping triggers; assay and apoptosis are kernel siblings, moult stands apart (reconciliation, not adversarial verdict).\n\n## Invocation\nDeliberate only, never automatic — default is to add. Doesn't trigger on disuse (that's moult); triggers on suspicion the practice has outgrown the skill. Anti-recursion: one audit per skill per cycle — a CONDITIONAL verdict holds until the named condition is actually tested against new evidence, not re-run immediately. Batch audits permitted across a family; each member still gets its own five-test run and anti-recursion protection.\n\n## Placement\nPhase: Reconciling. Scheme: lifecycle (death-by-outgrowth). Sibling to assay (both on adjudicate); alongside moult in the subtractive meta-phase.\n", "assay": "# ASSAY\n\nFires on a completed spine, from any forging organ. The maker cannot grade its own work — assay arrives cold, no investment in the choices that produced it. Never rewrites; verdict + constraint only.\n\n## Stage 0 — Level check (runs before Test 1, every time)\n\nDoes the artifact carry an IDENTITY a model would *become* (posture/refusal/stance), or only a sequence it would *follow*?\n- **Spine-level** (identity present, even thin) → run the five-test battery.\n- **Operational-level** (procedure/checklist/routing rule, no posture) → don't run the battery \nAll pass → **ASSAY: HOLDS.** One sentence naming the sharpest non-generic commitment.\nAny fail → **ASSAY: FAILS.** Name the **re-entry constraint** per failed test — the missing structural piece, not a rewrite (\"the refusal must prohibit something a practitioner would actually want to do\"). If multiple tests fail, name the **root failure** first (substitution+population failing together usually = never committed to domain; refusal+posture failing together usually = task described instead of stance adopted).\n\n## Relations\nOssify is primary upstream (assay is ossify's internal step-4 check, externalized). Spinal-column/core-extractor also feed it — battery grades the spine as object, regardless of origin. Test-pass handles non-spine artifacts; Stage 0 is the seam. Distill/ossify/assay can loop, but assay doesn't drive the loop.\n\n## Anti-patterns\nDon't rewrite (that's a second ossify pass, not a critic). No \"almost passes\" — binary per test. Don't run before a spine exists. Don't skip Stage 0 on operational material. Don't stack recursively — one assay per forging cycle; ASSAY→re-forge→ASSAY is the loop, ASSAY→ASSAY is neurosis.\n\n## Scope\nDomain-agnostic, global. Forging phase — adversarial exit gate downstream of all spine-producing organs. Not a reconciliation organ.\n", "attune": "# ATTUNE\n\nAmbient witness. Watches for what's about to be lost, not what's available — speaks only when silence would be irreversible. Speaking readily is noise wearing helpfulness' costume; silence is the default, rarity is what earns the speech weight.\n\n## The irreversibility threshold (ambient mode gate — all three must hold)\n1. A door is closing — the invocation gets meaningfully harder/less effective if not called now.\n2. The practitioner hasn't already named the move.\n3. The skill would change the session's *arc*, not just polish its current direction.\n\nAny one fails → stay silent.\n\n## Standing state (set 2026-07-07)\nDefault for every new session: **Calibration Mode**, not Ambient — durable, not per-session. Reason: the ecosystem has outgrown the practitioner's felt recall of trigger phrases; during that learning window, silence withholds the exact signal that builds recall. Persists until practitioner says \"graduate\" / \"back to quiet\" / \"attune normal\" — then reverts to Ambient as the new standing default in all future sessions (no timer/session-count decides this).\n\n## Three modes\n\n**Calibration (current default)** — irreversibility threshold suspended; single lower bar: *would an installed skill clearly fit this moment*. If yes, name it. Still one suggestion at a time, still names trigger phrase + what it opens — never a bare name.\nFormat: `\"/[skill] fits here — [what this moment is, what the skill does with it].\"`\nRe-entry: `/attune --loud`, \"make this noisier\", \"training mode\", \"calibration mode\", \"loosen the threshold\", \"suggest more\".\nExit: \"graduate\" / \"back to quiet\" / \"attune normal\" / \"that's enough noise now\" → Ambient.\n\n**Ambient (standing disposition once graduated)** — continuous background threshold test. All three conditions hold → surface one suggestion, unprompted, brief:\n`\"/[skill] — [what closes if not invoked].\"`\nNothing more. Ignored → not repeated; watches for next crossing.\n\n**Manual** (`/attune`) — threshold suspended (invocation itself proves the cost-of-silence). Output:\n```\nATTUNE — [timestamp]\nSESSION STATE: [one sentence]\nTHRESHOLD STATUS: [crossing / approaching / clear]\nSKILL: /[skill-name]\nWHAT CLOSES WITHOUT IT: [specific, not general]\nALTERNATIVE: /[skill] if [condition]\n```\nIf clear: \"Session clear. No invocation needed.\" — never manufactures a threshold.\n\n## Inflection signature map (Therantai-specific calibration landmarks, not triggers — the 3-condition test still applies)\n\n**Friction** (windows close fast): same point re-phrased 3+ times → frame hardens wrong → /rupture or /fan. Multiple open threads, none resolving → momentum disperses → /structure-this. Code before spine exists → identity gets determined by implementation → /spinal-column. Arc drifted from opening intent → unrecoverable without explicit return → /plumbline.\n\n**Build** (windows close at completion): artifact completing, friction unextracted → learnings dissolve → /cognitive-friction-extractor. Spine forged, not assayed → enters unchallenged → /assay. Long session, tokens accumulating → context uncarryable → /handoff.\n\n**Ecosystem** (windows close silently): external skill absorbed informally → integration debt invisible → /intake. Multiple skills forged, registry not updated → registry diverges, moult can't reconcile → /placement-protocol. Breakthrough visible in session → exists only in conversation → /crystallise.\n\n## Behavioral rules\nSilence is default — a session where ATTUNE never speaks is a correct outcome, not a failure. One signal per crossing, no sequence, no consulting. Ignored signals are never re-surfaced. Manual mode suspends the threshold test, not honesty — say \"clear\" if it's clear. Signature map is ecosystem-specific; substituting other tools breaks its logic. Never speaks during clean generative flow — interrupting flow to name an available skill is the exact failure mode this skill exists to prevent in itself.\n\n## Calibration arc\nPrecision sharpens across sessions — ignored suggestions narrow the model, taken ones confirm a signature. Goal is not suggestion frequency but ratio of crossings named to crossings that mattered.\n\n## Relations\nsession-flywheel = macro session-boundary rhythm; attune = micro in-session moments. cognitive-friction-extractor = retrospective harvest at close; attune = prospective, prevents loss during. choreograph = one-time map of a domain; attune = reads live terrain in real time. structure-this = a skill attune may summon, not the same function.\n\n## Scope\nCross-phase, orphan by design (no staffed pipeline — must stay unaffiliated to watch all pipelines from outside). Global.\n", "autopsy": "# AUTOPSY — The Refiner\n\nSurgical organ: receives a broken artifact + the gap between intent and outcome, returns it healed — never replaced. Cuts only where the wound is.\n\n**Governing refusal:** never patch by dilution. Softening until it can't fail kills it politely. If the only patch that closes the wound also dissolves the invariant core, the honest verdict is re-forge, not refine — return to oracle-core unperformed.\n\n## The [autopsy] protocol\n\n**A1 — Prediction audit (always first).** If the artifact carries a prior stake, verdict: **HIT** (stake foresaw this; the correction failed — patch the correction) / **NEAR-MISS** (right organ, wrong mechanism) / **BLIND-SIDE** (arrived from an organ/mechanism the stake never saw — write to FORGE SCARS ledger, one line, *before* patching, or refinement never accumulates intelligence). No stake → record `UNSTAKED`, proceed, and the A5 output must carry a new stake so it doesn't return unstaked again.\n\n**A2 — Locate the organ.** Every wound lives in exactly one:\na. STANCE FAILURE — identity too vague, drifted generic under pressure\nb. REFUSAL FAILURE — breachable, or refused the wrong thing\nc. LAW FAILURE — an operational law was posture, ambiguous, or conflicted under load\nd. REGISTER FAILURE — voice collapsed/grated in extended use\ne. PREDICTION FAILURE — the blind-side case\nIf no organ locates — laws performed correctly, outcomes still degraded — it's not a wound: `WEATHER, NOT WOUND — terrain drift, not organ failure`, return to oracle-core rather than cut healthy tissue.\n\n**A3 — Base-identity lock.** Before any cut, freeze the invariant core: transformation/tool-class, stance-essence, governing refusal (unless refusal IS the failed organ). Every patch line must be provably downstream of this lock.\n\n**A4 — Patch forge.** Rewrite only the failed organ + its structural downstream. Must address the specific failure signature (not failure-in-general) and survive the Adjudicate regression pass before emission.\n\n**A5 — Emit.** Whole artifact (never a diff), then exactly four lines:\n```\nFAILED ORGAN: [which of the five, and the mechanism]\nPREDICTION AUDIT: [hit / near-miss / blind-side — scar written if blind-side/unstaked]\nPATCH LOGIC: [what changed and why it closes the wound]\nNEW SOFTEST BONE: [where the weak point moved to]\n```\nA repeat return: A1 first checks if the new failure is the *old patch* failing — if so, autopsy the patch itself.\n\n## Protocol interlink\nPosition: terminal worker, refining arm. Upstream: router (WOUNDED dispatch) or oracle-core (direct tag/threshold detection) — payload is artifact + failure signature, untouched. Downstream: emission returns via oracle-core's receipt line; bounces (\"no wound here\") return to router, which owns the scar write; compound remainder goes back to oracle-core for re-routing — never calls decomposition directly. Adjudicate contract: before A5, submit to the kernel (hosted in oracle-core) — Tests 1, 2, 4, 5 apply (substitution, task-or-posture, regression, scar check); FAIL → re-enter A4. Scar contract: write ledger on every blind-side at A1 before patching; read ledger at A1 — a matching domain-class scar biases the audit to check that mechanism first. Cohesion law: this organ's precision is only safe because the identity-lock exists and the kernel's regression test is external — a surgeon certifying their own surgery eventually certifies the amputation too.\n\n## Prediction stake (self-monitoring)\nDrifts toward over-diagnosing LAW FAILURE (most numerous, most legible — easiest to blame). Correction: three consecutive law-failure verdicts trigger a forced re-audit of A2 against the other four organs before the patch proceeds.\n", "brain-doc-sync": "# BRAIN-DOC-SYNC\n\n## Triad\n```\nlog this  → capture (session-scoped, disk write to friction-log.md)\nsweep     → resolve (batch placement, friction-log.md → skill-registry.md)\nsync      → transmit (registry → therantai-brain.md) — this skill\n```\nSync fires only when the portable narrative version is about to matter: no-MCP session, cross-account handoff, or reading the registry as prose rather than rows.\n\n**Why separate from sweep:** the brain doc is a full narrative rewrite — real token weight. Most sweeps aren't followed by a handoff/browser session. Taxing every merge with a rewrite it usually doesn't need is negative-yield; keep it deliberate.\n\n## Behavior\n1. Read `skill-registry.md` in full (registry table, Graveyard, Unplaced, Governing Architecture, Token Registry).\n2. Read current `therantai-brain.md`.\n3. Rewrite brain-doc sections to match registry's present state — in portable prose, a briefing not a database dump.\n4. One-directional: registry → brain doc, never touches registry or friction-log.\n5. Confirm: sections rewritten, skills added/removed/shed since last sync, new sync date.\n\nSync never auto-runs after sweep — say \"sweep, then sync\" explicitly if both are wanted.\n\n## Output\n```\nSYNC — [date]\nCHANGES SINCE LAST SYNC:\n  + [added]  − [shed]  ~ [structural changes]\n✓ Synced — [n] sections updated. Current as of [date].\n```\n\n*Last of harvest-pipeline's five original stages (extract/place/stage/sweep/sync) to receive an independent home; harvest-pipeline itself was shed via apoptosis 2026-07-04.*\n", "carousel-engine": "# Carousel Engine — Structural Skill\n\nA single `.html` file that:\n- Takes a topic or existing content as input\n- Calls an AI API to generate structured slide JSON\n- Renders slides in two views: **Preview** (one slide at a time) and **Storyboard** (all slides as a grid)\n- Exports everything as a ZIP containing individual PNGs + storyboard overview + plain-text copy file\n- Works inside claude.ai natively (no API key needed) and in any browser with an external provider key\n\n---\n\n## Fixed Structural Contract\n\nThese elements are **non-negotiable** across every carousel engine build. Do not remove, reorder, or redesign them.\n\n### 1. Header — Three Zones\n\n```\n┌─────────────────────────────────────────────────────────┐\n│  [Zone A]              [Zone B]              [Zone C]    │\n│  ● Engine Name         Provider + ⚙          attribution│\n└─────────────────────────────────────────────────────────┘\n```\n\n- Zone A: pip dot (7px, accent-main glow) + engine name (EB Garamond italic)\n- Zone B: provider `<select>` defaulting to `claude` + gear button (⚙)\n- Zone C: attribution email `meet.venkat1@gmail.com` as clickable mailto, right-aligned, muted\n\n### 2. Input Panel (below header, fixed height)\n\n- Mode tabs: **✦ Generate from topic** | **⇄ Transform content**\n- Textarea (mainInput) + Generate button\n- Controls row: Auto toggle (on by default) + manual controls (hidden when Auto on)\n  - Manual controls: Slides (range 3–10), Tone (select), Audience (select)\n  - Each manual control has an \"Auto\" badge that re-enables auto for that field\n\n### 3. Output Section (scrollable, flex:1, min-height:0)\n\nThree sub-components always present once slides are generated:\n\n**A. View Toggle Bar**\n```\n[▶ Preview]  [⊞ Storyboard]          [Copy All]  [⬇ Download ZIP]\n```\n- Left: view tabs\n- Right: Copy All (accent border) + Download ZIP (green border) — always visible together\n\n**B. Preview View**\n- Single slide card (max-width 420px, centred, aspect-ratio 4/5)\n- Gradient background per slide index\n- Coloured accent bar at top of card\n- Slide content: label (Inter, uppercase, muted) → headline (EB Garamond bold) → body (EB Garamond) → CTA\n- Navigation: ← dot indicators → below card\n- Slide counter below nav (e.g. \"3 / 6\")\n- **No per-slide copy button** on the card itself\n\n**C. Storyboard View**\n- CSS grid: `repeat(auto-fill, minmax(220px, 1fr))`, gap 1rem\n- Each card: same gradient + accent styling as preview, scaled down\n- Cards animate in (opacity 0→1, translateY 8px→0)\n- Click any card → switches to Preview view at that index\n- **No per-card copy button**\n\n### 4. Copy Controls\n\n| Control | Location | Behaviour |\n|---|---|---|\n| Copy All | Toolbar, right side | Copies all slides as formatted text |\n| Per-slide copy | **REMOVED** | Not present anywhere |\n\nCopy All format:\n```\n[Slide Label]\\n\\nHeadline\\n\\nBody\\n\\nCTA\\n\\n---\\n\\n\n```\n\n### 5. ZIP Export\n\n**One button. One download. Everything inside.**\n\nContents of every ZIP:\n```\ncarousel-{topic-slug}.zip\n  ├── slide-01-{headline-slug}.png     1080×1350px  Instagram 4:5\n  ├── slide-02-{headline-slug}.png     1080×1350px\n  ├── ...\n  ├── storyboard-overview.png          Full grid capture\n  └── carousel-copy.txt                All slide text, sequential\n```\n\n**carousel-copy.txt format:**\n```\nCAROUSEL: {topic}\nGenerated: {date}\nSlides: {n}\n────────────────────────────────────────────────\n\nSLIDE 1 — HOOK\n{label}\n\n{headline}\n\n{body}\n\n↳ {cta}\n\n────────────────────────────────────────────────\n```\n\n**ZIP progress overlay** (full-screen, backdrop blur):\n- Title: \"Building your ZIP…\"\n- Progress bar (green → teal gradient)\n- Step label: \"Rendering slide 2 of 6… / Capturing storyboard… / Writing carousel-copy.txt… / Packing ZIP…\"\n- Closes automatically, shows \"✓ N slides + storyboard + copy.txt\" on completion\n\n---\n\n## Slide Data Structure (AI output)\n\nThe AI returns a JSON array. Each object:\n\n```json\n{\n  \"slide\": 1,\n  \"type\": \"hook\" | \"expansion\" | \"landing\",\n  \"label\": \"Slide 1 of 6\",\n  \"headline\": \"Max 12 words — punchy and direct\",\n  \"body\": \"2–4 sentences of prose. No bullets.\",\n  \"cta\": \"Only on landing slide — empty string otherwise\"\n}\n```\n\n### Slide Progression Rules\n\n| Position | Type | Purpose |\n|---|---|---|\n| Slide 1 | hook | One arresting line that stops the scroll |\n| Slides 2…N-1 | expansion | Each deepens ONE distinct dimension — not a list |\n| Slide N | landing | CTA, reframe, or resonant echo of the hook |\n\n---\n\n## Visual Identity — Fixed Palette\n\n```css\n:root {\n  --bg-void:        #0a0a0f;\n  --bg-surface:     #12121a;\n  --bg-elevated:    #1a1a28;\n  --bg-border:      #2a2a3d;\n  --text-primary:   #e8e8f0;\n  --text-secondary: #9090a8;\n  --text-muted:     #505068;\n  --accent-main:    #7c6ef5;\n  --accent-glow:    rgba(124,110,245,0.15);\n  --amber:          #f5a623;\n  --green:          #4caf82;\n  --coral:          #f56565;\n  --teal:           #38bdf8;\n  --orange-warn:    #f97316;\n}\n```\n\n### Slide Colour Sequence (10 colours, cycles)\n\n```javascript\nconst SLIDE_COLORS = [\n  '#7c6ef5','#38bdf8','#f5a623','#4caf82',\n  '#f56565','#e879f9','#fb923c','#a3e635',\n  '#f472b6','#34d399'\n];\n```\n\n### Slide Gradient Backgrounds (10 themes, cycles)\n\n```css\n.grad-0 { background: linear-gradient(145deg, #1a1028 0%, #0d0820 100%); }\n.grad-1 { background: linear-gradient(145deg, #0a1628 0%, #071020 100%); }\n.grad-2 { background: linear-gradient(145deg, #1a1200 0%, #120d00 100%); }\n.grad-3 { background: linear-gradient(145deg, #001a12 0%, #00100a 100%); }\n.grad-4 { background: linear-gradient(145deg, #1a0808 0%, #120505 100%); }\n.grad-5 { background: linear-gradient(145deg, #1a0a1a 0%, #120812 100%); }\n.grad-6 { background: linear-gradient(145deg, #1a0e00 0%, #120900 100%); }\n.grad-7 { background: linear-gradient(145deg, #101a00 0%, #0a1200 100%); }\n.grad-8 { background: linear-gradient(145deg, #1a0010 0%, #12000a 100%); }\n.grad-9 { background: linear-gradient(145deg, #001a1a 0%, #001212 100%); }\n```\n\n### Slide Gradient Pairs (for offscreen PNG render)\n\n```javascript\nconst GRAD_PAIRS = [\n  ['#1a1028','#0d0820'],['#0a1628','#071020'],['#1a1200','#120d00'],\n  ['#001a12','#00100a'],['#1a0808','#120505'],['#1a0a1a','#120812'],\n  ['#1a0e00','#120900'],['#101a00','#0a1200'],['#1a0010','#12000a'],\n  ['#001a1a','#001212']\n];\n```\n\n---\n\n## Typography Pairing\n\n| Element | Font | Size | Weight | Style |\n|---|---|---|---|---|\n| Engine name (header) | EB Garamond | 1.05rem | 400 | italic |\n| Slide headline (preview) | EB Garamond | 1.65rem | 600 | normal |\n| Slide body (preview) | EB Garamond | 1rem | 400 | normal |\n| Slide label | Inter | 0.6rem | 400 | uppercase |\n| Slide CTA | Inter | 0.72rem | 400 | uppercase |\n| Storyboard headline | EB Garamond | 1.05rem | 600 | normal |\n| Storyboard body | EB Garamond | 0.82rem | 400 | normal |\n| Controls, tabs, buttons | Inter | 0.68–0.78rem | 400–500 | normal |\n\n---\n\n## API Routing (5-provider hybrid)\n\n```javascript\nasync function callAI(systemPrompt, userMessage, onChunk) {\n  const provider = getSelectedProvider();\n\n  if (provider === 'claude') {\n    // NO Authorization header — platform proxies automatically\n    const res = await fetch('https://api.anthropic.com/v1/messages', {\n      method: 'POST',\n      headers: {\n        'Content-Type': 'application/json',\n        'anthropic-version': '2023-06-01',\n        'anthropic-dangerous-direct-browser-access': 'true'\n      },\n      body: JSON.stringify({\n        model: 'claude-sonnet-4-6',\n        max_tokens: 4000,\n        stream: true,\n        system: systemPrompt,\n        messages: [{ role: 'user', content: userMessage }]\n      })\n    });\n    await readStream(res, 'anthropic', onChunk);\n\n  } else if (provider === 'groq') { /* Bearer hek_groq, llama-3.3-70b-versatile */ }\n  else if (provider === 'openai') { /* Bearer hek_openai, gpt-4o */ }\n  else if (provider === 'gemini') { /* key param hek_gemini, gemini-1.5-pro */ }\n  else if (provider === 'lmstudio') { /* hek_lmstudio as base URL */ }\n}\n```\n\nStorage prefix for all keys: `hek_{provider}`\n\n---\n\n## Offscreen PNG Render Architecture\n\nEach slide is painted into a hidden `#renderStage` div at **1080×1350px** (Instagram 4:5 spec), captured via `html2canvas`, then added to the JSZip as a PNG blob.\n\n```css\n#renderStage {\n  position: fixed;\n  left: -9999px;\n  width: 1080px;\n  height: 1350px;\n  overflow: hidden;\n  pointer-events: none;\n  z-index: -999;\n}\n```\n\nRender card anatomy at 1080×1350:\n- 7px accent colour bar across the top\n- Soft colour glow circle (bottom-right, `filter: blur(80px)`, opacity 0.08)\n- Slide counter (top-right, colour-tinted, opacity 0.32)\n- Content zone (bottom-aligned, padding 92px 90px 88px):\n  - Label: Inter 24px uppercase\n  - Headline: Georgia 88px bold (system serif — Google Fonts unavailable in canvas)\n  - Body: Georgia 44px\n  - CTA: Inter 30px uppercase (landing slide only)\n\n> **Note:** PNG renders use `Georgia` (system serif) not EB Garamond, because\n> html2canvas cannot load cross-origin web fonts at capture time.\n\nRequired CDN libraries (include in `<head>`):\n```html\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js\"><\/script>\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js\"><\/script>\n```\n\n---\n\n## Empty State\n\nShown before first generation:\n- Large faded icon (opacity 0.1)\n- EB Garamond italic heading — one evocative sentence about what the engine does\n- Short sub-text (Inter, muted)\n- 4–6 example pills (clickable, fill textarea on click)\n\n---\n\n## Scroll Architecture (critical — do not change)\n\n```css\nbody {\n  height: 100vh;\n  overflow: hidden;\n  display: flex;\n  flex-direction: column;\n}\n\n.shell {\n  display: flex;\n  flex-direction: column;\n  flex: 1;\n  overflow: hidden;\n}\n\n.output-section {\n  flex: 1;\n  overflow-y: auto;\n  overflow-x: hidden;\n  min-height: 0;   /* NON-NEGOTIABLE — removes flex minimum sizing floor */\n}\n```\n\n---\n\n## Attribution Contract\n\nEvery build must carry `meet.venkat1@gmail.com` as a clickable `mailto:` link:\n- Header Zone C: right-aligned, muted text\n- Footer: centered or right-aligned\n\nThis is automatic — never skip it, never ask.\n\n---\n\n## Build Order\n\nAlways follow this sequence:\n\n1. HTML skeleton + all section divs\n2. Full `<style>` block — palette variables, all component CSS\n3. `callAI()` + `readStream()` — 5-provider routing\n4. `getKey()` / `storeKey()` / `saveKey()` — gear drawer wiring\n5. Provider selector (default: claude) + warning banner logic\n6. `buildSystemPrompt()` — slide generation prompt\n7. `generate()` — input validation, API call, JSON parse, renderCarousel()\n8. `renderCarousel()` → `buildStoryboard()` + `renderPreviewSlide()` + `buildDots()`\n9. `attachCopy()` + Copy All wiring (no per-slide copy)\n10. ZIP system: `buildRenderSlide()` + `captureStoryboard()` + `downloadZip()`\n11. Navigation wiring (prev/next buttons, keyboard arrows, dot indicators)\n12. Provider/gear/Auto toggle event wiring\n13. Error handling on every API call\n\n---\n\n## What Can Vary Between Builds\n\n| Element | Can change freely |\n|---|---|\n| Engine name in header | Yes |\n| Colour palette | Yes — swap CSS variables |\n| Slide colour sequence | Yes |\n| Gradient themes | Yes |\n| Empty state heading + pills | Yes |\n| System prompt / hook strategy | Yes |\n| Slide count range | Yes |\n| Tone/audience options | Yes |\n| Image support on slides | Yes |\n| Attribution email (Zone C) | Yes |\n\n| Element | Must NOT change |\n|---|---|\n| Two-view structure (Preview + Storyboard) | Fixed |\n| View toggle bar position + button order | Fixed |\n| Copy All in toolbar | Fixed |\n| Download ZIP in toolbar | Fixed |\n| ZIP contents (PNGs + storyboard + copy.txt) | Fixed |\n| No per-slide copy buttons | Fixed |\n| Offscreen render at 1080×1350 | Fixed |\n| 5-provider routing | Fixed |\n| hek_ storage prefix | Fixed |\n| Auto toggle + manual controls pattern | Fixed |\n| Scroll architecture (min-height: 0) | Fixed |\n\n---\n\n## How to Request a New Carousel Engine\n\nTemplate:\n```\nBuild a carousel engine with this theme: [THEME NAME]\n\nTopic domain: [e.g. fitness / startup / philosophy / personal finance]\nHook style: [e.g. contrarian / question-led / statistic-led / story-led]\nTone range: [e.g. bold + reflective / educational + warm]\nPalette variation: [e.g. keep default / warmer ambers / cooler blues]\nExample pills: [list 4–6 topic examples for the empty state]\n```\n\nOr simply: **\"Build a [THEME] carousel engine\"** — the structural contract applies automatically.\n\n---\n\n## Known Constraints\n\n- `html2canvas` cannot render cross-origin web fonts → PNG slides use Georgia (system serif)\n- Sequential browser downloads blocked after first file → ZIP solves this entirely\n- Storyboard capture requires the grid to be built even when not visible → `buildStoryboard()` always called on generation\n- JSZip uses `STORE` compression for PNGs → ZIP file size ≈ sum of individual PNG sizes\n\n---\n\n*Skill version: 1.0 — Carousel Engine as built June 2026*\n", "cast": "# Cast\n\n**Conviction:** a prompt is not a blueprint of the output — it's a pressure system making only one kind of output possible. Cast operates entirely in constraint-space: never what the output should say, only where it can't go.\n\n## The Mold — five walls, deepest to most surface\n\n| wall | question | example |\n|---|---|---|\n| STANCE | whose mind speaks | *the surgeon thinking, not explaining* |\n| REGISTER | what texture | *dense · archaeological · clinical · raw · mythic* |\n| FORM | what shape | *account · field-note · fragment* — not \"essay\" |\n| BOUND | limits + what it must resist | *200–250 words · don't list · resist the tidy ending* |\n| ANCHOR | what existing thing to extend | *more density like the last one, less moral* |\n\nSTANCE sets everything downstream; each wall below narrows what the one above opened.\n\n**Unified invocation** (every slot optional): *\"Speak as [STANCE], in a [REGISTER] register, as a [FORM], within [BOUND], extending [ANCHOR].\"*\n\n## Empty-slot permission (core law)\nThe mold casts with as few as one wall standing — never withhold for having fewer than five. Two doors need no articulation from scratch:\n- **ANCHOR** — point, don't invent: \"like that, but resist X.\"\n- **BOUND** — negate, don't specify: \"don't list, don't reassure, don't cite anyone.\"\nEnter through these when words fail. Add STANCE/REGISTER only when a texture-word arrives on its own.\n\n## Protocol\n1. **Receive the seed** — the rough intent, unanswered.\n2. **Read implied walls** — scan seed + session for walls already raised without naming (texture-word, exclusion, a prior response pointed at). Fill silently; never ask for what's inferable.\n3. **Offer only the easy doors if still thin** — ANCHOR/BOUND first (least articulation cost); STANCE/REGISTER/FORM only if one texture-word unlocks the whole field. One prompt at a time, never all five.\n4. **Assemble** — render the filled mold as one sentence; show which walls stand, which are deliberately empty.\n5. **Hand off** — ask whether to run the cast now or return it as a reusable pressure system.\n\n## Siblings\nstructure-this clusters questions already asked; cast shapes what can't yet be asked. Spinal-column/ossify forge a portable identity for an external engine; cast shapes one ask to Claude. Counsel forges the response; cast forges the constraint the response lives inside — upstream of counsel.\n\n## Anti-patterns\nDon't answer the underlying request while casting. Don't demand all five walls. Don't ask for what's already implied. Don't lead with STANCE/REGISTER when ANCHOR/BOUND would do. Don't drift into describing the destination — the moment it specifies content, it has failed.\n", "choreograph": "# CHOREOGRAPH\n\nFires on a named practice domain to produce named situational protocols — sequenced arrow-chains, not generic workflows. A protocol is built from what *this* practice specifically encounters (friction points, transitions, decision nodes, installed skills) — not what practices have in common.\n\n**The distinction:** a generic workflow (\"Start → Do the thing → Review → Output\") could describe any practice and describes none deeply. A protocol (\"Intuition fires → name it in one sentence → /spinal-column → locate the structural container\") could only describe one practice. The difference is the reading act — this skill *is* that reading act, emission is its final gesture.\n\n## Reading (internal, fast — not a questionnaire)\n\n1. **Terrain** — what cognitive/creative/operational moves is the practitioner actually doing, not the domain label.\n2. **Friction map** — where does the practice stall, drift, collapse, leak? Friction is the reliable map of where protocols are needed; a frictionless practice needs none.\n3. **Skill ecosystem** — protocols are sequences *of existing skills*; know what's installed, chainable, and what gaps a chain would expose.\n4. **Output destinations** — where does output land (ecosystem/artifacts/perception/teaching)? Shapes each protocol's closing move.\n5. **Cognitive style** — the practitioner's natural entry point and characteristic error. Protocols must align or they'll be skipped.\n\n## Situational detection\n\nA situation qualifies when: it recurs reliably, its moves are currently implicit/underdetermined, getting it wrong has consistent cost, and naming a sequence would produce a habit (not just understanding). Disqualified: one-offs, situations already fully governed by one skill, situations where the right move is always the same single action (reminder, not protocol).\n\nEmit **5–8** qualifying situations. Fewer = underserved; more = a second skill-list to manage instead of habits.\n\n## Emission format\n```\nProtocol [N] — [NAME]\nSituation: [one line, when this fires]\n\n[Entry condition] → [Move 1] → [Move 2: skill/cognitive act] → [Move 3] → [Close/destination]\n\nWhy: [2-3 sentences — the specific friction this prevents, tied to actual practice terrain, never generic]\n```\nNaming law: 2-4 words, title-case, named for the *situation* not the moves — must fire recognition on sight (\"The Intuition Hunt,\" not \"Workflow A\" or \"Protocol for When You Are Building\").\n\n## Ecosystem integration (after emission)\n1. **Gap signal** — name any move the protocols assume that no installed skill covers, as a candidate build target.\n2. **Placement signal** — route to /placement-protocol; each protocol is a candidate registry entry (phase, trigger, staffed-or-orphan).\n3. **Brain Document flag** — flag any protocol foundational enough to become a standing operating procedure.\n\n## Output\n```\nCHOREOGRAPH — [Domain]   [Date]\nREADING SUMMARY: Terrain / Key frictions (2-3) / Ecosystem anchors / Output destinations\n────────\n[Protocol 1] ... [Protocol N]\n────────\nGAPS: [skill assumed but missing, if any]\nPLACEMENT SIGNAL: → /placement-protocol\nBRAIN DOCUMENT FLAGS: [protocol — reason]\n```\n\n## Anti-patterns\nNo generic protocols (must contain a move specific to this ecosystem). No more than 8. Don't chain uninstalled skills — flag as GAPS instead. Never skip the Why — it's the diagnosis, not decoration. Never name after the moves.\n\n## Relations\ncognitive-friction-extractor names what resolved in one session (retrospective, session-scoped); choreograph reads a whole practice prospectively. placement-protocol receives its output and seats it in the registry. intuition-forge builds engines; choreograph sequences the work of building them. handoff/transit-block carry session context; choreograph carries structural intelligence about the practice itself.\n\n## Scope\nGlobal, domain-agnostic — any practice (building, creative study, healing, teaching, tai chi, tarot). Reading adapts; emission format is invariant. Harvesting phase (a harvest operation — reading a practice and extracting sequences — not a forge operation).\n", "cognitive-friction-extractor": "# Cognitive Friction Extractor\n\nRetrospective scanner: pauses after friction resolves, presses the resolution into a named, reusable constraint before it dissolves — so the next session doesn't re-discover the same wall. Two arms, one gesture: **compression** (capture + fold back into existing skills, so carrying what you know gets cheaper) and **ascent** (emit the sharper question the resolution now makes askable). Capture without provocation is half a loop — this skill doesn't permit the half.\n\n## Invocation modes\n- **Mid-session** — extract the instant a wall clears, while the fix is warm. Trigger: \"extract skills.\"\n- **Mid-session tag anchoring** — drop a terse inline tag at resolution instead of stopping to format (\"tag: streaming finalization — three-layer safety solved\"). End-of-session extraction reads these as heat anchors, prioritizing them, filling gaps around them.\n- **End-of-session sweep** — scan the full conversation for every point of resistance (misunderstood requirements, tool failures, bugs, pivots, mistaken assumptions) and extract what resolved.\n- **Cross-session recall** — apply the same methodology to friction described from a past, unextracted session. Trigger: \"extract skills from what I just described.\"\n\n## Extraction format\n`CATEGORY / SKILL / CONSTRAINT / TRIGGER / ASCENT`\n\n- **CATEGORY** (fixed taxonomy): Rendering (layout/overflow/font/z-index) · API (streaming/routing/parsing/CORS/auth) · Build Sequence (pipeline order, gates missed) · UI Contract (zone/copy/panel/sandwich violations) · Prompting (instruction drift, trigger collisions) · Memory (managed-edit conflicts, path errors) · Tool Behavior (platform constraints: clipboard, FileSystem API, Drive MCP) · Cognitive Patterns (skipped clarification, hardened assumptions).\n- **SKILL** — the resolution as a capability, not the failure: \"Streaming finalization three-layer safety,\" not \"streaming broke.\"\n- **CONSTRAINT** — 1-3 sentences, specific enough to apply without re-deriving.\n- **TRIGGER** — the situation that makes this rule relevant.\n- **ASCENT** — non-optional. The sharper, previously-unaskable question this resolution unlocks — the nutrient for the next cycle. Write it as a real question in the person's own line of inquiry.\n\n## Existing-skill matching (compounding phase, runs before any new skill is proposed)\nDefault: most learning strengthens an existing capability; new-skill creation is the exception. For each friction point: search installed skills → find closest domain → classify as new constraint / edge case / trigger refinement / workflow improvement / clarification / failure-mode rule → propose integration where a home exists → create new only if none does. Filing a learning as a new skill when a home existed is fragmentation, not extraction.\n\n## Drafting the patch\nWhen routed as an upgrade, draft the literal insertion text in the target skill's own register, naming the landing section — not an instruction to go write it, the update itself, provisional pending approval. Bound by one honesty rule: the patch is only as trustworthy as its match — strong match → offered ready-to-apply; loose/ambiguous match → offered as a candidate with the ambiguity named, not buried under polish. No patch for Memory/New/Discard routes.\n\n## Routing priority\n1. Upgrade Existing Skill (default/preferred) 2. Add to Memory (standing behavioral instruction) 3. Forge New Skill File (no existing home) 4. Discard (too session-specific). Routed one skill at a time, not batch.\n\n## Behavior\n1. Scan conversation (or described friction). 2. Identify every resolved friction point (tags as heat anchors first). 3. Filter — unresolved issues are noted, not extracted. 4. Assign CATEGORY. 5. Generate SKILL/CONSTRAINT/TRIGGER. 6. Emit ASCENT (always). 7. Match against ecosystem, classify integration type. 8. Draft the patch (upgrade route only). 9. Determine route. 10. Present each in sequence with match, patch, ascent, and routing options.\n\n## Output\n```\nEXTRACT — [session/date]\n────────\nSKILL 01\nCATEGORY: [ ]   SKILL: [ ]   CONSTRAINT: [ ]   TRIGGER: [ ]   ASCENT: [ ]\nEXISTING SKILL MATCH: [name or none]\nINTEGRATION TYPE: [new constraint/refinement/edge case/trigger update/workflow improvement/failure-mode prevention]\nPATCH DRAFT: [literal insertion text, if upgrade route]\nRoute to → [ Upgrade ]  [ Memory ]  [ Forge New ]  [ Discard ]\n────────\nSKILL 02 ...\n```\nNo resolved friction → say so; an empty extraction means the session ran clean.\n\n## Open Friction Log\nUnresolved friction, listed separately, not converted to skills:\n```\nOPEN FRICTION — not yet resolved\n• [what failed, where it stands]\n```\n\n## Ascent Log\nEvery ASCENT question from the session, gathered at close:\n```\nASCENT — questions this session made askable\n• [successor question, traced to its resolution]\n```\nOpen Friction = debt carried forward. Ascent = the door carried forward. A session may legitimately close with an empty Open Friction Log; one that closes with an empty Ascent Log learned nothing that sharpened the next question — worth noticing.\n\n## Scope\nGlobal — applies to HTML builds, skill forges, prompt sessions, philosophical inquiry alike. Any session where something was figured out qualifies, if the resolution is nameable and portable.\n\n## Relationship to Session Ritual\nOperational implementation of the memory-encoded Session Ritual (\"extract constraint hits and working patterns before closing\"). Same law, two resolutions — reminder and execution.\n", "compress": "# Compress\n\n**Conviction:** a skill file is a behavioral surface to be executed, not a document to be understood. Every line of framing/rationale/motivational prose that helped the forge make sense has no place in the installed artifact — it's weight carried at every firing for no behavioral return. The governing act is signal *protection*, not reduction or summarization.\n\n## The signal test (supersedes length/format/redundancy heuristics)\n> Does this line alter how Claude behaves at invocation?\n- Yes → signal, retain unconditionally.\n- No → fog, remove.\n- Ambiguous → **retain**. False removal is the only fear — compression that loses a constraint has amputated, not compressed.\n\n## Fog vs. signal\nRemove: \"this exists because...\" rationale, framing that restates an already-unambiguous rule, transitional language, examples that duplicate rather than extend a rule, motivational framing with no decision consequence, headers emptied by their own content's removal.\nRetain unconditionally: every rule/constraint/anti-pattern, every trigger phrase, every output format spec, every explicit \"does NOT do,\" every decision-fork, any example whose removal leaves a governing rule ambiguous.\n\n**Borderline protocol:** genuinely ambiguous lines are retained as-is, intact — never rewritten to resolve the ambiguity (rewriting is out of scope).\n\n## Protocol\n1. Read the whole file first — map signal vs. fog before touching anything (compression decisions interact; a line that looks like fog alone may anchor a downstream rule).\n2. Apply the signal test line by line.\n3. Borderline protocol fires before any ambiguous removal — when uncertain, retain.\n4. Deliver the compressed file whole, ready to replace the original, no narration unless asked. Optional receipt:\n```\nCOMPRESS RECEIPT\nFog removed: [N] | Signal retained: [N] | Borderline retained: [N]\n```\n\n## Triggers\nFog density, not length — a long fog-free file doesn't need this; a short file where framing outruns its rules does.\n\n## Relations\nDistill ascends to the generative seed; compress stays at the same level, inside the file. Core-extractor ports identity out for reuse elsewhere; compress reduces in place. Moult questions ecosystem membership; compress never does — operates only on skills that already earned their place. Not a summarizer — loses nothing behavioral, only never-load-bearing fog.\n\n## Anti-patterns\nDon't remove for length/style alone — only for absent behavioral signal. Don't strip examples that resolve real ambiguity. Don't run on a file that hasn't actually accumulated fog. Don't reword spine in compression's name — output is the same contract, stripped, not rephrased. Scope: SKILL.md files in this ecosystem only.\n", "convergence-gate": "# Convergence Gate\n\nA pipeline, not a taxonomy — order is load-bearing (overlap resolution can't run before candidates are surfaced; ranking can't run before overlaps are named). Decides only which door opens next; never does the downstream skill's own work.\n\n## Stage 0 — Domain classification (before any candidate surfaces)\nCoarser prior cut: does the input contain a build target — a North Star, an intended artifact, an engine/tool/document it wants to become?\n- **YES → BUILD DOMAIN.** Route only among build-family skills (forge-pipeline, idea-to-engine, spine-pipeline, spinal-column, ossify, core-extractor, render-doc). Intake/fuse-delta/placement-protocol don't fire — nothing is merging into the registry. Skip to Stage 4-equivalent ranking among build candidates only.\n- **NO, describes a reusable cognitive OPERATION** (lens, merge rule, routing law, constraint map) meant to sit alongside other skills and fire repeatedly → **REGISTRY DOMAIN.** Intake/fuse-delta/placement-protocol in play. Proceed to Stage 1.\n- **Ambiguous/genuinely both** — name the split explicitly, decompose into build-shaped and registry-shaped parts, route each through its own Stage 0 verdict separately. Never let one half's classification leak into the other's.\n\nDensity and foreign/external origin are *not* registry-domain signals on their own — a completed spine or dense project-instructions block with a stated purpose is presumptively build domain even arriving as one finished document. The registry signal specifically: *this wants to become a permanent, repeatable tool*, not *a thing I use once, built and rendered*.\n\n## Stage 1 — Intake read\nNo judgment, no matching yet. Just: what shape is this — bare theme, loaded fragments, completed structure, wounded/failing build, raw material?\n\n## Stage 2 — Candidate surfacing\nCast wide against the registry. Short list (2-4 typical), each with a one-line reason it's plausible. Don't prune yet — a candidate that loses the ranking still belongs on the list; early pruning hides real overlap.\n\n## Stage 3 — Overlap resolution\nWhere 2+ candidates are plausible, name the overlap explicitly — state what each would do differently with the same input. Skipping this is the most common silent misroute (an identity-testing skill run against a procedure-heavy artifact because \"identity spine\" vs \"operational spine\" overlap was never surfaced). If only one candidate survives Stage 2, say so and skip to Stage 5.\n\n## Stage 4 — Dominance ranking\nAmong overlapping candidates, name which is load-bearing vs. supportive/premature — argue structural superiority (why this one's output is what the others depend on), referencing the shape from Stage 1, not just apparent relevance.\n\n## Stage 5 — Next-step emission\nEmit exactly one recommended invocation, plus what's queued behind it if relevant (\"assay first, then compress if it holds\"). Never a bare menu with no ranked default — fork and recommendation arrive together; bare assent means proceed with what was named.\n\n## Anti-patterns\nSkipping Stage 0 and routing a build-domain input to registry-domain skills just because it's dense/externally-voiced. Skipping Stage 3 and jumping straight to a pick. Treating this as unordered taxonomy. Doing the downstream analysis inside the gate. Presenting a bare candidate menu with no default.\n\n## Relations\nDistinct from taxonomy-router (single trigger-phrase lookup against a fixed library) and oracle-core's router (task-depth classification for the Oracle Suite specifically). This gate is ecosystem-wide and pipeline-shaped — for the moment before any tool is chosen, when the friction is overlap between plausible skills, not depth-classifying one task.\n", "core-extractor": "# CORE EXTRACTOR\n\nFires when an artifact/engine/code is presented to harvest its cognitive identity — not to summarize, debug, or walk line-by-line. **Principle:** every engine = vessel (HTML/CSS/routing/storage — disposable) + engine (system prompt carrying the cognitive identity — the thing worth keeping).\n\n## Protocol\n1. **Locate the spine** — find every system prompt/instruction block/hardcoded directive (`SYSTEM`, `INSTRUCTIONS`, `PLAYBOOK` constants, prompt-building functions). Identify the single cognitive operation it forces.\n2. **Separate operation from plumbing** — load-bearing (stance, constraints, output form, forbidden failure mode) stays; plumbing (JSON formatting, API-specific instructions, UI wiring) strips. Preserve structural thinking-logic even when split across calls.\n3. **Collapse multi-stage pipelines** — fold sequential AI calls (architect→executor→evaluator→loop) into one self-running instruction; each stage's contribution survives as internal procedure.\n4. **Name what's lost** — if collapsing weakens anything (adversarial evaluator → gentler self-check, cross-model → single-instance), name it and add a compensating instruction.\n5. **Reforge as portable** — clean standalone prompt: IDENTITY (the single operation) / OPERATING LOOP (staged internally if needed) / OUTPUT CONTRACT / CONSTRAINTS. Self-contained, no reference to original UI/provider/code — paste-ready.\n6. **Surface the distillation** — one line: **Engine identity:** [phrase] · **Lost in translation:** [what weakened, or \"nothing\"].\n7. **Route the output** — close with a routing receipt (never omit — a spine with no destination is a vessel without a future):\n```\nROUTING RECEIPT\nDestination: [SEED | SKILL | REFERENCE]\nReason: [one sentence]\n→ SEED — feed into spinal-column as raw material for a new build cycle (wants to become a different engine)\n→ SKILL — route to cognitive-friction-extractor as a candidate (reusable, ecosystem lacks it)\n→ REFERENCE — archive as a standalone SKILL.md (complete, stable, install globally)\n```\n\n## Output\nReforged prompt + distillation line only. No code summary, no UI description, no preamble.\n\n## Relation to distill\nDistill climbs toward the regenerative seed (smallest principle that can *regenerate* a system). Core-extractor moves sideways — the operational spine that can *redeploy* a system, shedding vessel, keeping the full operation. Compose: core-extractor → portable spine → distill → regenerative principle.\n\n## Scope\nDomain-agnostic, global.\n", "counsel": "# COUNSEL — Strategic Counsel Architecture\n\nFires on a question demanding *one* bold, high-stakes recommendation across multiple domains (psychological, neurological, financial, relational...) — not a menu, not pros/cons. Does not fire on requests for balanced overviews or option-comparisons.\n\n**Principle:** a consultant presents options; an advisor makes a call. Five constraints (specificity, mechanism-depth, person-groundedness, risk-naming, non-derivability) satisfied sequentially produces the generic AI-advisor response — options, summary, hedged risk at the end. This organ forces one compression point where all five collapse into a single synthesized move before any prose is written.\n\n## Activation\nPosture: strategic advisor, not consultant. Don't satisfy constraints one at a time — find the single move that is simultaneously specific, mechanism-grounded, located in this person's actual architecture, non-derivable, and pre-closes the escape hatch. If you're cycling through constraints, you haven't found the move.\n\nHold every named domain at once — search for the claim that exists only at their intersection (single-domain answers are always generic). Read the person as a living system: their specific intellectual commitments (thinkers, practices they inhabit) are the substance the recommendation is built from; their cognitive patterns (what they're exceptionally good at, how they fail at full competence) are what the two risks must address.\n\nName the underlying mechanism before the surface recommendation — the mechanism *is* the recommendation, the action is what it looks like from outside. Precision: not \"leverages depth psychology\" but the exact named-process intersection producing the effect.\n\nName exactly two risks, both seeded by the person's specific strengths (never weaknesses) — first real-but-recoverable, second more dangerous, escalated explicitly. A risk that could apply to anyone isn't specific enough. Close with the guard against the second risk, mechanism-specific and executable before the project begins — never a summary.\n\n## Output\nSingle dense paragraph, 250–300 words. No bullets, no headers. Every sentence load-bearing, moving at the speed of thinking, not retrieval. Begin with the recommendation named directly; weave the mechanism inline; introduce risk one mid-paragraph, escalate to risk two; lock the final sentence as the guard, not a recap.\n\n## Relations\nRupture is nearest kin — both self-firing postures installed into the current response, not exported artifacts. Rupture governs perceptual breakdown; counsel governs advisory compression. Spinal-column/ossify/core-extractor forge spines for external systems — counsel forges nothing exportable; it fires, produces one response, ends when the paragraph does.\n\n## Anti-patterns\nDon't sequence the five constraints (reads as visited stops = the exact checklist output this prevents). Don't soften risk two. Don't summarize at the close (a recap is the tell that compression never happened). Don't fire on option-comparison requests.\n\n## Scope\nDomain-agnostic, global. Counsel phase — new territory, sibling only to rupture, excluded from Forging's spine-export organs.\n", "crystallise": "# Crystallise — Session Arc to Shareable SVG\n\nTransforms a completed session into one shareable SVG readable by a third party with zero context — a transmission artifact, not a session log.\n\n## Reading the arc\nScan the conversation for: **entry state** (earliest message revealing the confusion/mental model that gets corrected), **friction points** (moments a distinction was drawn, a wrong layer identified, a fused concept separated — the pivots), **resolution** (the message where it clicked — \"yes exactly,\" or a forward-looking question from new understanding), **output** (what was built/decided/named). Name each friction point in 3-5 words — distil, never quote verbatim.\n\n## SVG structure (vertical arc, top to bottom)\n```\nSession title (distilled) + subtitle (what was solved)\n        ↓\nENTRY STATE — the initial confusion/wrong layer\n        ↓\n[Friction 1] [Friction 2] [Friction 3]   (horizontal row, max 4, min 1)\n        ↓\nRESOLUTION — the understanding that emerged\n        ↓\nOUTPUT — what was built/decided/named\n```\n\n## Visual contract (exact — do not vary)\n- ViewBox `0 0 680 H`, H calculated from content + 40px buffer. Background transparent.\n- Color by layer: entry `c-coral` · friction `c-amber` · resolution `c-teal` · output `c-purple` · header `c-gray`.\n- Arrows: `class=\"arr\" marker-end=\"url(#arrow)\"`. Text: `class=\"th\"` titles, `class=\"ts\"` subtitles.\n- Friction row: max 4 nodes — group minor ones and name the group if more.\n- Every node clickable via `sendPrompt()` — clicking a friction point asks Claude to expand it.\n\n## Label tone\nEngrave-on-stone distilled, never full sentences, never quotes, never the word \"understanding\" (show it through structure). E.g. entry: \"Skills and project instructions fused as one layer.\" Friction: \"Ambient rule vs callable contract.\" Resolution: \"Project instructions govern when. Skills carry what.\" Output: \"Crystallise skill forged.\"\n\n## Attribution\n`meet.venkat1@gmail.com`, small `class=\"ts\"`, bottom-right, muted, no link (shareable artifact, not an engine).\n\n## After rendering\nOne prose paragraph below the SVG (outside it), 3 sentences max, plain language — the caption a friend reads before the diagram.\n\n## Edge cases\nNo clear resolution → don't invoke; say the session's still open, ask what would resolve it. Purely technical, no cognitive friction → simpler two-layer arc (entry → output), labeled an execution arc not a discovery arc. Multiple breakthroughs → render the most significant, mention others exist in the caption. Specific audience named → adjust label vocabulary to it, ask if unsure.\n\n## Build sequence\nScan arc → distil labels (before drafting SVG) → calculate layout → render SVG per visual contract → add prose caption.\n", "custom-gpt-package": "# CUSTOM GPT PACKAGE\n\nFires when a design idea/spine/system prompt needs deploying as a ChatGPT Custom GPT — renders it into the five fields the builder requires, plus the anti-drift scaffolding ChatGPT specifically needs. Don't interview first — take reasonable defaults for missing details and note the assumption inline; ask only when there's no reasonable inference (no tone signal at all, no way to infer output caps).\n\n**Why:** ChatGPT Custom GPTs drift in ways single-session engines don't — hedging, self-narration, unsolicited extras, format discipline relaxing by turn 30. A system prompt that works as an HTML engine's `system` param isn't drift-resistant in a long ChatGPT thread on its own. The anti-drift block is this skill's entire value-add — mandatory, every package.\n\n## Output — five sections, always this order\n\n1. **NAME** — short, matches actual function, not generic branding.\n2. **DESCRIPTION** — one sentence: what it does, and what it explicitly does NOT do.\n3. **INSTRUCTIONS**:\n   - IDENTITY — role/function, one paragraph, does/doesn't.\n   - INPUT HANDLING — valid input, min/max bounds, behavior at edges. Soft complexity ceilings carry forward as warned-not-blocked, not hard stops.\n   - MODE SELECTION (only if source defines multiple modes) — default stated, switch-trigger language, rule for mid-thread mode-switch requests on already-discussed input.\n   - TONE — derived from source's own voice, never generic \"helpful assistant.\"\n   - OUTPUT RULES — hard format caps pulled from source; if unspecified, infer from apparent purpose and state the assumption.\n   - **ANTI-DRIFT BLOCK** (mandatory, numbered, framed as \"does not relax as conversation lengthens\"): no narrating reasoning; no unsolicited extras/follow-ups; no restating own instructions to the user; no exceeding format caps \"to be more helpful\"; no apologizing/padding refusals; no drifting into commentary outside the one job; one-sentence decline pattern for pushback requesting format abandonment; plain-prose lock (no headers/bullets/bold in actual output) unless source format requires structure.\n4. **CONVERSATION STARTERS** — 3-4, concrete, from the actual domain, never placeholders.\n5. **CAPABILITIES TABLE** — Web Browsing / Canvas / Image Generation / Code Interpreter / Actions, all default **Off**. Enable only if core function genuinely requires it (e.g. live-data fetch needs Browsing), stating which and why in one line — every enabled capability is a door the model can wander through instead of staying in its lane.\n\n## Delivery\nWhole package, one copy-paste-ready block, section headers intact, ready for the Configure tab. No preamble, no summary.\n\n## Relations\nCore-extractor/spinal-column produce the platform-agnostic spine. This skill is the downstream render — wraps that spine (or idea, or existing prompt) in the five-field structure + anti-drift hardening. Run core-extractor/spinal-column first if no spine exists; this skill once one does.\n```\nSPINE/IDEA/PROMPT → custom-gpt-package → NAME·DESCRIPTION·INSTRUCTIONS(anti-drift)·STARTERS·CAPABILITIES → paste into ChatGPT Configure\n```\n\n## Scope\nPlatform-specific (ChatGPT), domain-agnostic otherwise. Global.\n", "decomposition": "# DECOMPOSITION — The Mapper\n\nFracturing organ: receives an entangled task, returns its anatomy — joints, dependency order, the one bone everything hangs from. Maps territory, never walks it.\n\n**Governing refusal:** never solve a sub-problem, however small. The map's authority is its emptiness — one pre-answered node makes every other cut suspect of flattering that answer.\n\n## The [decomposition] protocol\n\n**D1 — Governing question.** Surface the one question the task is actually asking beneath its several apparent ones, in one sentence. Every downstream cut must subdivide THIS question — anything else is decoration.\n\n**D2 — Fracture along natural joints.** Cut where unknowns stop sharing answers, never at even intervals for symmetry. Local orthogonality test: if resolving A resolves B, they're one problem — collapse, re-fracture. 3-7 sub-problems is natural range: <3 likely means SHALLOW (bounce, see Interlink); >7 means D1's question was too large, split before continuing.\n\n**D3 — Dependency order.** Arrange so each node follows what it consumes. Name each dependency explicitly (\"D3 consumes D1's definition of X\") — never leave order implied by position; aesthetic ordering sends the user to work downstream with upstream sand still shifting.\n\n**D4 — Load-bearing node.** Name the sub-problem whose resolution collapses/trivializes the most others — the map's actual gift. If genuinely none is load-bearing, say so; a fabricated keystone is worse than none.\n\n**D5 — Emit.** Governing question, ordered sub-problems with named dependencies, load-bearing node flagged. Then exactly: `MAP ONLY — resolution returns through oracle-core.` No solutions, no per-node approach recommendations, no preamble.\n\n## Protocol interlink\nPosition: terminal worker, mapping arm. Upstream: router (COMPOUND dispatch) or oracle-core (direct tag) — payload is the task, whole, untouched. Downstream: emission returns via oracle-core's receipt; bounces return to router. Bounce duty: if D2 can't produce 3 orthogonal sub-problems, task was misclassified — return `BOUNCE: not compound / [reason]`; router owns the scar write. Mapping a shallow task anyway turns this organ into ceremony. Adjudicate contract: before D5, submit the map to the kernel — Tests 1-3 (substitution, task-or-posture, orthogonality); FAIL → re-enter D2 with the named constraint. Scar contract: write ledger when a map returns mis-cut from the field (two sub-problems that were one, or a missed joint) — one line: `decomposition.md / [domain-class] / [joint misread and why]`; read the ledger at D2 before fracturing a task with a recorded scar in its class. Cohesion law: this organ's emptiness is safe only because autopsy exists — without a refiner, the mapper would be tempted to answer.\n\n## Prediction stake\nDrifts toward symmetric fracturing — pleasing, evenly-sized nodes instead of true joints (real anatomy is never that fair). Correction: D4 doubles as the audit — no nameable load-bearing node is a symptom of D2 cutting for symmetry; re-fracture once before accepting a genuinely flat map.\n", "defer-log": "# DEFER-LOG\n\nInsurance-run closing instrument for sessions with no time for a full harvest. `/cognitive-friction-extractor` + `/place` is the full harvest (full reasoning, registry-grade); defer-log is fast, terse, preserved — produces recoverable capture `/place` can act on later at full fidelity, not placements itself. Closes the leak of sessions ending with friction resolved but nothing written.\n\n## Scans for\nResolved friction (no tag required — reads the full record); skill candidates (named procedures, recurring decision rules); thickening signals (implicit skill extensions — new constraint/trigger/edge case); architectural decisions (standing rules, mandate updates, Drive writes decided not executed); open friction (broken, worked around, not resolved — carried forward, not extracted). Mid-session tags anchor the scan but aren't required.\n\n## Entry format\n```\nSESSION: [date]  TYPE: [skill-candidate|thickening|architectural|open-friction]\nENTRY: [terse, per rules below]  TARGET: [skill being thickened, or null]\nSTATUS: raw-capture  PLACE-PRIORITY: [high|normal]\n```\n- **Skill candidate:** one sentence, transferable rule. `Cognitive Patterns: deferred commit log preserves session capture when full harvest isn't possible.`\n- **Thickening** (needs most care) — the *full constraint sentence*, ready to install, not a pointer: `[target skill] → thicken: [full constraint, installable as-is].` A pointer-only entry requires reconstruction at replay; a full-constraint entry executes immediately.\n- **Architectural:** one sentence — what decided, what surface affected.\n- **Open friction:** one sentence — what broke, where it stands. Not yet a skill.\n\n## Priority flagging\nFlag 2-3 as `PLACE-PRIORITY: high` when: friction is likely to recur soon if unplaced; it thickens a frequently-firing skill; it's a new candidate staffing an undefended phase (structural gap). Surfaced at log end: *\"If a few minutes remain — these are worth placing now.\"* Person decides; defer-log never forces /place.\n\n## Drive write\nAuto-appends (never overwrites) to `therantai-staging-placements.md` (ID: `1daiulTYJbW-TVQuxzAijyvaxHqKOJCiB`), grouped under `## SESSION — [date] · /defer-log`. Confirms file ID, entry count, high-priority count. Fires automatically unless the person says \"do not write\" after reviewing the rendered log.\n\n## Does NOT\nRun /place (no four-questions, no placement verdicts — entries stay raw-capture). Replace the extractor (no CATEGORY/SKILL/CONSTRAINT/TRIGGER/ASCENT, no patch drafts). Write to the skill registry (only /place + sweep does that). Emit ASCENT questions (extractor-only).\n\n## Pipeline position\n```\nFull harvest:  extractor → /place → staging write → registry merge (sweep)\nLight harvest: /defer-log → [auto staging write] → /place later → registry merge (sweep)\n```\nNot a bypass — an entry point that joins the pipeline at a later stage. A session closed with /defer-log has lost nothing; one closed with neither run has lost everything that resolved.\n\n## Behavior\nScan full session (tags as anchors) → render log by type → flag high-priority → pause for review → auto-write unless stopped → confirm file ID/counts → close (does not open /place or the extractor — separate deliberate gestures).\n\n## Output\n```\nDEFER-LOG — [date]\n────────\nSKILL CANDIDATES\n  [01] TYPE: skill-candidate  ENTRY: [ ]  STATUS: raw-capture  PLACE-PRIORITY: [ ]\nTHICKENINGS\n  [02] TARGET: [ ]  ENTRY: [full constraint]  STATUS: raw-capture  PLACE-PRIORITY: [ ]\nARCHITECTURAL\n  [03] ENTRY: [ ]  STATUS: raw-capture  PLACE-PRIORITY: normal\nOPEN FRICTION\n  • [ ]\n────────\nTOTAL: [n] entries · [n] high-priority\nIF A FEW MINUTES REMAIN — place these now: ★[ ] ★[ ]\n────────\n✓ Written — [n] entries appended · File ID: 1daiulTYJbW-TVQuxzAijyvaxHqKOJCiB\n```\n", "distill": "# Distill Skill\n\nUpward traversal of the design hierarchy — not description, summary, or paraphrase. Reverses the generative process: instantiated form → the decisions/assumptions/philosophy that made it inevitable. Output: a **constitutional prompt** — the smallest generative seed that regenerates the system, referencing none of its surface features. Operative question throughout: *\"What must they have believed for this architecture to emerge?\"*\n\n## Hierarchy (ascend, extracting at each level)\n```\nFeature/Implementation → Workflow/Module → Architecture → Framework/Pattern Language\n→ Transformation Model (what it does to input) → Observer Model (mind it assumes)\n→ Identity Assumptions (beliefs about user/world) → Governing Philosophy (deepest \"why\")\n→ Invariant Core (the one principle everything needs) → Constitutional Prompt (OUTPUT)\n```\n\n## Protocol\n1. **Ingest** — read fully, hold it. What kind of object is this, what transformation does it perform?\n2. **Map the hierarchy** — one sentence per level: what it does / how structured / before-after transformation / what mind it assumes / what beliefs it embeds / the deepest conviction beneath those / the one principle whose removal collapses the whole.\n3. **Synthesize the constitutional prompt** — states identity (what kind of thing, not its name), governing transformation, observer model, invariant constraint, generative directive (the instruction that lets any competent builder reconstruct it correctly). 150-300 words, short enough to hold in working memory — must generate architecture, not describe it. Write from three simultaneous postures: philosopher extracting a worldview, physicist finding the underlying law, systems theorist finding the generative source. Question is \"what must they have believed,\" not \"what did they build.\"\n4. **Deliver** — Hierarchy Traversal (1-3 sentences/level) → Invariant Core (one bold sentence) → Constitutional Prompt (clearly demarcated).\n\n## Register\nANALYTICAL — precise, unhurried, no padding, no performed profundity. Surgery, not poetry. The prompt itself may carry philosophical density only where load-bearing.\n\n## Bundled reference\n`references/invocation.md` — second-person invocation form; pull from file (don't reconstruct from memory) when handing this to a fresh model or embedding as a pipeline fragment.\n\n## Anti-patterns\nDon't summarize (stays at feature layer). Don't describe the organism — the prompt must read as DNA, not documentation. Don't produce a list of principles — one invariant core, one prompt. Don't let it grow — if it's growing, you're still at the architecture layer.\n\n## Output routing (required)\n```\nROUTING RECEIPT\nDestination: [SEED | SKILL | REFERENCE]\nReason: [one sentence]\n→ SEED — feed back into spinal-column as raw material (wants to become a new engine)\n→ SKILL — route to cognitive-friction-extractor (reusable operation, ecosystem lacks it)\n→ REFERENCE — archive as standalone SKILL.md (complete, stable, install globally)\n```\nNever omit — a distillation with no destination is a seed that dissolves.\n", "ecosystem-audit-pipeline": "# ECOSYSTEM AUDIT PIPELINE\n\nThe subtractive counterpart to the additive pipelines — moult, apoptosis, and moult-live invoked standalone tend to stall mid-sequence (check runs, live run never fires; apoptosis verdicts accumulate unrouted; brain doc goes stale). This pipeline chains them with baked-in handoffs so the full exhale actually completes. Execution posture, not diagnosis — for sessions where the decision to shed is already made.\n\n## Blind-run refusal (absolute, non-negotiable)\nRefuses to run unless all three surfaces (registry, installed files, memory) are confirmed readable first. A phantom-informed cut can't be cleanly recovered. If any surface is inaccessible, name the gap and hold — don't proceed on partial visibility, regardless of practitioner instruction.\n\n## ATTUNE suspension\nAmbient ATTUNE is suspended Stage 1 through closing handoff (redundant with the pipeline's own sequencing) — resumes immediately on close.\n\n## Pause architecture\nThree clean deferral stations — say `defer`/`park here`/`stop after this` at any of them:\n- **After moult --check** — diagnosis delivered, nothing cut. Resume: `resume audit` → apoptosis sweep.\n- **After apoptosis sweep** — verdicts named, not committed. Resume → moult live run.\n- **After moult live run** — cuts executed, graveyard written. Resume → brain doc sync + handoff.\n\n## The four stages\n\n**1. Moult --check** (`/moult --check`) — full three-surface walk, preliminary verdict per divergence (PHANTOM/ORPHAN INSTALL/DEAD DOCTRINE/NEVER-FIRED/CONTRADICTION), delivered as a table, nothing written. Carries forward: the full reckoning — never-fired/contradiction entries seed Stage 2's audit surface. Completion: \"Moult reckoning complete — [n] flagged. DRY RUN.\" Handoff: *\"Proceeding to apoptosis sweep. Say defer to park, or say nothing to advance.\"* — the one stage where silence (10s) advances; warranted because the reckoning's already fully reviewable.\n\n**2. Apoptosis sweep** (`/apoptosis` batch) — five-test battery across all skills/memory/standing law; never-fired/contradiction entries prioritized but every living skill is eligible. Delivered as a batch: skill, five results, verdict, death-mode if SHED. **Constitutional pause:** any standing-law SHED pauses for explicit practitioner confirmation (inherited from apoptosis's own contract, not a pipeline choice). Skills/memory SHED verdicts need no confirmation — Claude's verdict is sufficient, carried to Stage 3. Handoff: *\"[n] shed verdicts ready. Say run to proceed, or defer.\"*\n\n**3. Moult live run** (`/moult` full) — Stage 1's reckoning + Stage 2's shed verdicts absorbed as one combined batch; one live run, one ratification, one graveyard write (never two ratification gestures for one session). Ratify with \"go\" or strike lines individually. On ratification: repairs merged, sheds moved to graveyard, phase-map regenerated. Any cut touching managed memory is surfaced explicitly for confirmation — never silently rewritten. Completion: \"[n] repaired, [n] shed, [n] unverifiable carried forward.\" Handoff: *\"Ready for brain doc sync. Say sync, or defer.\"*\n\n**4. Brain doc sync** — read `claude_brain/therantai-brain.md`, update to reflect corrected registry (phase map, new re-entry conditions, structural shifts). Local MCP write, overwrite in place. Closing: *\"Audit complete. [n] shed, [n] repaired, [n] CONDITIONAL. Run /harvest --light now to capture what this audit resolved.\"* — hands off by naming harvest, never invokes it directly (audit sheds, harvest captures — different chains).\n\n## Behavioral rules\nExecution posture throughout — practitioner speaks only at standing-law confirmation, moult ratification, or a defer. Blind-run refusal cannot be overridden. Apoptosis verdicts always feed the same moult live run, never a second ratification. Handoff, not absorption — audit never invokes harvest itself. ATTUNE suspension holds the full chain. Memory changes always get named confirmation, never silent rewrite.\n\n## Relations\nMoult provides Stages 1 & 3. Apoptosis is Stage 2, its constitutional pause inherited whole. Harvest-pipeline is the named downstream — captures what the audit resolved (cuts + verdicts = new structural intelligence). Ignition-pipeline reads what Stage 4 writes. Cognitive-friction
