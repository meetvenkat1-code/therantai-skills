name: check

# Runs on every pull request that touches skills or the tooling.
# Blocks the merge if any skill is malformed. Mark this job as a required
# status check in Settings -> Branches -> branch protection rule for main.
#
# MANIFEST.json is generated by the release workflow, not by contributors,
# so this job lints by building the manifest inside the throwaway runner
# (it fails on bad frontmatter, name/folder mismatch, missing SKILL.md,
# unknown `requires`, symlinks) and then runs the real loader's verifier
# against the result.

on:
  pull_request:
    paths:
      - "skills/**"
      - "ssot_boot.py"
      - "tools/**"
      - ".github/workflows/check.yml"

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint skills and build manifest (runner only, not committed)
        run: python tools/build_manifest.py

      - name: Verify the tree with the real loader
        run: |
          python - <<'PY'
          import pathlib, sys
          sys.path.insert(0, ".")
          import ssot_boot
          man = ssot_boot.verify(pathlib.Path("."), None)
          print(f"verified {len(man['skills'])} skills: {', '.join(sorted(man['skills']))}")
          PY
