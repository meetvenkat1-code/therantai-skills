name: check

# Runs on every pull request that touches skills or the tooling.
# Blocks the merge if any skill is malformed. Mark this job as a required
# status check in Settings -> Branches -> branch protection rule for main.
#
# Manifest schema v2: MANIFEST.json is {"version": "vX.Y.Z", "skills":
# {name: {"url", "sha256", "bytes", "description"}}} built by
# tools/build_manifest.py (LF-normalized hashes). Contributors must keep the
# committed MANIFEST.json + channels/stable.json in sync, so this job first
# runs `python tools/build_manifest.py --check` (fails when stale), then runs
# the real loader's verifier (ssot_boot.verify, schema v2) against the tree
# and asserts every entry carries url/sha256/bytes/description.

on:
  pull_request:
    paths:
      - "skills/**"
      - "ssot_boot.py"
      - "tools/**"
      - "MANIFEST.json"
      - "channels/**"
      - ".github/workflows/check.yml"

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Manifest is current (schema v2)
        run: python tools/build_manifest.py --check

      - name: Verify the tree with the real loader (schema v2)
        run: |
          python - <<'PY'
          import pathlib, sys
          sys.path.insert(0, ".")
          import ssot_boot
          man = ssot_boot.verify(pathlib.Path("."), None)
          skills = man["skills"]
          for name, meta in skills.items():
              assert set(("url", "sha256", "bytes", "description")) <= set(meta), name
              assert meta["url"].endswith(f"skills/{name}/SKILL.md"), name
              assert meta["sha256"] and meta["bytes"] and meta["description"], name
          print(f"verified {len(skills)} skills (schema v2): {', '.join(sorted(skills))}")
          PY
