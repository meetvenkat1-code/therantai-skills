<style>

</div>

</div>

{id:'or-auto',native:false,label:'OR · Free Router',dotColor:'#f97316',requiresKey:true,keyStorageName:'openrouter',keyLabel:'OpenRouter API Key',keyPlaceholder:'sk-or-…',keyNote:'Standalone only — OpenRouter has no CORS proxy inside claude.ai',standaloneOnly:true,endpoint:'https://openrouter.ai/api/v1/chat/completions',authHeader:'Authorization',authPrefix:'Bearer ',extraHeaders:{'HTTP-Referer':'$origin','X-Title':'$engineName'},requestFormat:'openai-chat',streamFormat:'openai',modelChain:['openrouter/free'],softFallback:{on:[429,500,502,503],within:true},timeoutMs:45000,idleMs:9000}]};

var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms)})};

function P(id){return liveModelConfig.providers.filter(function(p){return p.id===id})[0]||null}
function splitKey(k){var i=k.indexOf('::');return{provider:k.slice(0,i),model:k.slice(i+2)}}

  if(p.native===true){n++;if(isArtifact)u=true}else if(p.endpoint&&p.requestFormat==='openai-chat'&&!(p.standaloneOnly&&isArtifact))u=true}

 var l=(liveModelConfig.defaultLanes||[]).filter(function(k){if(k.indexOf('::')<1)return false;var s=splitKey(k);return ok.indexOf(s.provider)>-1&&!P(s.provider).native});
 if(!l.length){var p=usableProviders().filter(function(x){return!x.native&&x.modelChain&&x.modelChain.length})[0];if(p)l=[p.id+'::'+p.modelChain[0]]}return l}

 if(cfg.requestFormat!=='openai-chat')throw new Error('Unknown requestFormat: '+cfg.requestFormat);

   pump()}).catch(finish)})()})}
async function callModel(o){ /* strict mode: exactly o.model, never falls through */
 var cfg=P(o.provider);if(!cfg)throw new Error('Unknown provider: '+o.provider);

 var retried=false,folded=false,ls=null,lr=null;

  var acc='',served=null,res,sys=folded?'':o.system,usr=folded?(o.system?o.system+'\n\n---\n\n':'')+o.user:o.user;

function fetchModelConfig(cb){return fetch(CANONICAL_CONFIG_URL+'?v='+Date.now()).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})

/* ===== Lanes (Mode A) ===== */

/* ===== Catalog ===== */

function matcher(q){q=q.trim();if(!q)return function(){return true};var m=q.match(/^\/(.+)\/([a-z]*)$/);if(m){try{var re=new RegExp(m[1],m[2]);return function(s){return re.test(s)}}catch(e){}}q=q.toLowerCase();return function(s){return s.toLowerCase().indexOf(q)>-1}}
function chip(txt,on,fn){var b=document.createElement('button');b.type='button';b.className='tchip'+(on?' on':'');b.textContent=txt;b.addEventListener('click',fn);return b}
function renderCatalog(){var pb=$('provBtns');pb.innerHTML='';
 Object.keys(PROVIDERS).forEach(function(id){var p=PROVIDERS[id],n=catalog[id]?catalog[id].models.length:0;
  pb.appendChild(chip(p.label+(n?' ('+n+') ↻':' — fetch'),activeProv===id,function(){var was=activeProv===id;activeProv=id;renderCatalog();if(!catalog[id]||was)fetchCatalog(id)}))});
 var tc=$('tierChips');tc.innerHTML='';['all','pinned'].concat(TIERS).forEach(function(t){tc.appendChild(chip(t==='pinned'?'Pinned ('+S.settings.customLanes.length+')':t,tierSel===t,function(){tierSel=t;renderCatalog()}))});
 var box=$('catRows');box.innerHTML='';var c=catalog[activeProv];if(!c)return;
 var test=matcher($('catSearch').value),act=activeKeys(),isPin=function(id){return S.settings.customLanes.some(function(x){return x.key===activeProv+'::'+id})};
 var rows=c.models.filter(function(m){return(tierSel==='all'||(tierSel==='pinned'?isPin(m.id):m.tier===tierSel))&&test(m.id+' '+m.name)});
 rows.slice(0,150).forEach(function(m){var lab=document.createElement('label');lab.className='mrow'+(isPin(m.id)?' pinned':'');
  var cb=document.createElement('input');cb.type='checkbox';cb.checked=act.indexOf(activeProv+'::'+m.id)>-1;var pv=activeProv;cb.addEventListener('change',function(){togglePin(pv,m,cb)});
  var meta=document.createElement('span');meta.className='meta';meta.textContent=[m.ctx?Math.round(m.ctx/1000)+'k ctx':'',m.tier==='free'?'FREE':m.price!=null?'$'+(m.price*1e6).toFixed(2)+'/M in':''].filter(Boolean).join(' · ');
  lab.appendChild(cb);lab.appendChild(document.createTextNode(m.id));lab.appendChild(meta);box.appendChild(lab)});
 if(rows.length>150){var f=document.createElement('div');f.className='status';f.textContent='Showing 150 of '+rows.length+' — narrow with search.';box.appendChild(f)}}

/* ===== Drawer rendering ===== */
function updateRunControls(){var act=laneList().filter(function(l){return activeKeys().indexOf(l.key)>-1}),f=act[0];
 $('laneTxt').textContent=!act.length?'no lane':act.length===1?laneLabel(f):act.length+' lanes';
 $('laneDot').style.background=(f&&PROVIDERS[f.pid]&&PROVIDERS[f.pid].cfg.dotColor)||'#9090a8';
 var n=$('notice'),miss=[];act.forEach(function(l){var c=PROVIDERS[l.pid].cfg;if(c.requiresKey&&!keyOf(c)&&miss.indexOf(c.label)<0)miss.push(c.label)});
 n.textContent=isArtifact?'Lanes need a standalone browser tab. Inside claude.ai only Claude Native routes, so open this file directly.':'Add a key for '+miss.join(' and ')+' in ⚙ → Keys to run those lanes.';
 n.classList.toggle('on',isArtifact||miss.length>0)}
function renderLanes(){var box=$('laneList');box.innerHTML='';var act=activeKeys();
 laneList().forEach(function(l){var lab=document.createElement('label');lab.className='mrow'+(l.pinned?' pinned':'');
  var cb=document.createElement('input');cb.type='checkbox';cb.checked=act.indexOf(l.key)>-1;cb.addEventListener('change',function(){if(!setLane(l.key,cb.checked))cb.checked=false;renderLanes();renderCatalog()});
  var dot=document.createElement('span');dot.className='dot';dot.style.background=(PROVIDERS[l.pid]&&PROVIDERS[l.pid].cfg.dotColor)||'#9090a8';
  lab.appendChild(cb);lab.appendChild(dot);lab.appendChild(document.createTextNode((l.pinned?'★ ':'')+laneLabel(l)));
  if(l.pinned){var x=document.createElement('span');x.textContent=' ×';x.style.color='var(--coral)';x.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();S.settings.customLanes=S.settings.customLanes.filter(function(c){return c.key!==l.key});setLane(l.key,false);renderLanes();renderCatalog()});lab.appendChild(x)}
  box.appendChild(lab)});
 var n=act.length;$('laneCount').textContent=n+' of '+laneList().length+' lanes active (max '+MAX_LANES+')'+(n>6?' · large fan-outs can hit provider rate limits':'');updateRunControls()}
function renderKeyRows(){var box=$('keyFields');box.innerHTML='';
 usableProviders().filter(function(p){return!p.native}).forEach(function(p){var w=document.createElement('div');
  if(!p.requiresKey){w.className='status';w.textContent=p.label+' — no key needed';box.appendChild(w);return}
  var lab=document.createElement('label'),inp=document.createElement('input');lab.textContent=p.keyLabel||p.label+' Key';inp.type='password';inp.autocomplete='off';inp.placeholder=p.keyPlaceholder||'';inp.id='keyInput_'+p.keyStorageName;inp.value=getKey(p.keyStorageName);
  w.appendChild(lab);w.appendChild(inp);if(p.keyNote){var n=document.createElement('div');n.className='key-note';n.textContent=p.keyNote;w.appendChild(n)}box.appendChild(w)})}
function renderConfigUI(){var b=$('cfgBadge');b.textContent=configSource==='live'?'Config: Live':'Config: Local Fallback';b.dataset.state=configSource;
 if(!activeProv||!PROVIDERS[activeProv])activeProv=Object.keys(PROVIDERS)[0];renderLanes();renderCatalog();renderKeyRows()}
function openDrawer(){$('gearDrawer').classList.add('open');$('backdrop').classList.add('open')}
function closeDrawer(){$('gearDrawer').classList.remove('open');$('backdrop').classList.remove('open')}

/* ===== Markdown + copy ===== */
function md(t){var e=t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'),out=[],list=null;
 var inl=function(s){return s.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*\w])[*_]([^*_\n]+)[*_](?![*\w])/g,'$1<em>$2</em>')};
 function close(){if(list){out.push('</'+list+'>');list=null}}
 e.split('\n').forEach(function(l){var m;
  if(m=/^(#{1,3})\s+(.*)/.exec(l)){close();out.push('<h'+m[1].length+'>'+inl(m[2])+'</h'+m[1].length+'>')}
  else if(/^---+$/.test(l)){close();out.push('<hr>')}
  else if(m=/^\s*[-*]\s+(.*)/.exec(l)){if(list!=='ul'){close();out.push('<ul>');list='ul'}out.push('<li>'+inl(m[1])+'</li>')}
  else if(m=/^\s*\d+\.\s+(.*)/.exec(l)){if(list!=='ol'){close();out.push('<ol>');list='ol'}out.push('<li>'+inl(m[1])+'</li>')}
  else if(!l.trim())close();else{close();out.push('<p>'+inl(l)+'</p>')}});close();return out.join('')}
function copyToClipboard(text,btn){if(!text||!text.trim())return;var orig=btn.innerHTML;
 function ok(){btn.textContent='✓ Copied';btn.classList.add('copied');setTimeout(function(){btn.innerHTML=orig;btn.classList.remove('copied')},2000)}
 function bad(){btn.textContent='✗ Failed';setTimeout(function(){btn.innerHTML=orig},2000)}
 function ex(){var ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;left:-9999px;top:-9999px;opacity:0;font-size:12px;pointer-events:none;';ta.setAttribute('readonly','');
  document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,text.length);var r=false;try{r=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);r?ok():bad()}
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(ok).catch(ex);else ex()}
var COPY_SVG='<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V6a2 2 0 0 1 2-2h9"></path></svg> Copy';
function allText(){return Array.prototype.map.call(document.querySelectorAll('.card'),function(c,i){return'— Lane '+('0'+(i+1)).slice(-2)+': '+c.querySelector('.ct').textContent+' —\n\n'+c.querySelector('.cb').innerText}).join('\n\n')}

/* ===== Dispatch ===== */
function makeCard(grid,l){var card=document.createElement('div');card.className='card';
 var ch=document.createElement('div');ch.className='ch';var ct=document.createElement('span');ct.className='ct';ct.textContent=laneLabel(l);
 var st=document.createElement('span');st.className='st';st.textContent='Queued';var cp=document.createElement('button');cp.className='copy-btn';cp.innerHTML=COPY_SVG;
 var cb=document.createElement('div');cb.className='cb';cp.addEventListener('click',function(){copyToClipboard(cb.innerText,cp)});
 ch.appendChild(ct);ch.appendChild(st);ch.appendChild(cp);card.appendChild(ch);card.appendChild(cb);grid.appendChild(card);return{card:card,ct:ct,st:st,cb:cb}}
async function runLane(l,u){u.st.textContent='Streaming';
 try{var r=await callModel({provider:l.pid,model:l.m,system:S.settings.sys,user:$('input').value.trim(),onText:function(acc,served){u.cb.innerHTML=md(acc);if(served&&served!==l.m)u.ct.textContent=laneLabel(l)+' → served: '+served}});
  u.cb.innerHTML=md(r.text);u.st.textContent=r.cut?'Cut at token cap':'Complete'}
 catch(e){u.card.classList.add('error');u.cb.textContent=String(e.message||e);u.st.textContent='Error'}}
async function dispatch(){var input=$('input').value.trim();if(!input)return toast('Write a prompt first');
 var lanes=laneList().filter(function(l){return activeKeys().indexOf(l.key)>-1});if(!lanes.length)return toast('Select lanes in settings');
 resolveCustom(lanes);var out=$('out');out.innerHTML='';var grid=document.createElement('div');grid.className='grid';out.appendChild(grid);
 var cards=lanes.map(function(l){return makeCard(grid,l)}),btn=$('runBtn');btn.disabled=true;
 await Promise.all(lanes.map(function(l,i){return sleep(i*220).then(function(){return runLane(l,cards[i])})}));btn.disabled=false}

/* ===== Boot ===== */
$('gearBtn').addEventListener('click',openDrawer);$('laneBtn').addEventListener('click',openDrawer);$('backdrop').addEventListener('click',closeDrawer);
$('runBtn').addEventListener('click',dispatch);$('input').addEventListener('keydown',function(e){if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();dispatch()}});
$('copyAll').addEventListener('click',function(){copyToClipboard(allText(),this)});
$('catSearch').addEventListener('input',renderCatalog);
$('sysPrompt').value=S.settings.sys;$('sysPrompt').addEventListener('input',function(){S.settings.sys=this.value;save()});
$('saveKeysBtn').addEventListener('click',function(){var b=this;usableProviders().filter(function(p){return!p.native&&p.requiresKey}).forEach(function(p){var el=$('keyInput_'+p.keyStorageName);if(el)setKey(p.keyStorageName,el.value)});
 b.textContent='✓ Saved';updateRunControls();setTimeout(function(){b.textContent='Save keys';closeDrawer()},1500)});
$('clearKeysBtn').addEventListener('click',function(){usableProviders().filter(function(p){return!p.native}).forEach(function(p){storageRemove('hek_'+p.keyStorageName);(LEGACY_KEY_SLOTS[p.keyStorageName]||[]).forEach(storageRemove)});renderKeyRows();updateRunControls();toast('Saved keys cleared from this device')});
applyConfig('fallback');uiReady=true;renderConfigUI();fetchModelConfig(applyConfig);
