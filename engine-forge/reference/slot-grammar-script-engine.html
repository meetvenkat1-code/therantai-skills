<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>

*{box-sizing:border-box}html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--bg-void);color:var(--text-primary);font:15px/1.65 Georgia,'Times New Roman',serif}
button,select,textarea,input{font:inherit;color:inherit}
.header{position:fixed;top:0;left:0;right:0;height:48px;z-index:100;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 14px;background:var(--bg-surface);border-bottom:1px solid var(--bg-border)}
.zA{display:flex;align-items:center;gap:10px;min-width:0}.name{font-size:.95rem;letter-spacing:.04em;white-space:nowrap}
.badge{font:.62rem system-ui,sans-serif;padding:2px 8px;border-radius:10px;border:1px solid var(--bg-border);color:var(--text-muted);white-space:nowrap}.badge.live{color:var(--green);border-color:var(--green)}
.zB{display:flex;align-items:center;gap:8px;margin-left:auto}
.ib{background:none;border:1px solid var(--bg-border);border-radius:6px;width:30px;height:28px;cursor:pointer;color:var(--text-secondary)}.ib:hover{border-color:var(--accent-main);color:var(--accent-main)}
.sel{display:flex;align-items:center;gap:6px;border:1px solid var(--bg-border);border-radius:6px;padding:0 8px;height:28px;background:var(--bg-elevated)}
.sel select{background:none;border:0;outline:0;font:.74rem system-ui,sans-serif;color:var(--text-primary)}.sel option{background:var(--bg-elevated)}
.dot{width:9px;height:9px;border-radius:50%;background:#9090a8;flex-shrink:0}

.output-area{position:fixed;top:48px;bottom:150px;left:0;right:0;overflow-y:auto;padding:1.5rem}

.toolbar{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-bottom:10px}
.stat{margin-right:auto;font:.7rem system-ui,sans-serif;color:var(--text-muted)}

.copy-btn svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.8}.copy-btn:hover{border-color:var(--accent-main);color:var(--accent-main)}.copy-btn.copied{border-color:var(--green);color:var(--green)}

<div class="header">

<script>
/* MODEL CORE v2 (model-config-contract). Paste verbatim. Edit only the three CONSTANTS. */
var ENGINE_NAME = 'My Engine';                                   // CONSTANT 1: shown in X-Title
var CANONICAL_CONFIG_URL = 'https://raw.githubusercontent.com/meetvenkat1-code/therantai-config/refs/heads/main/model.json';   // CONSTANT 2: never vary
var LEGACY_KEY_SLOTS = {};                                       // CONSTANT 3: read-only fallbacks, e.g. { groq: ['rl.key.gq'], openrouter: ['rl.key.or'] }
var DEFAULT_TIMEOUT_MS = 15000, DEFAULT_IDLE_MS = 3000;
var isArtifact = window.self !== window.top;

var LOCAL_FALLBACK_CONFIG = {                                    // mirrors the live model.json providers and defaultLanes (2026-10-03); model_aliases are deliberately not duplicated
  native_model: 'claude-sonnet-4-6',
  defaultLanes: ['groq::openai/gpt-oss-120b', 'or-auto::openrouter/free'],
  providers: [
    { id: 'claude', native: true, label: 'Claude · Native', dotColor: '#ef4444', requiresKey: false, defaultFor: ['artifact'] },
    { id: 'groq', native: false, label: 'Groq', dotColor: '#22c55e', requiresKey: true, keyStorageName: 'groq', keyLabel: 'Groq API Key', keyPlaceholder: 'gsk_…', defaultFor: ['standalone'],
      endpoint: 'https://api.groq.com/openai/v1/chat/completions', authHeader: 'Authorization', authPrefix: 'Bearer ', requestFormat: 'openai-chat', streamFormat: 'openai',
      modelChain: ['openai/gpt-oss-120b', 'openai/gpt-oss-20b'], softFallback: { on: [429, 500, 502, 503], within: true }, hardFallback: 'or-auto', timeoutMs: 15000, idleMs: 3000 },
    { id: 'or-auto', native: false, label: 'OR · Free Router', dotColor: '#f97316', requiresKey: true, keyStorageName: 'openrouter', keyLabel: 'OpenRouter API Key', keyPlaceholder: 'sk-or-…',
      keyNote: 'Standalone only — OpenRouter has no CORS proxy inside claude.ai', standaloneOnly: true,
      endpoint: 'https://openrouter.ai/api/v1/chat/completions', authHeader: 'Authorization', authPrefix: 'Bearer ',
      extraHeaders: { 'HTTP-Referer': '$origin', 'X-Title': '$engineName' }, requestFormat: 'openai-chat', streamFormat: 'openai', modelChain: ['openrouter/free'], softFallback: { on: [429, 500, 502, 503], within: true }, timeoutMs: 45000, idleMs: 9000 }
  ]
};
var liveModelConfig = LOCAL_FALLBACK_CONFIG;                     // boot on the floor, upgrade when the fetch lands

var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
function natCmp(a, b) { return a.localeCompare(b, undefined, { numeric: true }); }
function cfgProviders() { return liveModelConfig.providers; }
function P(id) { return cfgProviders().filter(function (p) { return p.id === id; })[0] || null; }
function splitKey(k) { var i = k.indexOf('::'); return { provider: k.slice(0, i), model: k.slice(i + 2) }; }

function isValidConfig(j) {
  if (!j || !Array.isArray(j.providers) || !j.providers.length) return false;
  var ids = {}, natives = 0, usable = false;
  for (var i = 0; i < j.providers.length; i++) {
    var p = j.providers[i];
    if (!p || !p.id || !p.label || ids[p.id]) return false;
    ids[p.id] = 1;
    if (p.native === true) { natives++; if (isArtifact) usable = true; }
    else if (p.endpoint && p.requestFormat === 'openai-chat' && !(p.standaloneOnly && isArtifact)) usable = true;
  }
  return natives <= 1 && usable;                                 // never adopt a half-valid config
}
function usableProviders() {                                     // native only inside claude.ai; standalone never routes it
  return cfgProviders().filter(function (p) { return p.native === true ? isArtifact : !(p.standaloneOnly && isArtifact); });
}
function defaultLanes() {                                        // the floor: config's defaultLanes, else first model of the first usable provider
  var ok = usableProviders().map(function (p) { return p.id; });
  var list = (liveModelConfig.defaultLanes || []).filter(function (k) {
    if (k.indexOf('::') < 1) return false; var s = splitKey(k); return ok.indexOf(s.provider) > -1 && !P(s.provider).native;
  });
  if (!list.length) {
    var p = usableProviders().filter(function (x) { return !x.native && x.modelChain && x.modelChain.length; })[0];
    if (p) list = [p.id + '::' + p.modelChain[0]];
  }
  return list;
}

function getKey(name) {
  try {
    var v = localStorage.getItem('hek_' + name); if (v) return v.trim();
    var old = LEGACY_KEY_SLOTS[name] || [];
    for (var i = 0; i < old.length; i++) { var o = localStorage.getItem(old[i]); if (o) return o.trim(); }
  } catch (e) {}
  return '';
}
function setKey(name, value) { try { localStorage.setItem('hek_' + name, (value || '').trim()); } catch (e) {} }

function headersFor(cfg, key) {                                  // CHAT requests only (POST /chat/completions). The picker's GET /models does NOT use this: it uses catalogHeaders (model-catalog-panel v3.2), because these headers force a CORS preflight on a cross-origin GET
  var h = { 'Content-Type': 'application/json' };
  if (key && cfg.authHeader) h[cfg.authHeader] = (cfg.authPrefix || '') + key;
  Object.keys(cfg.extraHeaders || {}).forEach(function (k) {
    var v = cfg.extraHeaders[k];
    h[k] = v === '$origin' ? (window.location.origin !== 'null' ? window.location.origin : 'http://localhost') : v === '$engineName' ? ENGINE_NAME : v;
  });
  return h;
}
function retryAfterSeconds(res, msg) {                           // header first, then Groq's "try again in 26.6s / 1m3.5s / 250ms"
  var ra = parseFloat(res.headers && res.headers.get && res.headers.get('retry-after')); if (!isNaN(ra)) return ra;
  var m = /try again in\s+([0-9hms.]+)/i.exec(msg || ''); if (!m) return null;
  var t = 0; m[1].replace(/(\d+(?:\.\d+)?)(ms|h|m|s)/g, function (_, n, u) { t += parseFloat(n) * { ms: 0.001, s: 1, m: 60, h: 3600 }[u]; });
  return t || null;
}

function buildRequest(cfg, modelId, system, user, stream, maxTokens) {
  if (cfg.native === true) {                                     // HARDCODED BRANCH. Never built from cfg fields.
    return { url: 'https://api.anthropic.com/v1/messages',
      headers: { 'Content-Type': 'application/json', 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: { model: modelId, max_tokens: maxTokens || 4000, stream: stream, system: system || '', messages: [{ role: 'user', content: user }] } };
  }
  if (cfg.requestFormat !== 'openai-chat') throw new Error('Unknown requestFormat: ' + cfg.requestFormat);
  var h = headersFor(cfg, getKey(cfg.keyStorageName));
  var body = { model: modelId, stream: stream, messages: (system ? [{ role: 'system', content: system }] : []).concat([{ role: 'user', content: user }]) };
  if (maxTokens) body.max_tokens = maxTokens;
  return { url: cfg.endpoint, headers: h, body: body };
}

function readStream(res, format, onChunk, timeoutMs, idleMs, signal) {   // resolves { reason, error }; never rejects
  var rd = res.body.getReader(), dec = new TextDecoder(), buf = '', done = false, idleT, hardT, reason = null, err = null;
  timeoutMs = timeoutMs || DEFAULT_TIMEOUT_MS; idleMs = idleMs || DEFAULT_IDLE_MS;
  return new Promise(function (resolve) {
    function finish() { if (done) return; done = true; clearTimeout(idleT); clearTimeout(hardT); try { rd.cancel(); } catch (e) {} resolve({ reason: reason, error: err }); }
    function resetIdle() { clearTimeout(idleT); idleT = setTimeout(finish, idleMs); }
    hardT = setTimeout(finish, timeoutMs); resetIdle();
    if (signal) { if (signal.aborted) return finish(); signal.addEventListener('abort', finish, { once: true }); }
    (function pump() {
      if (done) return;
      rd.read().then(function (r) {
        if (done) return;
        if (r.done) return finish();
        buf += dec.decode(r.value, { stream: true });
        var lines = buf.split('\n'); buf = lines.pop();
        for (var i = 0; i < lines.length; i++) {
          var t = lines[i].trim();
          if (format === 'anthropic' && t === 'event: message_stop') return finish();   // named event line precedes its data: line
          if (t.indexOf('data:') !== 0) continue;
          var d = t.slice(5).trim(); if (d === '[DONE]') return finish();
          try {
            var p = JSON.parse(d);
            if (p.error) { err = (p.error.message || 'stream error'); return finish(); }
            if (format === 'anthropic') {
              if (p.type === 'content_block_delta' && p.delta && p.delta.text) { onChunk(p.delta.text, null); resetIdle(); }
              else if (p.type === 'message_delta' && p.delta && p.delta.stop_reason) reason = p.delta.stop_reason === 'max_tokens' ? 'length' : p.delta.stop_reason;
              else if (p.type === 'message_stop') return finish();
            } else {
              var c0 = p.choices && p.choices[0], dl = c0 && c0.delta;
              if (c0 && c0.finish_reason) reason = c0.finish_reason;
              if (dl && dl.content) { onChunk(dl.content, p.model || null); resetIdle(); }
              else if (dl && (dl.reasoning || dl.reasoning_content)) resetIdle();   // thinking counts as alive
            }
          } catch (e) {}
        }
        pump();
      }).catch(finish);
    })();
  });
}

/* ONE call layer, two modes.
   curated: callModel({ provider, system, user, onText, validate })         -> walks modelChain, soft/hard fallback
   strict : callModel({ provider, model, system, user, onText, maxTokens }) -> exactly that model, never falls through (lanes, panels)
   onText(accumulatedText, servedModelOrNull) fires on every chunk. Returns { text, model, served, cut }. */
async function callModel(o) {
  var cfg = P(o.provider), strict = !!o.model;
  if (!cfg) throw new Error('Unknown provider: ' + o.provider);
  if (cfg.standaloneOnly && isArtifact) throw new Error(cfg.label + ' is standalone only. It has no proxy inside claude.ai.');
  if (cfg.requiresKey && !getKey(cfg.keyStorageName)) throw new Error('No ' + (cfg.keyLabel || cfg.label) + ' saved. Open settings.');
  var models = strict ? [o.model] : (o.chain || (cfg.native ? [liveModelConfig.native_model] : cfg.modelChain) || []);
  var lastStatus = null, lastRetry = null;
  function fail(m) { var e = new Error(m); e.status = lastStatus; e.retryAfter = lastRetry; return e; }   // lets a panel engine show a 429 countdown
  function aborted() { if (o.signal && o.signal.aborted) { var e = new Error('Aborted'); e.name = 'AbortError'; throw e; } }
  var advance = ((cfg.softFallback && cfg.softFallback.on) || [429, 500, 502, 503]).concat([400, 404, 422]);
  var last = '';
  for (var i = 0; i < models.length; i++) {
    var retried = false, folded = false, fatal = null;
    for (var a = 0; a < 3; a++) {
      aborted();
      var acc = '', served = null, res;
      var sys = folded ? '' : o.system, usr = folded ? (o.system ? o.system + '\n\n---\n\n' : '') + o.user : o.user;
      try {
        var rq = buildRequest(cfg, models[i], sys, usr, true, o.maxTokens);
        res = await fetch(rq.url, { method: 'POST', headers: rq.headers, body: JSON.stringify(rq.body), signal: o.signal });
      } catch (e) { if (e && e.name === 'AbortError') throw e; last = cfg.id + ': network error ' + e.message; break; }
      if (!res.ok) {
        var msg = ''; try { var eb = await res.json(); msg = (eb.error && eb.error.message) || ''; } catch (e) {}
        lastStatus = res.status; lastRetry = retryAfterSeconds(res, msg);
        if (res.status === 429 && !retried) { retried = true; await sleep(1800); continue; }                       // one retry, then advance
        if (res.status === 400 && !folded && /system|developer|instruction/i.test(msg)) { folded = true; continue; }   // model rejects the system role
        last = cfg.id + ':' + res.status + (msg ? ' ' + String(msg).slice(0, 140) : '') + (res.status === 404 ? ' — model not found, refresh the catalog' : '');
        if (advance.indexOf(res.status) < 0) fatal = last;                                                          // 401/402/403/413: another model will not heal it
        break;
      }
      var out = await readStream(res, cfg.native === true ? 'anthropic' : (cfg.streamFormat || 'openai'), function (c, s) { acc += c; if (s) served = s; if (o.onText) o.onText(acc, served); }, cfg.timeoutMs, cfg.idleMs, o.signal);
      aborted();
      if (!acc.trim()) { last = cfg.id + ': empty reply' + (out.reason === 'length' ? ' — the token cap was spent on reasoning' : out.error ? ' — ' + out.error : ''); break; }
      if (o.validate && !cfg.native) { try { o.validate(acc); } catch (e) { last = cfg.id + ': rejected — ' + e.message; break; } }
      return { text: acc, model: models[i], served: served, cut: out.reason === 'length' };
    }
    if (fatal) throw fail(fatal);                                                                              // stops everything, hardFallback included
  }
  var hf = !strict && !o._noHard && cfg.hardFallback ? P(cfg.hardFallback) : null;                                 // strict calls never reach here: lane honesty
  if (hf) {
    if (hf.standaloneOnly && isArtifact) throw new Error('All providers exhausted (' + last + '). The fallback (' + hf.label + ') is standalone only.');
    if (hf.requiresKey && !getKey(hf.keyStorageName)) throw new Error('Provider unavailable (' + last + '). Fallback ' + hf.label + ' has no key.');
    return callModel({ provider: hf.id, chain: hf.modelChain, system: o.system, user: o.user, onText: o.onText, validate: o.validate, maxTokens: o.maxTokens, _noHard: true });
  }
  throw fail(strict ? last : 'Provider unavailable (' + last + ')');
}

function fetchModelConfig(onApplied) {                           // call once on load, after rendering from the floor
  return fetch(CANONICAL_CONFIG_URL + '?v=' + Date.now())
    .then(function (r) { if (!r.ok) throw new Error('Config fetch failed: ' + r.status); return r.json(); })
    .then(function (j) { if (!isValidConfig(j)) throw new Error('Malformed config'); liveModelConfig = j; return 'live'; })
    .catch(function () { liveModelConfig = LOCAL_FALLBACK_CONFIG; return 'fallback'; })
    .then(function (src) { if (onApplied) onApplied(src); return src; });
}

var KNOWN_MODEL_ALIASES = { 'mistralai/mistral-large': 'mistralai/mistral-large-2411', 'meta-llama/llama-3-70b-instruct': 'meta-llama/llama-3.3-70b-instruct' };
function modelAliases() { return Object.assign({}, KNOWN_MODEL_ALIASES, liveModelConfig.model_aliases || {}); }
function modelIdBase(id) { var q = id.split('-'); while (q.length > 1 && /^(v?\d[\d.]*|\d{4,})$/i.test(q[q.length - 1])) q.pop(); return q.join('-'); }
function resolveModelId(id, live) {                              // only against a catalog the user actually fetched; never across providers
  if (!live || !live.length || live.indexOf(id) > -1) return { id: id, status: 'ok' };
  var al = modelAliases()[id]; if (al && live.indexOf(al) > -1) return { id: al, status: 'alias' };
  var base = modelIdBase(id), c = live.filter(function (x) { return modelIdBase(x) === base; });
  if (c.length) return { id: c.sort(natCmp).reverse()[0], status: 'fuzzy' };
  return { id: id, status: 'unresolved' };
}
window.EnginePanels = { library:true, importExport:true, settings:true };
ENGINE_NAME = 'Slot-Grammar Script Engine';
var DEFAULT_PROMPT = "# SLOT-GRAMMAR SCRIPT ENGINE\n\nFIDELITY = 0.0\n# 0.0  closed-form metaphysical fiction: every claim lives inside an openly invented frame\n# 1.0  grounded explanatory prose: every claim is true, or marked as speculation\n# Values between interpolate. Read FIDELITY once, before writing. Never mention it in the output.\n\nOUTPUT_MODE = script\n# script        -> the monologue only\n# script+trace  -> the monologue, then a JSON trace (see TRACE)\n\n## INPUT\nThe user supplies a seed idea. Extract five variables from it:\n[DOMAIN]      the field the monologue borrows its voice from\n[TRUE KERNEL] one claim that is actually true, and from which everything departs\n[JARGON]      three to five terms native to the domain\n[INNER]       the human interior the argument will be turned toward (mind, self, perception)\n[ENDING]      the final verdict, one flat statement\nIf the seed lacks a true kernel, supply the nearest honest one. Never invent the kernel.\n\n## THE FIVE SLOTS (fixed order, none skipped, none repeated)\n1. HOOK       A fork posed as a question: two live alternatives, one concrete and one uncanny. 1-2 sentences, 8-16 words each.\n2. AUTHORITY  Invokes the domain and states the TRUE KERNEL with maximum confidence. 1 sentence, 22-34 words, at least one JARGON term.\n3. BRIDGE     One inferential step beyond the kernel, phrased as an implication. 1 sentence, 22-34 words.\n4. WITNESS    A second authority or observation that turns the argument toward [INNER]. 1 sentence, 24-36 words, at least one JARGON term.\n5. COLLAPSE   The verdict. 1-2 sentences, at most 12 words each, no jargon, no hedging, ends on [ENDING].\n\n## CADENCE LAW\nSentence length rises from Hook to Witness, then contracts sharply at Collapse.\nModal strength rises by slot: interrogative -> asserts (\"holds\", \"dictates\") -> implies -> demonstrates (\"have realized\", \"show\") -> is.\nAbsolutes (\"entirely\", \"every\", \"exactly\") are permitted only from Witness onward.\nOne register throughout: no colloquialism, no contractions, no first person.\nTotal length 90-140 words. No headings, lists or commentary inside the script.\n\n## FIDELITY GOVERNS EXACTLY THREE THINGS\nA. Authority sourcing\n   <= 0.3  authorities may be invented but must belong to the fiction (unnamed \"cosmologists\", \"the model\"); never a real named person or institution.\n   0.4-0.7 authorities are real fields and real concepts only; no invented studies.\n   >= 0.8  every attributed claim must be checkable; otherwise attribute to no one.\nB. Bridge validity\n   <= 0.3  the bridge may be a leap, but must read as the fiction's own logic.\n   0.4-0.7 the bridge must be a defensible analogy, flagged by \"as if\" or \"resembles\".\n   >= 0.8  the bridge must be a valid inference or be marked \"one speculation is that\".\nC. Collapse certainty\n   <= 0.3  flat verdict, in-world.\n   0.4-0.7 verdict is stated as the narrator's conclusion, not as fact.\n   >= 0.8  Collapse becomes an honest open question, and modal strength is capped at \"suggests\" in Witness.\nEverything else (slot order, lengths, ladder) is invariant across FIDELITY.\n\n## SCOPE GUARD\n- Never attribute a false claim to a real, named person, institution or publication.\n- Never assert false medical, psychological or safety claims, at any fidelity.\n- At FIDELITY <= 0.3 the piece must read as fiction by its frame; if the user wants it presented as factual or persuasive, raise FIDELITY to at least 0.8 and say so in one line.\n- The Collapse addresses \"you\" only at FIDELITY <= 0.3; above that, use \"one\" or the third person.\n\n## DISTRESS EXIT\nIf the seed or any message shows personal distress (isolation, derealization, hopelessness, thoughts of self-harm), drop the template at once. No slots, no verdict. Reply in plain, warm language, acknowledge what was said, and gently suggest a trusted person or a local crisis line. Resume only if the person asks.\n\n## TRACE (only when OUTPUT_MODE = script+trace)\nAfter the script, emit one JSON block:\n{\"fidelity\": <n>, \"variables\": {...},\n \"slots\": [{\"slot\": \"HOOK\", \"words\": <n>, \"modal_level\": <0-4>}, ...],\n \"checks\": {\"order_ok\": bool, \"length_ok\": bool, \"ladder_monotonic\": bool, \"contraction_ok\": bool, \"jargon_ok\": bool}}\nCompute the counts honestly; report false where a check fails.\n\n## COGNITIVE IDENTITY\nThis engine forges five-slot monologues from a seed idea so that a writer can dial a claim between closed-form fiction and grounded explanation.";
var PROMPT_SLUG = 'slot-grammar-script-engine';
var $ = function(id){ return document.getElementById(id); };
var mode = 'script', running = false, lastText = '', lastSeed = '', promptEntry = null;

/* storage abstraction (UI Contract 21): window.storage in artifacts, localStorage standalone */
async function sGet(k){ try{ if(isArtifact){ var r = await window.storage.get(k); return r ? r.value : null; } return localStorage.getItem(k); }catch(e){ return null; } }
async function sSet(k,v){ try{ if(isArtifact){ await window.storage.set(k,v); } else localStorage.setItem(k,v); return true; }catch(e){ return false; } }
async function sList(p){ try{ if(isArtifact){ var r = await window.storage.list(p); return r ? r.keys : []; } var a=[]; for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(k && k.indexOf(p)===0) a.push(k); } return a; }catch(e){ return []; } }

/* markdown (UI Contract 02): innerHTML + parser, escape first, rendered per chunk */
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function inl(s){ return s.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|[\s(])[*_]([^*_\n]+)[*_](?=[\s).,;:!?]|$)/g,'$1<em>$2</em>'); }
function renderMarkdown(t){
  var parts = esc(t).split(/```[a-z]*\n?/), html = '';
  parts.forEach(function(seg,i){
    if(i%2){ html += '<pre><code>'+seg.replace(/\n$/,'')+'</code></pre>'; return; }
    seg.split(/\n{2,}/).forEach(function(b){
      b = b.trim(); if(!b) return;
      if(/^---+$/.test(b)) html += '<hr>';
      else if(/^#{1,3} /.test(b)){ var n=b.match(/^#+/)[0].length; html += '<h'+n+'>'+inl(b.replace(/^#+ /,''))+'</h'+n+'>'; }
      else if(/^([-*]) /.test(b)) html += '<ul>'+b.split('\n').map(function(l){ return '<li>'+inl(l.replace(/^[-*] /,''))+'</li>'; }).join('')+'</ul>';
      else if(/^\d+\. /.test(b)) html += '<ol>'+b.split('\n').map(function(l){ return '<li>'+inl(l.replace(/^\d+\. /,''))+'</li>'; }).join('')+'</ol>';
      else html += '<p>'+inl(b).replace(/\n/g,'<br>')+'</p>';
    });
  });
  return html;
}

/* canonical copy (UI Contract 05), sole transport */
function copyToClipboard(text, btn) {
  if (!text || !text.trim()) return;
  var origHTML = btn.innerHTML;
  var ICON_CHECK = '<svg viewBox="0 0 24 24" style="width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
  function onSuccess() { btn.innerHTML = ICON_CHECK + ' Copied'; btn.classList.add('copied'); setTimeout(function(){ btn.innerHTML=origHTML; btn.classList.remove('copied'); },2000); }
  function onFail() { btn.textContent = '✗ Failed'; setTimeout(function(){ btn.innerHTML=origHTML; },2000); }
  function execCopy() {
    var ta = document.createElement('textarea'); ta.value = text;
    ta.style.cssText = 'position:fixed;left:-9999px;top:-9999px;opacity:0;font-size:12px;pointer-events:none;';
    ta.setAttribute('readonly','');
    document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0,text.length);
    var ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta); ok ? onSuccess() : onFail();
  }
  if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(onSuccess).catch(execCopy); }
  else { execCopy(); }
}
function liveText(){ return $('out').innerText.trim(); }
function download(name, text, type){ var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:type||'text/plain'})); a.download=name; document.body.appendChild(a); a.click(); document.body.removeChild(a); setTimeout(function(){ URL.revokeObjectURL(a.href); },1000); }

/* provider layer (rendered from config; Model Core owns the rest) */
function getSelectedProvider(){ var s=$('providerSelect'); return (s && s.value) || defaultProviderId(); }
function providerBlockedHere(id){ var p=P(id); return !!(p && p.standaloneOnly && isArtifact); }
function defaultProviderId(){ var ps=usableProviders(), want=isArtifact?'artifact':'standalone'; var d=ps.filter(function(p){ return (p.defaultFor||[]).indexOf(want)>-1; })[0]||ps[0]; return d && d.id; }
function updateProviderDot(){ var p=P($('providerSelect').value); $('providerDot').style.background=(p && p.dotColor)||'#9090a8'; }
function renderProviderSelector(){ var sel=$('providerSelect'), keep=sel.value; sel.innerHTML=''; usableProviders().forEach(function(p){ sel.appendChild(new Option(p.label,p.id)); }); sel.value=usableProviders().some(function(p){ return p.id===keep; })?keep:defaultProviderId(); updateProviderDot(); updateBanner(); }
function updateBanner(){
  var p=P(getSelectedProvider()), b=$('banner'), msg='';
  if(p && !p.native){ if(p.standaloneOnly && isArtifact) msg=p.keyNote||'Standalone only.'; else if(p.requiresKey && !getKey(p.keyStorageName)) msg='No '+(p.keyLabel||p.label)+' saved. Open ⚙ settings to add one.'; }
  b.textContent=msg; b.classList.toggle('on',!!msg);
}
function renderDrawerKeyRows(){
  var c=$('drawerKeyRows'); c.innerHTML='';
  cfgProviders().forEach(function(p){
    var row=document.createElement('div'); row.style.marginBottom='12px';
    var lab=document.createElement('div'); lab.textContent=p.keyLabel||p.label; row.appendChild(lab);
    if(!p.requiresKey){ var n=document.createElement('div'); n.className='mut'; n.textContent='No key needed — platform routes natively'; row.appendChild(n); c.appendChild(row); return; }
    var inp=document.createElement('input'); inp.type='password'; inp.placeholder=p.keyPlaceholder||''; inp.value=getKey(p.keyStorageName); row.appendChild(inp);
    if(p.keyNote){ var kn=document.createElement('div'); kn.className='note'; kn.textContent=p.keyNote; row.appendChild(kn); }
    var sv=document.createElement('button'); sv.className='copy-btn'; sv.textContent='Save'; sv.style.marginTop='6px';
    sv.addEventListener('click',function(){ setKey(p.keyStorageName,inp.value); sv.textContent='✓ Saved'; updateBanner(); setTimeout(function(){ sv.textContent='Save'; setPanel('G',false); },1500); });
    row.appendChild(sv); c.appendChild(row);
  });
}
function setCfgBadge(src){ var b=$('cfgBadge'); b.textContent='Config: '+(src==='live'?'Live':'Local Fallback'); b.classList.toggle('live',src==='live'); }

/* panels (UI Contract 01): independent backdrop + toggle per panel */
function setPanel(k,open){ var el=k==='L'?$('leftPanel'):k==='R'?$('rightPanel'):$('gearDrawer'); el.classList.toggle('open',open); $('bd'+k).classList.toggle('on',open); }
function bindPanel(k,btn){ $(btn).addEventListener('click',function(){ var el=k==='L'?$('leftPanel'):k==='R'?$('rightPanel'):$('gearDrawer'); setPanel(k,!el.classList.contains('open')); if(k==='R') renderResponses(); }); $('bd'+k).addEventListener('click',function(){ setPanel(k,false); }); }

/* prompt library: the system prompt is an editable entry, never a sealed constant (Hybrid Contract) */
async function loadPrompt(){
  var raw = await sGet('prompts:'+PROMPT_SLUG), e = null;
  try{ e = raw ? JSON.parse(raw) : null; }catch(x){}
  promptEntry = e || { name:PROMPT_SLUG, triggers:['slot grammar','monologue'], description:'Five-slot monologue forge with FIDELITY dial', body:DEFAULT_PROMPT, source:'manual', imported:new Date().toISOString() };
  $('promptName').value = promptEntry.name; $('promptBody').value = promptEntry.body;
}
async function savePrompt(entry){ promptEntry = entry; await sSet('prompts:'+PROMPT_SLUG, JSON.stringify(entry)); $('promptName').value=entry.name; $('promptBody').value=entry.body; }
function buildSystem(){
  var f = parseFloat($('fid').value).toFixed(1);
  return $('promptBody').value.replace(/^FIDELITY\s*=.*$/m,'FIDELITY = '+f).replace(/^OUTPUT_MODE\s*=.*$/m,'OUTPUT_MODE = '+mode);
}

/* response library: auto-saves on completion, tagged with source prompt (UI Contract 20) */
async function saveResponse(text){
  var id = 'r'+Date.now().toString(36);
  var e = { id:id, name:lastSeed.slice(0,60), promptSlug:PROMPT_SLUG, fidelity:parseFloat($('fid').value).toFixed(1), mode:mode, input:lastSeed, output:text, created:new Date().toISOString() };
  await sSet('responses:'+id, JSON.stringify(e));
}
async function allResponses(){ var ks = await sList('responses:'), out=[]; for(var i=0;i<ks.length;i++){ var v = await sGet(ks[i]); try{ if(v) out.push(JSON.parse(v)); }catch(e){} } return out.sort(function(a,b){ return a.created<b.created?1:-1; }); }
async function renderResponses(){
  var list = await allResponses(), c = $('rList'); c.innerHTML='';
  if(!list.length){ c.innerHTML='<div class="mut">No responses yet.</div>'; return; }
  list.forEach(function(r){ var d=document.createElement('div'); d.className='item'; d.innerHTML='<b></b><small></small>'; d.firstChild.textContent=r.name||'(untitled)'; d.lastChild.textContent=r.created.slice(0,16).replace('T',' ')+' · fidelity '+r.fidelity+' · '+r.mode;
    d.addEventListener('click',function(){ $('out').innerHTML=renderMarkdown(r.output); lastText=r.output; lastSeed=r.input; $('seed').value=r.input; $('fid').value=r.fidelity; syncFid(); stat(r.output); setPanel('R',false); }); c.appendChild(d); });
}
function pickFile(inp, cb){ inp.value=''; inp.onchange=function(){ var f=inp.files[0]; if(!f) return; var rd=new FileReader(); rd.onload=function(){ cb(String(rd.result), f.name); }; rd.readAsText(f); }; inp.click(); }

/* run: one call, curated mode, accumulated text (Hybrid Contract; no Promise.all) */
function syncFid(){ var v=parseFloat($('fid').value); $('fv').textContent=v.toFixed(1); $('band').textContent = v<=0.3?'closed-form fiction':v<=0.7?'defensible analogy':'grounded, checkable'; }
function stat(t){ var s=t.split(/\n```/)[0]; $('stat').textContent = s.trim().split(/\s+/).filter(Boolean).length+' words in script'; }
async function run(){
  if(running) return;
  var seed = $('seed').value.trim(); if(!seed) return;
  var pid = getSelectedProvider();
  if(providerBlockedHere(pid)){ updateBanner(); return; }
  running = true; $('run').disabled = true; $('run').textContent='Forging…'; lastSeed = seed; $('out').innerHTML='<span class="empty">Burning…</span>';
  try{
    var r = await callModel({ provider:pid, system:buildSystem(), user:seed, onText:function(acc){ $('out').innerHTML = renderMarkdown(acc); lastText = acc; stat(acc); $('outArea').scrollTop = 0; } });
    lastText = r.text; $('out').innerHTML = renderMarkdown(r.text); stat(r.text);
    await saveResponse(r.text);
  }catch(e){ $('out').innerHTML = '<p style="color:var(--coral)">'+esc(e.message||String(e))+'</p>'; }
  running = false; $('run').disabled = false; $('run').textContent='Forge';
}

/* boot */
syncFid(); bindPanel('L','btnL'); bindPanel('R','btnR'); bindPanel('G','btnG');
$('fid').addEventListener('input',syncFid);
[$('m1'),$('m2')].forEach(function(b){ b.addEventListener('click',function(){ mode=b.dataset.m; $('m1').classList.toggle('on',mode==='script'); $('m2').classList.toggle('on',mode==='script+trace'); }); });
$('run').addEventListener('click',run);
$('seed').addEventListener('keydown',function(e){ if(e.key==='Enter' && (e.ctrlKey||e.metaKey)){ e.preventDefault(); run(); } });
$('providerSelect').addEventListener('change',function(){ updateProviderDot(); updateBanner(); });
$('copyAll').addEventListener('click',function(){ copyToClipboard(lastText||liveText(), this); });
$('copyCard').addEventListener('click',function(){ copyToClipboard(liveText(), this); });
$('expTxt').addEventListener('click',function(){ var t=lastText||liveText(); if(t) download('slot-grammar-'+Date.now()+'.txt', t); });
$('clearKeys').addEventListener('click',function(){ try{ cfgProviders().forEach(function(p){ if(p.keyStorageName){ localStorage.removeItem('hek_'+p.keyStorageName); (LEGACY_KEY_SLOTS[p.keyStorageName]||[]).forEach(function(o){ localStorage.removeItem(o); }); } }); }catch(e){} renderDrawerKeyRows(); updateBanner(); });
$('pSave').addEventListener('click',function(){ var e=Object.assign({},promptEntry,{ name:$('promptName').value||PROMPT_SLUG, body:$('promptBody').value }); savePrompt(e); });
$('pReset').addEventListener('click',function(){ savePrompt(Object.assign({},promptEntry,{ body:DEFAULT_PROMPT })); });
$('pImp').addEventListener('click',function(){ pickFile($('fMd'),function(t,n){ savePrompt(Object.assign({},promptEntry,{ body:t, source:'markdown', imported:new Date().toISOString(), name:n.replace(/\.\w+$/,'') })); }); });
$('pExp').addEventListener('click',function(){ download('prompts-'+PROMPT_SLUG+'.json', JSON.stringify([Object.assign({},promptEntry,{ body:$('promptBody').value })],null,2),'application/json'); });
$('pImpJ').addEventListener('click',function(){ pickFile($('fPJ'),function(t){ try{ var a=JSON.parse(t); if(Array.isArray(a) && a[0]) savePrompt(Object.assign({},promptEntry,a[0],{ imported:new Date().toISOString() })); }catch(e){} }); });
$('rExp').addEventListener('click',async function(){ download('responses-'+PROMPT_SLUG+'.json', JSON.stringify(await allResponses(),null,2),'application/json'); });
$('rImp').addEventListener('click',function(){ pickFile($('fRJ'),async function(t){ try{ var a=JSON.parse(t); for(var i=0;i<a.length;i++){ if(a[i] && a[i].id && !(await sGet('responses:'+a[i].id))) await sSet('responses:'+a[i].id, JSON.stringify(a[i])); } renderResponses(); }catch(e){} }); });
renderProviderSelector(); renderDrawerKeyRows(); loadPrompt();
fetchModelConfig(function(src){ renderProviderSelector(); renderDrawerKeyRows(); setCfgBadge(src); });
